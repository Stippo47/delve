<!doctype html>
<meta charset="utf-8">
<title>Delve sound render</title>
<!-- Renders the game's sound for a stretch of play into a WAV, offline (no speakers): tools/sound-render.mjs drives it.
     The run is stepped exactly like the game (60 steps a second, a sound frame every 1/30 s) and every cue goes
     through the same engine as on the phone, into an OfflineAudioContext. Address switches: the game's (?bossroom, ?lvl=N). -->
<script type="module">
import { Engine, SOUNDS } from '../js/audio.js';
import { listen } from '../js/sfx.js';
import { newRun, update } from '../js/dungeon.js';
import { setSeed } from '../js/util.js';

// o = { camp (seconds of camp first), secs (seconds of the run), skip (run seconds to pass silently first), theme, party, seed, sr }
window.renderSound = async (o) => {
  const sr = o.sr || 44100, camp = o.camp || 0, total = camp + o.secs;
  listen(true);
  setSeed(o.seed || 1);
  const run = newRun({ heroes: {}, depth: 1 }, { theme: o.theme, party: o.party });
  for (let i = 0; i < (o.skip || 0) * 60 && run.phase !== 'won' && run.phase !== 'lost'; i++) update(run, 1 / 60);
  const c = new OfflineAudioContext(2, Math.ceil(total * sr), sr);
  const eng = new Engine(c); await eng.ready;
  const played = {}, plays = [], real = eng.play.bind(eng);
  eng.play = (name, op, when, project) => { const ok = real(name, op, when, project); if (ok) { played[name] = (played[name] || 0) + 1; plays.push([+when.toFixed(2), name]); } return ok; };
  // where a sound is: left/right by its place across the room from the party's middle (portrait: world y is across)
  const project = (x, y) => { const hs = run.world.units.filter((u) => u.team === 'hero' && !u.downed); if (!hs.length) return { pan: 0, gain: 1 };
    const cy = hs.reduce((a, h) => a + h.y, 0) / hs.length, cx = hs.reduce((a, h) => a + h.x, 0) / hs.length;
    return { pan: Math.max(-1, Math.min(1, (y - cy) / 260)) * 0.6, gain: Math.max(0.3, 1 - Math.max(0, Math.hypot(x - cx, y - cy) - 450) / 500) }; };
  const F = 1 / 30;
  let state = 'camp', ended = null;
  for (let f = 0; f * F < total; f++) {
    const t = f * F;
    if (t >= camp && state === 'camp') state = 'run';
    if (state === 'run') {
      for (let k = 0; k < 2 && run.phase !== 'won' && run.phase !== 'lost' && run.phase !== 'retreated'; k++) update(run, 1 / 60);
      if (!ended && (run.phase === 'won' || run.phase === 'lost')) ended = t;
      if (ended && t - ended > 1.5) state = 'result';
    }
    eng.frame({ state, run, speed: 1, quiet: !!o.musicOnly, project }, t, F);
  }
  const buf = await c.startRendering();
  const { wav, peak } = toWav(buf, sr);
  return { wav, played, plays, peak, phase: run.phase, floor: run.floor };
};
// 16-bit stereo WAV, as base64
function toWav(buf, sr) {
  const n = buf.length, ch = [buf.getChannelData(0), buf.getChannelData(1)];
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (p, s) => { for (let i = 0; i < s.length; i++) out.setUint8(p + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
  out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
  str(36, 'data'); out.setUint32(40, n * 4, true);
  let peak = 0;
  for (let i = 0; i < n; i++) for (let k = 0; k < 2; k++) { const v = Math.max(-1, Math.min(1, ch[k][i])); peak = Math.max(peak, Math.abs(v)); out.setInt16(44 + i * 4 + k * 2, v * 32767, true); }
  const bytes = new Uint8Array(out.buffer); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { wav: btoa(bin), peak };
}
// Every effect one after another (a listening board), and a table of how each one measures.
window.renderBoard = async (o) => {
  const sr = o.sr || 44100, gap = 0.35;
  const names = Object.keys(SOUNDS).filter((n) => !o.only || o.only.includes(n));
  const total = names.reduce((a, n) => a + SOUNDS[n][0] + gap, 0.5);
  const c = new OfflineAudioContext(2, Math.ceil(total * sr), sr);
  const eng = new Engine(c); await eng.ready;
  const table = [];
  let t = 0.3;
  for (const n of names) {
    const b = eng.buffers[n][0], d = b.getChannelData(0);
    let sum = 0, peak = 0, tail = 0; for (let i = 0; i < d.length; i++) { sum += d[i] * d[i]; peak = Math.max(peak, Math.abs(d[i])); }
    for (let i = Math.floor(d.length * 0.95); i < d.length; i++) tail = Math.max(tail, Math.abs(d[i]));
    table.push({ n, at: +t.toFixed(2), len: b.duration, rms: +(10 * Math.log10(sum / d.length + 1e-12)).toFixed(1), peak: +peak.toFixed(2), tail: +tail.toFixed(3) });
    const s = c.createBufferSource(); s.buffer = b; s.connect(eng.sfxBus); s.start(t);
    t += SOUNDS[n][0] + gap;
  }
  const buf = await c.startRendering();
  return { wav: toWav(buf, sr).wav, table };
};
window.renderReady = true;
</script>
