  <!-- Round 10 ("Just make grey. Also their hands are uneven"): cold grey bone, both hands the same fist. MINION (round 9, the Necromancer's raised dead): the jawless Rattler with no spear and no lower jaw, punching with bare claws. From rattler-jawless-spear.svg. | Round 4: the lower jaw is back, as its own bone below the skull with a dark gap between; the spear claw is turned to the shaft (knuckles down the shaft) | was: SKELETON round 3 "Rattler, no jaw" (spear): no lower jaw, upper teeth hang free. Parts in draw order: #arm-r (long spear + claw; drawn first so the shaft runs under the shoulder and its butt shows behind), #body (skull + shoulder balls), #arm-l (empty claw). Facing = DOWN (+y), centre (100,100). -->
