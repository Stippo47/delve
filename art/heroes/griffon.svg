<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- Round 5: the face opening moved up and closed at the bottom: it now stops above the mouth, so the helm covers the mouth and chin in one solid piece (no thin sliver under the chin); the helm is as tall as before. -->
<!-- Round 4: helm with a much wider open face (cheek guards, open at the chin) and the beak cut down to a short brow peak; warhammer head about 1.3x bigger on a longer haft; the fist wraps the haft. -->
<!-- Round 3 (was Bastion C): new griffon helm: big feathered gold wings, purple feather crest, gold beak visor over the upper face. Warhammer (arm-l) drawn before #body; shield (arm-r) in front. -->
<!-- KNIGHT Bastion C 'Griffon' (round 2): tank knight: round bascinet with gold wings and the face showing, huge squared purple spaulders with gold rims, silver heater shield with a purple chevron on the right arm (hand hidden), warhammer in the left hand. -->
<!-- Parts layout: #back, #body, #arm-l, #arm-r, #front inside #sprite; the outline comes from the #outline filter over the whole figure (no outline strokes in the shapes). Facing = DOWN (+y), centre (100,100). -->
