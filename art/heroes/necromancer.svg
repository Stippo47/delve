<!-- NECROMANCER (round 5, redone; new staff): a deep black-violet hood edged in bone-white, with a ragged front edge and a long drooping point; dark violet robe; a staff made of a spine (stacked vertebrae) topped with a horned skull, green fire in its sockets, in the right fist (behind the body); an open left fist (round 9: its green flame is what he throws now, so it is gone from the hand; the staff is held lower down). -->
