<!-- WATER MAGE (round 17, lane water17): a PLACEHOLDER sketch for the designer's art round, built on the Frost Mage's file (same base body, same construction: one sprite, front = down, centre 100,100, inked outline, soft gradients lit from the left). A deep-sea hood with a sea-foam ruff, a water-drop gem at the front, curling wave crests on the shoulders, a driftwood staff in the right fist with a ball of water at its head; empty left fist. -->
