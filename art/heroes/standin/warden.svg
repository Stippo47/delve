<svg data-standin="warden: tower recoloured (tools/standins.mjs)" xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- Round 4: eye slots back (two dark slots either side of the centre); a new flanged mace (steel head with flanges, gold collar, wooden haft); the fist wraps the haft. -->
