<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- RANGED Ninja (round 5): charcoal hood and mask; the lower face covering now curves up in the middle (over the nose), so the face shows as a slit dipping at the centre; two crimson scarf tails behind; no katana. A big shuriken pinched in each hand (arm-l, arm-r, drawn before #body). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
