<!-- RANGED Javelin huntress (round 5): the ponytail now runs straight back from the crown; a better headband: a wide coral band woven with a gold zigzag, a gold bead at each temple and tie-ends trailing behind. Darker skin, long dark hair over the shoulders, spotted pelt, spare javelins on the back. A javelin in the right hand (arm-r, drawn before #body), left hand free. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
