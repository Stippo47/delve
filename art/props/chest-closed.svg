<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- CHEST, closed (the free one, treasure rooms): planked lid seen from above with gold bands and a gold lock plate, the front face below. 48 room units wide, 48 front to back. It is the mimic's chest on purpose, so the mimic is a surprise. Stays upright on screen. -->
  <defs>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A86E3C"/><stop offset="0.38" stop-color="#D99E60"/><stop offset="1" stop-color="#8E5A30"/></linearGradient>
    <linearGradient id="gWoodDk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E5A30"/><stop offset="1" stop-color="#6E4222"/></linearGradient>
    <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FAD06A"/><stop offset="1" stop-color="#D9952A"/></linearGradient>
    <linearGradient id="gBrass" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#E0A82A"/></linearGradient>
    <linearGradient id="shX" x1="96" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2B1A10" stop-opacity="0"/><stop offset="1" stop-color="#2B1A10" stop-opacity="0.32"/></linearGradient>
    <path id="lid" d="M56 40 H144 A18 18 0 0 1 162 58 V112 H38 V58 A18 18 0 0 1 56 40 Z"/>
    <clipPath id="lidC"><use href="#lid"/></clipPath>
    <path id="front" d="M44 108 H156 V148 A10 10 0 0 1 146 158 H54 A10 10 0 0 1 44 148 Z"/>
    <clipPath id="frontC"><use href="#front"/></clipPath>
  </defs>
  <g id="sprite">
    <use href="#front" fill="url(#gWoodDk)"/>
    <g clip-path="url(#frontC)"><rect x="56" y="20" width="12" height="150" fill="url(#gBand)"/><rect x="132" y="20" width="12" height="150" fill="url(#gBand)"/><rect x="36" y="110" width="130" height="50" fill="url(#shX)"/></g>
    <use href="#lid" fill="url(#gWood)"/>
    <g clip-path="url(#lidC)">
      <path d="M38 62 H162 M38 86 H162" stroke="#8E5A30" stroke-width="3" opacity="0.4"/>
      <rect x="56" y="20" width="12" height="150" fill="url(#gBand)"/><rect x="132" y="20" width="12" height="150" fill="url(#gBand)"/>
      <rect x="36" y="100" width="130" height="12" fill="url(#gBand)"/>
      <rect x="36" y="36" width="130" height="80" fill="url(#shX)"/>
      <ellipse cx="78" cy="72" rx="26" ry="5" fill="#FFFFFF" opacity="0.28"/>
    </g>
    <rect x="44" y="112" width="112" height="5" fill="#2B2230" opacity="0.3"/>
    
    <path d="M84 98 H116 V126 C116 134 108 140 100 142 C92 140 84 134 84 126 Z" fill="#2B2230" opacity="0.25" transform="translate(3 4)"/><path d="M84 98 H116 V126 C116 134 108 140 100 142 C92 140 84 134 84 126 Z" fill="url(#gBrass)"/><rect x="84" y="98" width="32" height="6" rx="3" fill="#FFF3C4" opacity="0.6"/><path d="M100 110 A5 5 0 0 1 103 119 L105 128 H95 L97 119 A5 5 0 0 1 100 110 Z" fill="#5A3A1E"/>
  </g>
</svg>
