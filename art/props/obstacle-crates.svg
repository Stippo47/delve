<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- CRATE STACK: a big crate with a smaller one stacked on it and a barrel beside, seen from above. Drawn at radius 30 room units (fits the round collider). Scale by r/30. -->
  <defs>
    <linearGradient id="gCrate" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#D79A5C"/><stop offset="1" stop-color="#A36A3A"/></linearGradient>
    <linearGradient id="shX2" x1="0.3" y1="0" x2="1" y2="0.2"><stop offset="0" stop-color="#2B1A10" stop-opacity="0"/><stop offset="1" stop-color="#2B1A10" stop-opacity="0.28"/></linearGradient>
    <linearGradient id="gBarrel" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#C98A50"/><stop offset="1" stop-color="#8E5A30"/></linearGradient>
    <linearGradient id="gHoop" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#A7ADB6"/><stop offset="1" stop-color="#5E636D"/></linearGradient>
  </defs>
  <g id="sprite">
    <g transform="translate(86 96) rotate(-8)">
      <path d="M-44 -50 H44 A6 6 0 0 1 50 -44 V44 A6 6 0 0 1 44 50 H-44 A6 6 0 0 1 -50 44 V-44 A6 6 0 0 1 -44 -50 Z" fill="url(#gCrate)"/>
      <path d="M-31 -34 H31 A3 3 0 0 1 34 -31 V31 A3 3 0 0 1 31 34 H-31 A3 3 0 0 1 -34 31 V-31 A3 3 0 0 1 -31 -34 Z" fill="#6E3F1E" opacity="0.6"/>
      <clipPath id="cA"><path d="M-31 -34 H31 A3 3 0 0 1 34 -31 V31 A3 3 0 0 1 31 34 H-31 A3 3 0 0 1 -34 31 V-31 A3 3 0 0 1 -31 -34 Z"/></clipPath>
      <g clip-path="url(#cA)">
        <path d="M-50 40.4 L40.4 -50 L50 -40.4 L-40.4 50 Z" fill="url(#gCrate)"/>
        <path d="M-50 -14 H50 M-50 14 H50" stroke="#6E4222" stroke-width="3" opacity="0.35"/>
      </g>
      <path d="M-44 -50 H44 A6 6 0 0 1 50 -44 V44 A6 6 0 0 1 44 50 H-44 A6 6 0 0 1 -50 44 V-44 A6 6 0 0 1 -44 -50 Z" fill="url(#shX2)"/>
      <ellipse cx="-20" cy="-42" rx="20" ry="3" fill="#FFFFFF" opacity="0.3"/>
    </g>
    <g>
      <circle cx="148" cy="150" r="31" fill="url(#gHoop)"/>
      <circle cx="148" cy="150" r="24" fill="url(#gBarrel)"/>
      <path d="M128 142 H168 M128 158 H168" stroke="#6E4222" stroke-width="3" opacity="0.35"/>
      <circle cx="148" cy="150" r="24" fill="url(#shX2)"/>
      <circle cx="141" cy="152" r="4" fill="#5A3A1E" opacity="0.8"/>
      <ellipse cx="137" cy="134" rx="9" ry="3" transform="rotate(-25 137 134)" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <clipPath id="bigC"><path d="M-44 -50 H44 A6 6 0 0 1 50 -44 V44 A6 6 0 0 1 44 50 H-44 A6 6 0 0 1 -50 44 V-44 A6 6 0 0 1 -44 -50 Z" transform="translate(86 96) rotate(-8)"/></clipPath>
    <g clip-path="url(#bigC)"><path d="M-25 -31 H25 A6 6 0 0 1 31 -25 V25 A6 6 0 0 1 25 31 H-25 A6 6 0 0 1 -31 25 V-25 A6 6 0 0 1 -25 -31 Z" transform="translate(104 78) rotate(16) translate(6 9)" fill="#2B2230" opacity="0.35"/></g>
    <g transform="translate(104 78) rotate(16)">
