      <path d="M-18.1 -21.1 H18.1 A3 3 0 0 1 21.1 -18.1 V18.1 A3 3 0 0 1 18.1 21.1 H-18.1 A3 3 0 0 1 -21.1 18.1 V-18.1 A3 3 0 0 1 -18.1 -21.1 Z" fill="#6E3F1E" opacity="0.6"/>
      <clipPath id="cB"><path d="M-18.1 -21.1 H18.1 A3 3 0 0 1 21.1 -18.1 V18.1 A3 3 0 0 1 18.1 21.1 H-18.1 A3 3 0 0 1 -21.1 18.1 V-18.1 A3 3 0 0 1 -18.1 -21.1 Z"/></clipPath>
      <g clip-path="url(#cB)">
