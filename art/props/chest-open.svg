<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- CHEST, open and empty (the coins spill out round it): the lid thrown back behind the box showing its planked inside, the gold bands round its edge and the hasp hanging off its far edge; the box empty and dark inside. #glow (no outline) is a brief warm light the game fades. 48 room units wide. Stays upright on screen. -->
  <defs>
    <filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gWoodDk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E5A30"/><stop offset="1" stop-color="#6E4222"/></linearGradient><linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FAD06A"/><stop offset="1" stop-color="#D9952A"/></linearGradient><linearGradient id="gBrass" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#E0A82A"/></linearGradient><linearGradient id="gLidIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E2E18"/><stop offset="1" stop-color="#74462A"/></linearGradient><linearGradient id="gRim" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#C98A50"/><stop offset="1" stop-color="#9A6234"/></linearGradient><linearGradient id="gCav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E1A10"/><stop offset="1" stop-color="#5A341E"/></linearGradient><linearGradient id="shX" x1="96" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2B1A10" stop-opacity="0"/><stop offset="1" stop-color="#2B1A10" stop-opacity="0.32"/></linearGradient><path id="front" d="M44 108 H156 V148 A10 10 0 0 1 146 158 H54 A10 10 0 0 1 44 148 Z"/><clipPath id="frontC"><use href="#front"/></clipPath><path id="cav" d="M54 56 H146 V104 A4 4 0 0 1 142 108 H58 A4 4 0 0 1 54 104 Z"/><clipPath id="cavC"><use href="#cav"/></clipPath><clipPath id="lidC"><path d="M40 46 V20 A14 14 0 0 1 54 6 H146 A14 14 0 0 1 160 20 V46 Z"/></clipPath>
  <radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF4C8" stop-opacity="0.8"/><stop offset="1" stop-color="#FFD45A" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="sprite" filter="url(#outline)">
    <!-- the lid, thrown back past upright: we see its planked inside, the gold bands round its edge and the hasp hanging from its far edge -->
    <path d="M40 46 V20 A14 14 0 0 1 54 6 H146 A14 14 0 0 1 160 20 V46 Z" fill="url(#gLidIn)"/>
    <g clip-path="url(#lidC)">
      <path d="M40 18 H160 M40 32 H160" stroke="#3E2414" stroke-width="2.5" opacity="0.45"/>
      <rect x="36" y="4" width="130" height="8" fill="url(#gBand)"/>
      <rect x="56" y="4" width="12" height="44" fill="url(#gBand)" opacity="0.85"/><rect x="132" y="4" width="12" height="44" fill="url(#gBand)" opacity="0.85"/>
      <rect x="36" y="38" width="130" height="10" fill="#2B1A10" opacity="0.3"/>
    </g>
    <path d="M88 4 H112 V-4 C112 -9 106 -12 100 -12 C94 -12 88 -9 88 -4 Z" fill="url(#gBrass)"/>
    <!-- the box: its front below, its rim all round, and inside it empty -->
    <use href="#front" fill="url(#gWoodDk)"/>
    <g clip-path="url(#frontC)"><rect x="56" y="20" width="12" height="150" fill="url(#gBand)"/><rect x="132" y="20" width="12" height="150" fill="url(#gBand)"/><rect x="36" y="108" width="130" height="52" fill="url(#shX)"/></g>
    <path d="M40 44 H160 V112 H40 Z" fill="url(#gRim)"/>
    <rect x="56" y="44" width="12" height="68" fill="url(#gBand)"/><rect x="132" y="44" width="12" height="68" fill="url(#gBand)"/>
    <use href="#cav" fill="url(#gCav)"/>
    <g clip-path="url(#cavC)">
      <rect x="52" y="56" width="96" height="14" fill="#1E120C" opacity="0.45"/>
      <path d="M52 80 H148 M52 94 H148" stroke="#2B1A10" stroke-width="2.5" opacity="0.4"/>
      <rect x="132" y="56" width="16" height="50" fill="#1E120C" opacity="0.25"/>
    </g>
    <path d="M40 45 H160" stroke="#2B1A10" stroke-width="5" opacity="0.5"/>
    <rect x="72" y="38" width="14" height="14" rx="3" fill="#5A5458"/><rect x="114" y="38" width="14" height="14" rx="3" fill="#5A5458"/>
    <rect x="74" y="40" width="10" height="3" rx="1.5" fill="#B8B2B8" opacity="0.7"/><rect x="116" y="40" width="10" height="3" rx="1.5" fill="#B8B2B8" opacity="0.7"/>
  </g>
  <g id="glow">
    <ellipse cx="100" cy="82" rx="70" ry="44" fill="url(#gGlow)" opacity="0.6"/>
  </g>
</svg>
