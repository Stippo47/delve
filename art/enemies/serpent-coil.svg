<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GAME COPY (art round 10) of design/class-round10/enemies/dunes-serpent-coil.svg -->
<!-- SAND SERPENT, a body segment (round 10): one length of the snake's body seen from above, a rounded link a little longer than the step between segments, so each overlaps the next and they read as one body; down its back the pattern: a dark diamond edged pale in the middle and half of one at each end (they meet the neighbours'), paler on the left flank and darker on the right. No parts. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
<defs>
<filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="gHand" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8D4B2"/><stop offset="1" stop-color="#DFA57F"/></radialGradient><linearGradient id="gUnder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A2E2A" stop-opacity="0.5"/><stop offset="0.45" stop-color="#5A2E2A" stop-opacity="0"/></linearGradient><linearGradient id="gFace" x1="0" y1="95" x2="0" y2="153" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B07560"/><stop offset="0.2" stop-color="#D9A27F"/><stop offset="0.45" stop-color="#F2C7A0"/><stop offset="0.85" stop-color="#F4CBA6"/><stop offset="1" stop-color="#E6B590"/></linearGradient><linearGradient id="gFaceSide" x1="100" y1="0" x2="156" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8A4E36" stop-opacity="0"/><stop offset="1" stop-color="#8A4E36" stop-opacity="0.28"/></linearGradient>
<path id="s1" d="M 100 25 H 100 A 55 55 0 0 1 155 80 V 120 A 55 55 0 0 1 100 175 H 100 A 55 55 0 0 1 45 120 V 80 A 55 55 0 0 1 100 25 Z"/>
<linearGradient id="g1" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#D9B574"/><stop offset="1" stop-color="#CC9737"/></linearGradient>
<linearGradient id="g2" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E501A" stop-opacity="0"/><stop offset="1" stop-color="#6E501A" stop-opacity="0.42"/></linearGradient>
<clipPath id="c1"><use href="#s1"/></clipPath>
</defs>
<g id="sprite" filter="url(#outline)">
<g id="body">
<use href="#s1" fill="url(#g1)"/><use href="#s1" fill="url(#g2)"/><g clip-path="url(#c1)"><path d="M 100 -3.5 L 124 29 L 100 61.5 L 76 29 Z" fill="#6E4A2A" stroke="#F0DCA8" stroke-width="4" stroke-linejoin="round"/><path d="M 100 8.5 L 112 29 L 100 49.5 L 88 29 Z" fill="#A8803E"/><path d="M 100 67.5 L 124 100 L 100 132.5 L 76 100 Z" fill="#6E4A2A" stroke="#F0DCA8" stroke-width="4" stroke-linejoin="round"/><path d="M 100 79.5 L 112 100 L 100 120.5 L 88 100 Z" fill="#A8803E"/><path d="M 100 138.5 L 124 171 L 100 203.5 L 76 171 Z" fill="#6E4A2A" stroke="#F0DCA8" stroke-width="4" stroke-linejoin="round"/><path d="M 100 150.5 L 112 171 L 100 191.5 L 88 171 Z" fill="#A8803E"/><rect x="40" y="0" width="14" height="200" fill="#F0DCA8" opacity="0.4"/><rect x="146" y="0" width="14" height="200" fill="#A8803E" opacity="0.45"/></g>
</g>
</g>
</svg>
