<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GAME COPY (art round 10) of design/class-round10/enemies/dunes-cobra.svg -->
<!-- COBRA (round 10): a cobra reared to strike, seen from above: its body in one neat coil behind (two turns, dark bands across it, the thin tail lying out to one side: #back, sways), the neck rising from the middle of the coil into a broad spread hood with a dark chevron on its back and a pale rim, a wedge of a head with two brow ridges (no eyes) and a forked tongue (#front, it flicks). Sandy gold, banded brown. Parts: #back (coil), #body (hood and head), #front (tongue). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
