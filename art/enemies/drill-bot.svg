<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GAME COPY (art round 10) of design/class-round10/enemies/foundry-drill-bot.svg -->
<!-- DRILL BOT (round 10): a burrowing machine seen from above, two parts: one squat rounded body in safety yellow with two black chevrons pointing forward, a track down each side and a short exhaust stack behind (#back); and a great conical steel drill as wide as the body on an iron collar (arm-r: it drives forward when it strikes). Parts: #back (stack), #body, #arm-r (drill). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
