<use href="#pBraidTip" fill="url(#gHair)"/>
<use href="#pBraid" fill="url(#gHair)"/>
<g clip-path="url(#cBraid)" stroke="#3A281C" stroke-width="1.8" fill="none" opacity="0.7"><path d="M96 80 C98.5 82 101.5 82 104 80 M95.5 89 C98.5 91 101.5 91 104.5 89 M95.5 98 C98.5 100 101.5 100 104.5 98"/><rect x="80" y="40" width="40" height="90" fill="url(#gShade)" stroke="none"/></g>
<rect x="94.5" y="75" width="11" height="4.5" rx="2.2" fill="url(#gRope)"/>
<use href="#pBun" fill="url(#gHair)"/>
<g clip-path="url(#cBun)"><circle cx="97.5" cy="109" r="2.5" fill="#FFFFFF" opacity="0.18"/><use href="#pBun" fill="url(#gShade)"/></g>
</g></g>
</g>
</svg>
