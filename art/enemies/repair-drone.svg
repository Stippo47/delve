<!-- GAME COPY (art round 10) of design/class-round10/enemies/foundry-repair-drone.svg -->
<!-- REPAIR DRONE (round 10): a small flying mender seen from above: one round white shell with a green cross painted on it (it mends), a spinning rotor on a strut at each side (#back), a wrench in front on the right and a welding torch with a blue flame on the left (arm-r, arm-l: they lift when it mends). Parts: #back (rotors), #arm-l / #arm-r (tools), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
