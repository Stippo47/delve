<!-- ICICLE WRAITH (round 9): Ghost B (the pale blue spirit the designer picked, kept for the cold ghost) as it was, with icicles hanging off its shroud: a fringe of icy points along both sides and down the tail, two at each sleeve's end. Ghost B: a pale blue spirit seen from above, with eyes: a teardrop, the round head at the front with two tall dark eyes and no mouth, the body narrowing behind it into a plump tail that ends in a small round curl; two rounded sleeves of arms reach forward and out. No fold down the back (round 8). Parts: #arm-l / #arm-r (the arms, before #body), #body (head, tail and face). Front = DOWN (+y). -->
