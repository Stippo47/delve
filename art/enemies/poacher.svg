<!-- GAME COPY (art round 10) of design/class-round10/enemies/bandit-poacher.svg -->
<!-- POACHER (round 10): a woodland hunter, not one of the masked gang: an olive hunter's cap with a turned-up brim coming to a point at the front and a long pheasant feather lying back, a scruffy brown beard, a grey wolf-fur mantle over leather; a short dark recurve bow held out in front (arm-l, with its string, which the game draws to the drawing hand) and an arrow in the drawing hand (arm-r); a rolled net slung on the back (#back). No eyes. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
