<!-- GAME COPY (art round 8) of design/class-round8/enemies/bandit-poacher.svg -->
<!-- POACHER (round 8): a woodland hunter, not one of the masked gang: a drab olive hood (not the archer's leaf green) with its tail lying back, a scruffy brown beard, a grey fur mantle over leather; a short dark recurve bow held out in front (arm-l, with its string, which the game draws to the drawing hand) and an arrow in the drawing hand (arm-r); a rolled net slung on the back (#back), for the net it throws. No eyes. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
