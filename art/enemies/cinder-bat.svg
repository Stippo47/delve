<!-- GAME COPY (art round 9) of design/class-round9/enemies/ember-cinder-bat.svg -->
<!-- CINDER BAT (round 9): the round-7 bat (the designer's pick) as a bat of cinders: its shapes as they were (a big round head with no body behind it, two big broad pointed ears standing up and out, a small snout with two fangs, membrane wings with a scalloped trailing edge), charred black, the wing bones and cracks across the head glowing orange like embers, the ears glowing inside, a trail of embers streaming behind. No eyes. Parts: #back (the ember trail, sways), #arm-l / #arm-r (the wings, pivots at the shoulders, so the game flaps them), #body (head and ears). Scaled 0.8. Front = DOWN (+y). -->
