<!-- GAME COPY (art round 10) of design/class-round10/enemies/spire-cherub.svg -->
<!-- CHERUB (round 10): a little love-archer of the host seen from above, kin to the choir sprite: a round head with a cap of golden curls and the heroes' small mouth (no eyes), a white wrap with a rose sash, two small white wings (#back, sway); a small gold bow held out in front (arm-l, with its string, which the game draws to the drawing hand) and an arrow tipped with a heart in the drawing hand (arm-r). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
