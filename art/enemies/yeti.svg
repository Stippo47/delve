<!-- GAME COPY (art round 9) of design/class-round9/enemies/frost-yeti.svg -->
<!-- YETI (round 9): the troll's body plan in white fur (the designer: "the same shape and fighting style as trolls ... rolls its boulders as large snowballs"): a huge hunched back under a shaggy white coat with a ragged edge, a blue-grey shag over the hump, a small blue-grey face pushed forward under a white fur hood with a ragged fringe, a broad flat nose and a wide mouth with two fangs, no eyes; long furry arms reaching forward either side of the head, huge blue-grey hands turned in to hold its snowball (a prop of its own in the game, yeti-snowball). Parts: #arm-l, #arm-r (arm and hand, before #body so the coat covers the shoulders), #body. Front = DOWN (+y). -->
