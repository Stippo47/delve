<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GAME COPY (art round 9) of design/class-round9/enemies/foundry-gear-sprite.svg -->
<!-- GEAR SPRITE (round 9): a rolling cog seen from straight above (the designer: "top down so u see it as a circle"): a steel cog with ten square teeth, a darker rim inside them, four round holes and a brass hub with bolts. No face. It spins as it rolls. Parts: #body only. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
