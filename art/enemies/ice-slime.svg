<linearGradient id="gIce10" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#C4EAFA"/><stop offset="1" stop-color="#6EB4E2"/></linearGradient>
