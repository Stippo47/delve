<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GAME COPY (art round 10) of design/class-round10/enemies/frost-ice-slime.svg -->
<!-- ICE SLIME (round 10): the game's slime (the picked slime, tail removed) made of ice: the same soft rounded cube, glassy, white at the top left going clear blue, three ice shards frozen inside it where the slime has its bone, a frosted rim, a bright shine. No eyes, no tail. Parts: #body only (it hops whole). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
