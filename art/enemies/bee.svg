<!-- GAME COPY (art round 10) of design/class-round10/enemies/foundry-bee.svg -->
<!-- BEE (round 10: "1 maybe 2 body segments. Not 3"): a mechanical bee seen from above, in copper: one plump round body, striped with two dark iron bands, a short stinger at the back, the front end a little darker for a head with two short feelers; one wing of thin pale plate a side (arm-l, arm-r: they flap). The bronze and steel ones are this art turned by the game. No eyes. Parts: #arm-l / #arm-r (wings), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
