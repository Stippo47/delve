<!-- PLACEHOLDER (round 9, lane E): stand-in art copied from the design rounds until the real art for this enemy is drawn. -->
<!-- BEAST Boar (tamer B): a hulking dark boar with a bristly ridge down the spine, small ears, a flat pink-grey snout and two big curved white tusks. A beast companion, about a hero's size, seen from above, head forward (+y). Parts: #back (tail, sways about its pivot), #body (torso, hind legs, head), #arm-l / #arm-r (front legs, swing to walk). No eyes (the designer cut eyes on the monsters). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
