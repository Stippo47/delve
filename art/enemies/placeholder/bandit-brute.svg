<!-- PLACEHOLDER (round 9, lane E): stand-in art copied from the design rounds until the real art for this enemy is drawn. -->
<!-- Round 5 (A): new spikes - five big fat iron cones, evenly spaced (two out of each side, one out of the end), each split light/dark down the middle; an iron band round the club. No thin points, no starburst. -->
<!-- Round 4: a better club - bigger, straight, pale wood thickening to a rounded end, iron spikes out of both sides and the tip, nail heads; the fist wraps the handle. -->
<!-- Round 3: spiked club (arm-r) drawn before #body; the handle is under the right paw, the club comes out diagonally under the face. -->
  <!-- BARBARIAN Bearskin (round 2): grizzly hide mantle with forepaws, bear-head helm (ears, long pale snout, fangs). Weapon (club) now in the right hand, low and point forward; club = fat wooden club with iron spikes along both sides, axe = double-bit war axe. Parts: body / arm-l (empty fist) / arm-r (hand + club). Facing = DOWN (+y). -->
