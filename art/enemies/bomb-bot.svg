<!-- GAME COPY (art round 11) of design/class-round11/enemies/foundry-bomb-bot.svg -->
<!-- BOMB BOT (round 10): a walking bomb seen from above: one round black iron bomb (round 11: no hazard band), a short brass fuse neck on top with a twisted cord curling out of it to an ember, a brass wind-up key standing out of its back (#back, sways), two stubby brass feet under the body at its left and right (round 11) (arm-l, arm-r: they swing as it runs). The game draws the sparks when it is lit. Parts: #back (key), #arm-l / #arm-r (feet), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
