<!-- GAME COPY (art round 8) of design/class-round8/enemies/sewer-croc.svg -->
<!-- CROC (round 8: the picked Croc A with two axes; LIZARDMAN C "croc" round 6, version a: the round-4 design without eyes; was round 4 variant). A heavier swamp croc-man: dark moss-brown hide, a broad flat snout with three teeth a side tucked under the jaw so only their points show (round 7), eyes on raised bumps, a double row of armour ridges down the back of the head. Two heavy axes (round 8: the designer, "Has 2 axes, bite is an ability"), one in each clawed fist, both under the shoulders with the blades turned in. Parts: #back = thick tail, #arm-r and #arm-l = axe + fist (before #body), #body. Facing = DOWN (+y), centre (100,100). -->
