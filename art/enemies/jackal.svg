<!-- GAME COPY (art round 10) of design/class-round10/enemies/dunes-jackal.svg -->
<!-- JACKAL GUARD (round 10): the round-9 guard's shape and colours, drawn again: a tomb guard with a jackal's head, the heroes' bust build: black fur, a head the size of the heroes', a long jackal snout pointing forward with a gold stripe, tall pointed ears standing up and back, gold inside, a broad collar in bands of gold, turquoise and lapis over white linen; a gold-bladed spear under the right shoulder (arm-r, it thrusts), a round bronze shield with a gold sun boss on the left (arm-l). No eyes. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
