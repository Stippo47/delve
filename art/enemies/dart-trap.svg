<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GAME COPY (art round 10) of design/class-round10/enemies/dunes-dart-trap.svg -->
<!-- DART TRAP (round 10): a trap set in a tomb wall, seen from above, built like the Foundry's wall turrets: a carved sandstone block built out from the wall with a turquoise band along its lip and a round socket in its front edge (#back: it stays on the wall), and half in the socket the part that turns to aim: a round stone head with a gold winged sun carved on it and a dark slot of a mouth with three darts in it, points out. No eyes. Parts: #back (the block), #body (the head). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
