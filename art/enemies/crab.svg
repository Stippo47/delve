<!-- GAME COPY (art round 8) of design/class-round8/enemies/sewer-crab.svg -->
<!-- SEWER CRAB (round 8): a crab seen from above, armoured from the front: a wide rusty-red shell with a smooth armoured front lip, four jointed legs a side (#back), two big pincers held forward (arm-l, arm-r, so the game snaps them when it pinches); pale tips. No eyes. Its blue and green kinds are this art with the colours turned (js/foes9.js). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
