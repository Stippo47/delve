<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GAME COPY (art round 9) of design/class-round9/enemies/boss-goblin-chieftain.svg -->
<!-- THE GOBLIN CHIEFTAIN (round 9): the round-8 chieftain (the round-7 Troll A, mohawk, which the designer said to keep "but not as a troll") made the goblins' chief: the goblins' yellow-lime skin, their long hooked nose, wide grin with two small fangs and huge swept-back ears, no eyes; the ragged red war crest kept, now with a band of bone across the brow and three white brown-tipped feathers at the back of the crest; red war paint (a handprint on the left shoulder, stripes on the right); a cleaver in the right fist, a bundle of three spears tied across its back (#back, sways), the left fist free. Hunched shoulders and sizes as before. Parts: #back (the spears), #arm-r (cleaver + fist), #body, #arm-l (free fist). Front = DOWN (+y). -->
