<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Delve">
<meta name="theme-color" content="#2F2734">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Delve</title>
<style>
  :root { --ink:#2B2230; --paper:#EDE6D8; --gold:#F2B53A; --green:#5FA35A; --red:#C8553D;
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #2F2734; color: var(--ink); overflow: hidden;
    font: 700 14px/1.2 system-ui, -apple-system, "SF Pro Rounded", sans-serif; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .btn { color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 12px; box-shadow: 0 3px 0 var(--ink); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn.big { background: var(--gold); font-size: 18px; padding: 10px 18px; }
  .btn.small { padding: 3px 9px; border-radius: 9px; font-size: 13px; }

  /* HUD */
  #hud { position: fixed; left: 0; right: 0; top: 0; height: calc(46px + var(--st)); padding: var(--st) calc(10px + var(--sr)) 0 calc(10px + var(--sl));
    display: flex; align-items: center; gap: 8px; color: var(--paper); pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .chip { display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 3px 8px 3px 3px; position: relative; }
  .chip img { width: 34px; height: 34px; }
  .chip.down img { filter: grayscale(1) brightness(0.7); }
  .chip .bars { display: flex; flex-direction: column; gap: 3px; min-width: 52px; }
  .bar { height: 6px; border-radius: 3px; background: var(--ink); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #7CC06F; }
  .bar.xp > i { background: var(--gold); }
  .chip .lv { font-size: 11px; opacity: 0.85; }
  #where { flex: 1; text-align: center; font-size: 13px; opacity: 0.9; }
  .pill { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.25); padding: 5px 9px; border-radius: 12px; }
  .coin { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); border: 2px solid var(--ink); display: inline-block; }
  .keyi { width: 10px; height: 14px; border-radius: 5px 5px 2px 2px; background: #FFD45A; border: 2px solid var(--ink); display: inline-block; }
  .bag { width: 13px; height: 13px; border-radius: 4px 4px 6px 6px; background: #A0683A; border: 2px solid var(--ink); display: inline-block; }

  /* Panels */
  .screen { position: fixed; inset: 0; padding: calc(12px + var(--st)) calc(14px + var(--sr)) calc(12px + var(--sb)) calc(14px + var(--sl));
    background: #2F2734; display: flex; gap: 12px; }
  .card { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 10px; box-shadow: 0 4px 0 var(--ink); }
  #camp .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #camp .left { width: 190px; flex: none; }
  #camp .mid { flex: 1.4; flex-direction: row; }
  #camp .right { flex: 1; min-width: 0; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
  h2 { margin: 0 0 6px; font-size: 14px; opacity: 0.7; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .hero img { width: 74px; height: 74px; }
  .hero .name { font-size: 15px; }
  .hero .stats { font-size: 11px; opacity: 0.75; font-weight: 600; }
  .hero.target { outline: 4px dashed var(--gold); outline-offset: 2px; }
  .slot { width: 100%; min-height: 38px; border: 2px dashed rgba(43,34,48,0.35); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; padding: 4px; }
  .slot.filled { border-style: solid; background: #fff8e8; }
  .inv { display: flex; flex-wrap: wrap; gap: 6px; overflow-y: auto; align-content: flex-start; flex: 1; }
  .item { display: flex; align-items: center; gap: 6px; background: #fff8e8; border: 2px solid var(--ink); border-radius: 10px; padding: 4px 8px 4px 4px; font-size: 12px; }
  .item.sel { background: var(--gold); }
  .gem { width: 18px; height: 18px; border-radius: 6px; border: 2px solid var(--ink); transform: rotate(45deg); flex: none; }
  #desc { font-size: 12px; font-weight: 600; min-height: 30px; opacity: 0.8; }
  .depth { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .depth b { font-size: 26px; }
  .muted { font-size: 12px; font-weight: 600; opacity: 0.7; }

  #result { align-items: center; justify-content: center; }
  #result .card { width: min(460px, 90vw); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #result h1 { font-size: 28px; }
  #banner { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 30px; color: var(--paper);
    text-shadow: 0 3px 0 var(--ink), 0 0 12px rgba(0,0,0,0.5); pointer-events: none; }
  #rotate { position: fixed; inset: 0; background: #2F2734; color: var(--paper); display: none; align-items: center; justify-content: center; text-align: center; font-size: 18px; padding: 30px; z-index: 50; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="chips" style="display:flex;gap:6px"></div>
  <div id="where"></div>
  <span class="pill"><span class="coin"></span><span id="hCoins">0</span></span>
  <span class="pill"><span class="keyi"></span><span id="hKeys">0</span></span>
  <span class="pill"><span class="bag"></span><span id="hBag">0</span></span>
  <button class="btn small" id="speedBtn">1×</button>
  <button class="btn small" id="retreatBtn">Retreat</button>
</div>
<div id="banner" class="hidden"></div>

<div id="camp" class="screen hidden">
  <div class="col left">
    <div class="card"><h1>Camp</h1><div class="muted" style="margin-top:4px"><span class="coin"></span> <span id="cCoins">0</span> coins</div></div>
    <div class="card">
      <h2>Dungeon depth</h2>
      <div class="depth"><button class="btn small" id="dMinus">−</button><b id="dVal">1</b><button class="btn small" id="dPlus">+</button></div>
      <div class="muted" id="dRec" style="margin-top:6px"></div>
    </div>
    <button class="btn big" id="enterBtn">Enter dungeon</button>
    <div class="muted" id="campNote" style="color:var(--paper)"></div>
  </div>
  <div class="col mid card" id="heroCards"></div>
  <div class="col right card">
    <h2>Satchel finds (tap one, then tap a hero)</h2>
    <div class="inv" id="inv"></div>
    <div id="desc"></div>
  </div>
</div>

<div id="result" class="screen hidden"><div class="card" id="resultCard"></div></div>
<div id="rotate">Turn your phone sideways</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
