<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Delve">
<meta name="theme-color" content="#2F2734">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Delve</title>
<style>
  :root { --ink:#2B2230; --paper:#EDE6D8; --gold:#F2B53A; --green:#5FA35A; --red:#C8553D;
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #2F2734; color: var(--ink); overflow: hidden;
    font: 700 14px/1.2 system-ui, -apple-system, "SF Pro Rounded", sans-serif; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .btn { color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 12px; box-shadow: 0 3px 0 var(--ink); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn.big { background: var(--gold); font-size: 18px; padding: 10px 18px; }
  .btn.small { padding: 3px 9px; border-radius: 9px; font-size: 13px; }

  #banner { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 30px; color: var(--paper);
    text-shadow: 0 3px 0 var(--ink), 0 0 12px rgba(0,0,0,0.5); pointer-events: none; }
  @media (orientation: portrait) {
    #banner.soft { font-size: 18px; top: auto; bottom: calc(150px + var(--sb)); transform: translateX(-50%); opacity: .9; }
  }
</style>
<link rel="stylesheet" href="css/camp.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/looks.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-row">
    <button class="hbtn" id="pauseBtn" aria-label="pause"><svg class="i-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg><svg class="i-play" viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg></button>
    <span class="pill"><span class="coin"></span><span id="hCoins">0</span></span>
    <span class="pill hgem"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 3h12l5 6-11 13L1 9z" fill="#2B2230"/><path d="M7.2 5.2h9.6l3.4 4L12 18.6 3.8 9.2z" fill="#5FD0E8"/></svg><span id="hGems">0</span></span>
    <span class="pill"><span class="keyi"></span><span id="hKeys">0</span></span>
    <span class="pill"><span class="bag"></span><span id="hBag">0</span></span>
    <span class="hud-gap"></span>
    <button class="btn small" id="speedBtn">1×</button>
    <button class="btn small" id="retreatBtn">Leave</button>
  </div>
  <div class="hud-row where-row"><div id="where"></div><canvas id="mapCanvas"></canvas></div>
  <div id="bossBar" class="hidden"><span id="bossName">Bone King</span><div class="bar"><i></i></div></div>
</div>
<div id="dock" class="hidden"><div id="cards"></div></div>
<div id="inspect" class="hidden"></div>
<div id="banner" class="hidden"></div>

<div id="camp" class="hidden">
  <header class="topbar">
    <span class="logo">Delve</span>
    <span class="purse"><span class="coin"></span><b id="cGold">0</b></span>
    <span class="purse"><svg class="i-gem" viewBox="0 0 24 24"><path d="M6 3h12l5 6-11 13L1 9z" fill="#2B2230"/><path d="M7.2 5.2h9.6l3.4 4L12 18.6 3.8 9.2z" fill="#5FD0E8"/><path d="M7.2 5.2h9.6L12 9.6z" fill="#B8F0FA"/><path d="M3.8 9.2h16.4L12 18.6z" fill="#2FA6C9"/></svg><b id="cGems">0</b></span>
  </header>
  <main id="campMain"></main>
  <nav class="tabs">
    <button data-act="tab:camp"><svg viewBox="0 0 24 24"><path d="M12 1c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#2B2230"/><path d="M12 5c1 3 4 5 4 8.4a4 4 0 0 1-8 0c0-1.6.8-2.8 1.6-3.6.3 1.5 1.2 2.4 2.2 2.4.4-2.6-.4-4.8.2-7.2z" fill="#FF9A3D"/><path d="M12 12c.8 1 1.8 1.8 1.8 3a1.8 1.8 0 0 1-3.6 0c0-1 .9-2 1.8-3z" fill="#FFE07A"/></svg>Camp</button>
    <button data-act="tab:heroes"><svg viewBox="0 0 24 24"><path d="M3 15C3 7 7 2 12 2s9 5 9 13v6h-6.5v-5h-5v5H3z" fill="#2B2230"/><path d="M5.4 15.4C5.4 9 8 4.6 12 4.6s6.6 4.4 6.6 10.8v3.2h-2v-5H7.4v5h-2z" fill="#B4BCC8"/><rect x="11" y="3" width="2" height="10" fill="#F2B53A"/></svg>Heroes</button>
    <button data-act="tab:shop"><svg viewBox="0 0 24 24"><path d="M8 6a4 4 0 0 1 8 0h3l2 16H3L5 6z" fill="#2B2230"/><path d="M7 8.4h10l1.6 11.2H5.4z" fill="#C0844A"/><path d="M10 6a2 2 0 0 1 4 0z" fill="#EDE6D8"/><circle cx="12" cy="13" r="2.2" fill="#F2B53A"/></svg>Shop</button>
  </nav>
</div>
<div id="sheet" class="hidden"></div>

<div id="result" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
