<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Delve">
<meta name="theme-color" content="#0E1120">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Delve</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/camp.css">
<link rel="stylesheet" href="css/tree.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/battle.css">
<link rel="stylesheet" href="css/convoy.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-top">
    <button class="hb" id="pauseBtn" aria-label="pause"><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4" fill="currentColor"/></svg><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z" fill="currentColor"/></svg></button>
    <div class="hud-where"><span id="where"></span><canvas id="mapCanvas"></canvas></div>
    <span class="pill hud-gold"><span class="coin"></span><b id="hCoins">0</b></span>
    <span class="pill hud-gem"><span class="gem"></span><b id="hGems">0</b></span>
    <button class="hb" id="speedBtn" aria-label="speed">1×</button>
    <button class="hb leave" id="retreatBtn" aria-label="leave"></button>
  </div>
  <div id="bossBar" class="hidden"><span id="bossName">Boss</span><div class="bar boss"><i></i></div></div>
</div>
<div id="dock" class="hidden"><div id="cards"></div></div>
<div id="inspect" class="hidden"></div>
<div id="leaveAsk" class="hidden"></div>
<div id="banner" class="hidden"></div>

<div id="camp" class="hidden">
  <canvas id="campCanvas"></canvas>
  <header class="topbar" id="campTop"></header>
  <p id="campHint" class="ground-hint">Tap the fire to choose your party</p>
  <div id="campPanel" class="hidden"></div>
</div>
<div id="sheet" class="hidden"></div>

<div id="battle" class="hidden"></div>

<div id="result" class="hidden"></div>

<script>
// An iPhone home-screen app with a see-through status bar reports a viewport one status bar short of the screen.
// Measure the real height for css/base.css (--app-h). Only when launched from the home screen.
(function () {
  function fit() {
    var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (!standalone) return;
    var portrait = window.innerHeight >= window.innerWidth;
    var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    var h = Math.max(window.innerHeight, /iP(hone|ad|od)/.test(navigator.userAgent) || navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent) ? full : 0);
    document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
