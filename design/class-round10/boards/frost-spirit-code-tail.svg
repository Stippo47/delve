<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- FROST SPIRIT, a mock-up for the board (round 10): the core (spirit-core-frost.svg) with the tail the game would draw behind it: a ribbon on a chain of springy points, caught mid-wiggle. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
<defs>
<filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="gHand" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8D4B2"/><stop offset="1" stop-color="#DFA57F"/></radialGradient><linearGradient id="gUnder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A2E2A" stop-opacity="0.5"/><stop offset="0.45" stop-color="#5A2E2A" stop-opacity="0"/></linearGradient><linearGradient id="gFace" x1="0" y1="95" x2="0" y2="153" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B07560"/><stop offset="0.2" stop-color="#D9A27F"/><stop offset="0.45" stop-color="#F2C7A0"/><stop offset="0.85" stop-color="#F4CBA6"/><stop offset="1" stop-color="#E6B590"/></linearGradient><linearGradient id="gFaceSide" x1="100" y1="0" x2="156" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8A4E36" stop-opacity="0"/><stop offset="1" stop-color="#8A4E36" stop-opacity="0.28"/></linearGradient>
<radialGradient id="gSpfrost" cx="0.4" cy="0.36" r="0.72"><stop offset="0" stop-color="#F4FCFF"/><stop offset="0.55" stop-color="#C9E9F7"/><stop offset="1" stop-color="#8ED0EE"/></radialGradient><linearGradient id="gSpfrostT" x1="0" y1="1" x2="0.3" y2="0"><stop offset="0" stop-color="#E6F8FF"/><stop offset="1" stop-color="#7EC2E6"/></linearGradient>
<path id="s1" d="M 64 116 A 36 36 0 1 0 136 116 A 36 36 0 1 0 64 116 Z"/>
<clipPath id="c1"><use href="#s1"/></clipPath>
<linearGradient id="gRib" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E6F8FF"/><stop offset="1" stop-color="#7EC2E6"/></linearGradient>
<path id="s2" d="M 124.3 97.9 C 130.2 94.5 115.9 92.3 115.7 87.1 C 115.4 81.9 124.2 69.7 122.6 63.2 C 121 56.7 106.6 49.4 105 43.7 C 103.4 38 112.9 30.6 111.8 24.9 C 110.8 19.2 100.1 6.3 98 6 C 95.9 5.7 100.7 17.4 98.2 23.1 C 95.6 28.8 82.3 38 81 44.3 C 79.7 50.6 90.4 59.3 89.4 64.8 C 88.4 70.3 76.4 74.1 74.3 80.9 C 72.3 87.7 68.3 107.5 75.7 110.1 C 83.2 112.6 118.3 101.4 124.3 97.9 Z"/>
</defs>
<g id="sprite" filter="url(#outline)">
<g id="back" data-pivot="100 100"><!-- the code-drawn tail -->
<use href="#s2" fill="url(#gRib)"/>
</g>
<g id="body">
<use href="#s1" fill="url(#gSpfrost)"/><g clip-path="url(#c1)"><path d="M 75 116 A 25 25 0 1 0 125 116 A 25 25 0 1 0 75 116 Z" fill="#F4FCFF" opacity="0.35"/><g stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none"><path d="M 100 118 L 100 99"/><path d="M 100 118 L 116.5 108.5"/><path d="M 100 118 L 116.5 127.5"/><path d="M 100 118 L 100 137"/><path d="M 100 118 L 83.5 127.5"/><path d="M 100 118 L 83.5 108.5"/></g><circle cx="100" cy="118" r="5" fill="#FFFFFF"/><path d="M 76 100 A 10 6 0 1 0 96 100 A 10 6 0 1 0 76 100 Z" fill="#FFFFFF" opacity="0.5"/></g>
</g>
</g>
</svg>
