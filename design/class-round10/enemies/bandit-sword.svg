<!-- BANDIT, sword and shield (round 10): the gang's rag-edged leather and red bandanna (no eyes) under a dented iron pot helm with a riveted rim and a ridge, a mail collar; a broad sword in the right hand (arm-r, under the shoulder) and a round wooden shield with an iron rim and boss and a band of the gang's red, held in front on the left (arm-l, hand hidden). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
