<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- BOMB BOT (round 10): a walking bomb seen from above: one round black iron bomb with a hazard band across its front, a brass fuse cap on top with a fuse curling to a spark, a brass wind-up key standing out of its back (#back, sways), two stubby brass feet in front (arm-l, arm-r: they swing as it runs). The game draws the sparks when it is lit. Parts: #back (key), #arm-l / #arm-r (feet), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
