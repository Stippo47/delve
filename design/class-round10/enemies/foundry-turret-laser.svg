<!-- LASER TURRET (round 10): a wall turret seen from above, in the gun turret's bulkhead: a riveted iron block built out from the wall with a round socket in its front edge (#back, it stays on the wall), and half in the socket the part that turns: a long capsule of a housing with cooling fins across its back and a red charge window down its middle, a long barrel with three brass focusing rings and a red lens at its end. Parts: #back (the bulkhead), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
