<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- MORTAR (round 10): a floor mortar seen from above: the riveted base plate that stays still with two spare shells lying on it (#back), and on it the part that turns: a short fat iron tube tilted up and forward, a brass band round its muzzle and the dark mouth showing, a brass yoke across it, a round breech behind. The fire and gas mortars are this art with the brass (the band, the yoke, the shells' noses) turned red and green by the game. Parts: #back (the base and shells), #body (yoke and tube). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
