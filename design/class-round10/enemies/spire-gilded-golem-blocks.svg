<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GILDED GOLEM (round 10, body "blocks"): a stone golem seen from above: cut temple stone: a broad squared chest block with bevelled edges, a cube of a head, squared fists; on its head the eye: a diamond rune that glows (no other face). Gilded: polished gold plates over the shoulders and knuckles and a gold brow plate round the eye, the eye white. Parts: #arm-l / #arm-r (the fists, swing), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
