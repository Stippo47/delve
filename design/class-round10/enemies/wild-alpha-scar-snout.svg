<!-- THE ALPHA (round 8): the giant wolf, pack leader: pale silver fur, a great mane of pointed tufts over the shoulders, one ear torn, an old scar across the brow in one darker shade, the werewolf's skull and snout, big paws with white claws, a long bushy tail. No eyes. Parts: #back (tail, sways), #body, #arm-l / #arm-r (front paws, swing to walk). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
