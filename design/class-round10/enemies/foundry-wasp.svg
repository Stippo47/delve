<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- WASP (round 10: "1 maybe 2 body segments. Not 3"): a mechanical wasp seen from above, in copper: two parts: a small round head with two feelers, and one long abdomen tapering to a long iron stinger, striped with three bands; one wing of thin pale plate a side (arm-l, arm-r: they flap). The bronze and steel ones are this art turned by the game. No eyes. Parts: #arm-l / #arm-r (wings), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
