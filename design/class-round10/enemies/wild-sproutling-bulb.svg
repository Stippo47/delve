<linearGradient id="g7" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#679842"/><stop offset="1" stop-color="#517832"/></linearGradient>
<linearGradient id="g8" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A4019" stop-opacity="0"/><stop offset="1" stop-color="#2A4019" stop-opacity="0.42"/></linearGradient>
</defs>
<g id="sprite" filter="url(#outline)">
<g id="back" data-pivot="100 92"><!-- leaves -->
<use href="#s1" transform="translate(100 92) rotate(140)" fill="url(#g1)"/><use href="#s1" transform="translate(100 92) rotate(140)" fill="url(#g2)"/><g clip-path="url(#c1)"><g transform="translate(100 92) rotate(140)"><path d="M 0 8 L 0 66" stroke="#4A7A34" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/></g></g>
<g clip-path="url(#u2)"><use href="#s2" transform="translate(0 3) translate(100 92) rotate(220)" fill="#2B2230" opacity="0.3"/></g><use href="#s2" transform="translate(100 92) rotate(220)" fill="url(#g1)"/><use href="#s2" transform="translate(100 92) rotate(220)" fill="url(#g2)"/><g clip-path="url(#c2)"><g transform="translate(100 92) rotate(220)"><path d="M 0 8 L 0 66" stroke="#4A7A34" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/></g></g>
<g clip-path="url(#u3)"><use href="#s3" transform="translate(0 3) translate(100 92) rotate(180)" fill="#2B2230" opacity="0.3"/></g><use href="#s3" transform="translate(100 92) rotate(180)" fill="url(#g3)"/><use href="#s3" transform="translate(100 92) rotate(180)" fill="url(#g4)"/><g clip-path="url(#c3)"><g transform="translate(100 92) rotate(180)"><path d="M 0 8 L 0 76" stroke="#4A7A34" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/></g></g>
</g>
<g id="arm-l" data-pivot="66 124"><!-- root hand -->
<use href="#s4" fill="url(#g5)"/><use href="#s4" fill="url(#g6)"/>
</g>
<g id="arm-r" data-pivot="134 124"><!-- root hand -->
<use href="#s5" fill="url(#g5)"/><use href="#s5" fill="url(#g6)"/>
</g>
<g id="body">
<g clip-path="url(#u6)"><use href="#s6" transform="translate(0 3) " fill="#2B2230" opacity="0.3"/></g><use href="#s6" fill="url(#gBulb)"/><g clip-path="url(#c6)"><path d="M 70 108 A 14 9 0 1 0 98 108 A 14 9 0 1 0 70 108 Z" fill="#FFFFFF" opacity="0.3"/><rect x="100" y="60" width="60" height="120" fill="#5A2E4A" opacity="0.12"/></g>
<g clip-path="url(#u7)"><use href="#s7" transform="translate(0 2) " fill="#2B2230" opacity="0.3"/></g><use href="#s7" fill="url(#g7)"/><use href="#s7" fill="url(#g8)"/>
</g>
</g>
</svg>
