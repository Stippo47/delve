<linearGradient id="g2" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#314A1E" stop-opacity="0"/><stop offset="1" stop-color="#314A1E" stop-opacity="0.42"/></linearGradient>
<clipPath id="c1"><use href="#s1" transform="translate(100 92) rotate(140)"/></clipPath>
<path id="s2" d="M 0 0 C 5.8 0 18.4 17.7 21.6 23.4 C 24.8 29.1 26.9 35.6 24 42.9 C 21.1 50.2 6.4 78 0 78 C -6.4 78 -21.1 50.2 -24 42.9 C -26.9 35.6 -24.8 29.1 -21.6 23.4 C -18.4 17.7 -5.8 0 0 0 Z"/>
