<!-- COG SPRITE (round 10): the gear sprite's brass cousin, a different wheel: a broad brass crown wheel with eight blunt teeth and four crescent windows round a cross of spokes, and riding on its middle a small steel pinion of six teeth with a red jewel bearing. Seen from straight above, it spins as it rolls. No face. Parts: #body only. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
