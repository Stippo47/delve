<!-- SAW BLADE (round 10): a circular saw seen from straight above: a steel disc with twelve big hooked teeth, three curved slots cut through it, a red-painted hub with a brass nut. It spins as it runs along a wall. Parts: #body only. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
