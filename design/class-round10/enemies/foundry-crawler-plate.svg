<path id="s2" d="M 140.2 96.8 C 144 96.8 160.2 94.6 165.5 95.5 C 170.7 96.4 172 97.8 175.2 102.8 C 178.5 107.7 185.2 124.5 187.2 128.2 C 189.2 132 189.2 132.4 188.8 127.8 C 188.4 123.1 188.1 103.7 184.8 97.2 C 181.4 90.8 173.3 84.8 166.5 84.5 C 159.8 84.2 143.8 93.4 139.8 95.2 C 135.9 97 136.3 96.8 140.2 96.8 Z"/>
<path id="s3" d="M 82 57 H 118 A 36 36 0 0 1 154 93 V 107 A 36 36 0 0 1 118 143 H 82 A 36 36 0 0 1 46 107 V 93 A 36 36 0 0 1 82 57 Z"/>
