<!-- GOLEM (round 10, body "hunch"): a stone golem seen from above: one great boulder of a back with a band of carved runes, a small head stone sunk in its front, long arms reaching forward to two big fists; on its head the eye: a diamond rune that glows (no other face). Weathered grey stone, a little moss. Parts: #arm-l / #arm-r (the fists, swing), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
