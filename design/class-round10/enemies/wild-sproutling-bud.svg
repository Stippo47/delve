<!-- SPROUTLING (round 10, take "bud"): a walking flower bud seen from above: a rosette of five broad leaves for a body, a closed pink bud in the middle wrapped in three green sepals (it opens to spit seeds when it roots), two leaf hands. No face. Parts: #arm-l / #arm-r (leaf hands), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
