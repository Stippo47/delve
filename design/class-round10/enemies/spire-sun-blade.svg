<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- SUN BLADE (round 10: "much bigger. Like 3 units across"): a great floating golden sword of the host seen from above, drawn to be three heroes long in the game and balanced on its middle (it turns about the middle of its length): a long broad blade, point forward, split light and dark down a fuller cut with a row of small suns, pale glowing edges; a wide crossguard like a pair of gold wings with a sun disc and twelve rays at its heart; a grip bound in white, a sun for a pommel. No hands. Parts: #body only (it turns whole). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
