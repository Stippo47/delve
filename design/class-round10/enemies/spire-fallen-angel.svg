<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- FALLEN ANGEL (round 10): one of the host, fallen, on the picked angel's build: ashen skin, no eyes, long black hair with a pale streak, a broken halo of tarnished gold hanging askew over its head; a dark violet robe with a ragged cowl; the angel's two-layer wings gone dark and torn, the left one half gone (#back, sway); a black glaive with a pale violet blade under the right shoulder (arm-r, it thrusts), the left hand free (arm-l). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
