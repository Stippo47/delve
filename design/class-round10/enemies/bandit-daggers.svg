<!-- KNIFE BANDIT, two daggers (round 10): the gang's cutpurse, bare-headed: the red bandanna, dark auburn hair swept back off the brow in a wave and tied in a long tail that lies back (#back, sways), a gold ring in one ear, a slate-blue scarf collar over dark leather; a long curved knife in each hand, both under the shoulders, curving out (arm-l, arm-r, before #body). No eyes. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
