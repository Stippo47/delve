<title>A+B — turning ball head</title>
<style>

<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="btns">
    <button id="bFacing" aria-pressed="false"><span>Facing demo</span></button>
    <button id="bTurn" aria-pressed="false"><span>Turnaround</span></button>
  </div>
  <div id="tag">A+B — turning ball head</div>
  <div id="hint">Tap a unit to play its moves</div>
</div>
<div id="safe"></div>
<script>
'use strict';
/* =====================================================================
   A+B — TURNING BALL HEAD
   Every unit is one ball (the collision circle) seen by a camera tilted
   ~50° down. The head yaws a full 360° to its true heading; features are
   authored as flat "front view" drawings, wrapped onto the ball and
   projected every frame, so the face slides round the ball (front -> 3/4
   -> profile -> back of head) and always stays upright on screen.
   Lighting never turns: one hard shadow crescent lower-right, one hard
   highlight upper-left. Flat fills, ink outline, no gradients/blur/glow.

   Layout of this file
     1. palette            (PALETTE.md, nothing else)
     2. math + projection  (ball camera, sheets, path builders)
     3. paint core         (form / zone / parts with union outline)
     4. shared face parts  (eyes, brows, mouths)
     5. one draw function per unit: drawX(ctx, x, y, radius, facing, state)
     6. effects, animation controller, page
   ===================================================================== */

// ============================================================ 1. PALETTE
const INK = '#2B2230', BG = '#EDE6D8', WHITE = '#FFFFFF', EYE_RED = '#E2483D';
const GROUND = 'rgba(43,34,48,0.18)';
// material = [base, shadow, highlight]
const MAT = {
  skin:   ['#F2C7A0', '#D99C75', '#F2C7A0'],
  wood:   ['#A0683A', '#7A4A26', '#A0683A'],
  woodD:  ['#7A4A26', '#7A4A26', '#7A4A26'],
  steel:  ['#C9CED6', '#8F97A3', '#C9CED6'],
  steelD: ['#8F97A3', '#8F97A3', '#8F97A3'],
  gold:   ['#F2B53A', '#F2B53A', '#F2B53A'],
  archer: ['#5FA35A', '#3E7A44', '#9AD17F'],
  archerL:['#9AD17F', '#5FA35A', '#9AD17F'],
  archerD:['#3E7A44', '#3E7A44', '#3E7A44'],
  knight: ['#4F7BC4', '#36589A', '#8DB0E8'],
  knightL:['#8DB0E8', '#4F7BC4', '#8DB0E8'],
  knightD:['#36589A', '#36589A', '#36589A'],
  rogue:  ['#8A5BB8', '#5E3D86', '#B994E0'],
  rogueL: ['#B994E0', '#8A5BB8', '#B994E0'],
  rogueD: ['#5E3D86', '#5E3D86', '#5E3D86'],
  rat:    ['#8E7A6B', '#6B5A4E', '#B3A091'],
  ratL:   ['#B3A091', '#8E7A6B', '#B3A091'],
  ratD:   ['#6B5A4E', '#6B5A4E', '#6B5A4E'],
  slime:  ['#4CC2A8', '#2F8F7B', '#8BE3CF'],
  slimeL: ['#8BE3CF', '#4CC2A8', '#8BE3CF'],
  slimeD: ['#2F8F7B', '#2F8F7B', '#2F8F7B'],
  bone:   ['#E8E0CC', '#B8AD93', '#FFF8E8'],
  boneL:  ['#FFF8E8', '#E8E0CC', '#FFF8E8'],
  boneD:  ['#B8AD93', '#B8AD93', '#B8AD93'],
  rust:   ['#9C5B3A', '#7A4A26', '#9C5B3A'],
  white:  ['#FFFFFF', '#FFFFFF', '#FFFFFF'],
  red:    ['#E2483D', '#E2483D', '#E2483D'],
  ink:    ['#2B2230', '#2B2230', '#2B2230']
};
const FX_COL = { burn: '#FF7A2F', ice: '#7FD6F5', poison: '#9BCB3C', shock: '#FFE14D' };

// ============================================================ 2. MATH + PROJECTION
const TAU = Math.PI * 2, HPI = Math.PI / 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeIO = t => t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
const backOut = t => { const c = 2.4, u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; };
const bell = t => Math.sin(Math.PI * clamp(t, 0, 1));
const rand = (a, b) => a + Math.random() * (b - a);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }

// Camera: orthographic, looking down at CAM_EL above the horizon, from the bottom of the screen.
const CAM_EL = 50 * Math.PI / 180, CS = Math.sin(CAM_EL), CC = Math.cos(CAM_EL);
// Fixed light, screen space (points toward the light: up-left)
const LX = -0.6, LY = -0.8;

// Head space: f = forward (nose), s = sideways (screen-right when the unit faces the camera), u = up.
// M maps head space -> screen x, screen y, depth (toward camera). Rebuilt per unit per frame.
let m00 = 0, m01 = 0, m02 = 0, m10 = 0, m11 = 0, m12 = 0, m20 = 0, m21 = 0, m22 = 0;
let PX = 0, PY = 0, PD = 0;                       // last projected point
function setHeadRotation(yaw, roll, nod) {
  const ca = Math.cos(yaw), sa = Math.sin(yaw), cr = Math.cos(roll), sr = Math.sin(roll), cn = Math.cos(nod), sn = Math.sin(nod);
  // column for each head axis: apply roll (about f), nod (about s), then yaw + camera
  const col = (f, s, u, k) => {
    const s1 = s * cr - u * sr, u1 = s * sr + u * cr;
    const f2 = f * cn + u1 * sn, u2 = -f * sn + u1 * cn;
    const X = f2 * ca + s1 * sa, N = -f2 * sa + s1 * ca;
    const x = X, y = -(N * CS + u2 * CC), d = -N * CC + u2 * CS;
    if (k === 0) { m00 = x; m10 = y; m20 = d; } else if (k === 1) { m01 = x; m11 = y; m21 = d; } else { m02 = x; m12 = y; m22 = d; }
  };
  col(1, 0, 0, 0); col(0, 1, 0, 1); col(0, 0, 1, 2);
}
function pj(f, s, u) { PX = m00 * f + m01 * s + m02 * u; PY = m10 * f + m11 * s + m12 * u; PD = m20 * f + m21 * s + m22 * u; }

// A "sheet" is a flat drawing board glued to the ball: you author a shape as if looking straight
// at that side of the head (a = right, b = up, unit disc = the ball), and it is wrapped on.
function mkSheet(az, el) {
  const ce = Math.cos(el), se = Math.sin(el), ca = Math.cos(az), sa = Math.sin(az);
  return { cf: ce * ca, cs: ce * sa, cu: se, af: -sa, as: ca, au: 0, bf: -se * ca, bs: -se * sa, bu: ce };
}
const FACE_TILT = 34 * Math.PI / 180;             // faces look up a little, toward the camera
const SF = mkSheet(0, FACE_TILT);                 // front (face) sheet
const SB = mkSheet(Math.PI, 0.30);                // back-of-head sheet
let HF = 0, HS = 0, HU = 0;
function sheet3(sh, a, b, h) {                     // -> HF,HS,HU (head space)
  let w = 1 - a * a - b * b; w = w > 0 ? Math.sqrt(w) : 0;
  const k = 1 + h;
  HF = (a * sh.af + b * sh.bf + w * sh.cf) * k; HS = (a * sh.as + b * sh.bs + w * sh.cs) * k; HU = (a * sh.au + b * sh.bu + w * sh.cu) * k;
}
function sheetPt(sh, a, b, h = 0) { sheet3(sh, a, b, h); pj(HF, HS, HU); }

// --- tiny path language for authoring: "M x,y C x1,y1 x2,y2 x,y Q cx,cy x,y L x,y" -> sampled polyline
function shape(str, n = 7) {
  const tk = str.match(/[MLQC]|-?\d*\.?\d+/g), out = []; let i = 0, x = 0, y = 0, cmd = 'M';
  const num = () => parseFloat(tk[i++]);
  while (i < tk.length) {
    if (/[MLQC]/.test(tk[i])) cmd = tk[i++];
    if (cmd === 'M') { x = num(); y = num(); out.push(x, y); }
    else if (cmd === 'L') { const ex = num(), ey = num(), m = Math.max(1, Math.ceil(Math.hypot(ex - x, ey - y) / 0.22)); for (let k = 1; k <= m; k++) out.push(x + (ex - x) * k / m, y + (ey - y) * k / m); x = ex; y = ey; }
    else if (cmd === 'Q') { const cx = num(), cy = num(), ex = num(), ey = num();
      for (let k = 1; k <= n; k++) { const t = k / n, m = 1 - t; out.push(m * m * x + 2 * m * t * cx + t * t * ex, m * m * y + 2 * m * t * cy + t * t * ey); } x = ex; y = ey; }
    else { const x1 = num(), y1 = num(), x2 = num(), y2 = num(), ex = num(), ey = num();
      for (let k = 1; k <= n; k++) { const t = k / n, m = 1 - t;
        out.push(m * m * m * x + 3 * m * m * t * x1 + 3 * m * t * t * x2 + t * t * t * ex, m * m * m * y + 3 * m * m * t * y1 + 3 * m * t * t * y2 + t * t * t * ey); } x = ex; y = ey; }
  }
  return new Float32Array(out);
}
function mirror(p) { const o = new Float32Array(p.length); for (let i = 0, n = p.length / 2; i < n; i++) { o[i * 2] = -p[(n - 1 - i) * 2]; o[i * 2 + 1] = p[(n - 1 - i) * 2 + 1]; } return o; }
function ellipsePts(cx, cy, rx, ry, n = 18, rot = 0) { const o = new Float32Array(n * 2), c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i < n; i++) { const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; o[i * 2] = cx + x * c - y * s; o[i * 2 + 1] = cy + x * s + y * c; } return o; }

// Horizon clipping. Scratch arrays hold a closed polygon already projected (counter-clockwise as seen from
// outside the ball). Hidden runs are replaced by the arc of the rim between where the outline dives behind
// the ball and where it comes back, so patches tuck round the far side cleanly at every heading.
const QA = new Float32Array(256), QB = new Float32Array(256), QX = new Float32Array(256), QY = new Float32Array(256), QD = new Float32Array(256);
const RS = new Int16Array(24), RL = new Int16Array(24), RIN = new Float32Array(24), ROUT = new Float32Array(24), RIX = new Float32Array(24), RIY = new Float32Array(24), ROX = new Float32Array(24), ROY = new Float32Array(24), RU = new Uint8Array(24);
let CXx = 0, CXy = 0;
function rimCross(i0, i1) { const t = QD[i0] / (QD[i0] - QD[i1]); let x = QX[i0] + (QX[i1] - QX[i0]) * t, y = QY[i0] + (QY[i1] - QY[i0]) * t; const l = Math.hypot(x, y) || 1; CXx = x / l; CXy = y / l; }
function clipPath(n) {
  const p = new Path2D(); let anyV = false, allV = true;
  for (let i = 0; i < n; i++) { if (QD[i] > 0) anyV = true; else allV = false; }
  if (!anyV) return p;
  if (allV) { p.moveTo(QX[0], QY[0]); for (let i = 1; i < n; i++) p.lineTo(QX[i], QY[i]); p.closePath(); return p; }
  let s = 0; while (!(QD[s] <= 0 && QD[(s + 1) % n] > 0)) s++;
  // visible runs, each with the rim points where it surfaces (in) and dives (out)
  let nr = 0, open = false;
  for (let e = 0; e < n; e++) { const i0 = (s + e) % n, i1 = (s + e + 1) % n, v0 = QD[i0] > 0, v1 = QD[i1] > 0;
    if (!v0 && v1) { if (nr >= 24) break; rimCross(i0, i1); RIX[nr] = CXx; RIY[nr] = CXy; RIN[nr] = Math.atan2(CXy, CXx); RS[nr] = i1; RL[nr] = 1; RU[nr] = 0; open = true; }
    else if (v0 && v1 && open) RL[nr]++;
    else if (v0 && !v1 && open) { rimCross(i0, i1); ROX[nr] = CXx; ROY[nr] = CXy; ROUT[nr] = Math.atan2(CXy, CXx); nr++; open = false; } }
  // stitch: from where a run dives, follow the rim (keeping the ball on the left) to the next run that surfaces
  for (let r0 = 0; r0 < nr; r0++) { if (RU[r0]) continue; let r = r0; p.moveTo(RIX[r], RIY[r]);
    for (let guard = 0; guard < 24; guard++) { RU[r] = 1;
      for (let k = 0; k < RL[r]; k++) { const i = (RS[r] + k) % n; p.lineTo(QX[i], QY[i]); }
      p.lineTo(ROX[r], ROY[r]);
      let q = r0, best = 1e9; for (let c = 0; c < nr; c++) { let d = (ROUT[r] - RIN[c]) % TAU; if (d < 0) d += TAU; if (d < best) { best = d; q = c; } }
      p.arc(0, 0, 1, ROUT[r], RIN[q], true);
      if (q === r0 || RU[q]) break; r = q; }
    p.closePath(); }
  return p;
}
// project QA/QB (sheet coords, n points) and clip; fixes winding so authoring order does not matter
function sheetPoly(sh, n) {
  let ar = 0; for (let i = 0; i < n; i++) { const j = (i + 1) % n; ar += QA[i] * QB[j] - QA[j] * QB[i]; }
  for (let i = 0; i < n; i++) { const k = ar < 0 ? n - 1 - i : i; sheetPt(sh, QA[k], QB[k]); QX[i] = PX; QY[i] = PY; QD[i] = PD; }
  return clipPath(n);
}
// closed sheet polygon -> Path2D. h > 0 lifts it off the ball (no clipping then: it is a free-standing shape)
function SP(sh, pts, h = 0, da = 0, db = 0, sc = 1) {
  const n = pts.length / 2;
  if (h > 0) { const p = new Path2D(); for (let i = 0; i < n; i++) { sheetPt(sh, da + pts[i * 2] * sc, db + pts[i * 2 + 1] * sc, h); if (i) p.lineTo(PX, PY); else p.moveTo(PX, PY); } p.closePath(); return p; }
  for (let i = 0; i < n; i++) { QA[i] = da + pts[i * 2] * sc; QB[i] = db + pts[i * 2 + 1] * sc; }
  return sheetPoly(sh, n);
}
// closed loop of points on the ball given in head space [f,s,u,...], counter-clockwise seen from outside
function loop3(pts) { const n = pts.length / 3; for (let i = 0; i < n; i++) { pj(pts[i * 3], pts[i * 3 + 1], pts[i * 3 + 2]); QX[i] = PX; QY[i] = PY; QD[i] = PD; } return clipPath(n); }
// circle of constant sheet-height b0 (a "cap" round the sheet's up axis), as a loop3 array
function capLoop(sh, b0, n = 28) { const o = new Float32Array(n * 3), k = Math.sqrt(1 - b0 * b0);
  for (let i = 0; i < n; i++) { const a = i / n * TAU, c = Math.cos(a) * k, s = Math.sin(a) * k;
    o[i * 3] = b0 * sh.bf + c * sh.cf + s * sh.af; o[i * 3 + 1] = b0 * sh.bs + c * sh.cs + s * sh.as; o[i * 3 + 2] = b0 * sh.bu + c * sh.cu + s * sh.au; } return o; }
// sheet polyline for strokes -> Path2D, broken wherever it goes behind the ball
function SL(sh, pts, closed = false, da = 0, db = 0, sc = 1) {
  const p = new Path2D(); let pen = false; const n = pts.length;
  for (let i = 0, m = closed ? n + 2 : n; i < m; i += 2) { const j = i % n; sheetPt(sh, da + pts[j] * sc, db + pts[j + 1] * sc, 0);
    if (PD > 0.03) { if (pen) p.lineTo(PX, PY); else { p.moveTo(PX, PY); pen = true; } } else pen = false; }
  return p;
}
// free 3D polygon (head space [f,s,u,...]) -> Path2D, no clamping (for things that stick out)
function poly3(pts, of = 0, os = 0, ou = 0) { const p = new Path2D();
  for (let i = 0; i < pts.length; i += 3) { pj(pts[i] + of, pts[i + 1] + os, pts[i + 2] + ou); if (i) p.lineTo(PX, PY); else p.moveTo(PX, PY); }
  p.closePath(); return p; }
function circleAt(x, y, r) { const p = new Path2D(); p.arc(x, y, r, 0, TAU); return p; }
const HEAD = circleAt(0, 0, 1);

// ============================================================ 3. PAINT CORE
// P = per-unit paint state. Everything is drawn in "ball units" (radius 1) in screen space.
const P = { g: null, lw: 0.1, big: false, flash: false, k: 1, edge: INK };
const outlinePx = k => clamp(2 * Math.pow(k / 20, 0.55), 1.5, 4.2);     // 2px at in-game size
function col(mat, i) { return P.flash ? WHITE : MAT[mat][i]; }

function begin(g, x, y, r, facing, st) {
  const k = r * st.scale; if (k < 0.5) return false;
  g.save(); g.translate(x, y - st.lift * r);
  g.translate(0, k); g.scale(k * st.sx, k * st.sy); g.translate(0, -1);   // squash is anchored at the bottom of the ball
  g.lineJoin = 'round'; g.lineCap = 'round';
  P.g = g; P.k = k; P.lw = outlinePx(k) / k; P.big = k >= 30; P.flash = st.flash; P.edge = INK; NP = 0;
  setHeadRotation(facing, st.roll, st.nod);
  return true;
}
function end() { P.g.restore(); }

// fill + ONE hard shadow shape: the part of the form not covered by a copy of itself slid toward the light
function form(path, mat, d = 0.08, lit = null) {
  const g = P.g, m = MAT[mat];
  if (P.flash) { g.fillStyle = WHITE; g.fill(path); return; }
  if (d === 0 || m[1] === m[0]) { g.fillStyle = m[0]; g.fill(path); return; }
  g.fillStyle = m[1]; g.fill(path);
  g.save(); g.clip(path); g.translate(LX * d, LY * d); g.fillStyle = m[0]; g.fill(lit || path); g.restore();
}
// a patch on the ball: shares the ball's crescent so the whole head shades as one form
function zone(path, mat) { form(path, mat, 0.24, HEAD); }
function line(path, w, color) { const g = P.g; g.lineWidth = w * P.lw; g.strokeStyle = P.flash && color !== INK ? WHITE : color; g.stroke(path); }
function hilite(mat, x = -0.40, y = -0.56, s = 1) { if (P.flash) return; const g = P.g; g.fillStyle = MAT[mat][2];
  g.beginPath(); g.ellipse(x, y, 0.2 * s, 0.085 * s, -0.62, 0, TAU); g.fill();
  g.beginPath(); g.arc(x + 0.26 * s, y - 0.13 * s, 0.045 * s, 0, TAU); g.fill(); }

// Parts = things that stick out of / float round the ball (props, ears, tails). They are depth sorted:
// behind the ball -> drawn under it, in front -> over it. All of it shares one union outline.
const PARTS = []; let NP = 0;
function part(path, mat, depth, shade = 0.07, thin = true, w = 0) {
  const o = PARTS[NP] || (PARTS[NP] = {}); NP++;
  o.path = path; o.mat = mat; o.depth = depth; o.shade = shade; o.thin = thin; o.w = w; o.lit = null; o.edge = P.edge; return o;
}
function fillPart(o, front) {
  const g = P.g;
  if (o.w) { g.lineWidth = o.w; g.strokeStyle = col(o.mat, 0); g.stroke(o.path); return; }
  form(o.path, o.mat, o.shade, o.lit);
  if (front && o.thin) { g.lineWidth = P.lw * 0.8; g.strokeStyle = P.flash ? INK : o.edge; g.stroke(o.path); }
}
function paintBody(head, mat, zones) {
  const g = P.g;
  for (let i = 1; i < NP; i++) { const o = PARTS[i]; let j = i - 1; while (j >= 0 && PARTS[j].depth > o.depth) { PARTS[j + 1] = PARTS[j]; j--; } PARTS[j + 1] = o; }
  g.strokeStyle = INK;
  for (let i = 0; i < NP; i++) { const o = PARTS[i]; if (o.mat === 'ink' && o.w) continue; g.lineWidth = o.w + 2 * P.lw; g.stroke(o.path); }
  g.lineWidth = 2 * P.lw; g.stroke(head);
  let i = 0;
  for (; i < NP && PARTS[i].depth < 0; i++) fillPart(PARTS[i], false);
  form(head, mat, 0.24);
  g.save(); g.clip(head); zones(); g.restore();
  for (; i < NP; i++) fillPart(PARTS[i], true);
  NP = 0;
}

// tapered tube along a 3D spine [f,s,u,radius,...] -> one or two parts (hidden run goes behind the ball)
const TX = new Float32Array(64), TY = new Float32Array(64), TR = new Float32Array(64), TH = new Uint8Array(64), TDp = new Float32Array(64);
function tube(sp, mat, shade = 0.07, notch = 0, thin = true, bias = 0, lit = null) {
  const n = sp.length / 4;
  for (let i = 0; i < n; i++) { pj(sp[i * 4], sp[i * 4 + 1], sp[i * 4 + 2]); TX[i] = PX; TY[i] = PY; TR[i] = sp[i * 4 + 3]; TDp[i] = PD; TH[i] = (PD < 0 && PX * PX + PY * PY < 1.02) ? 1 : 0; }
  let a = 0;

function renderMain(g) {

    g.setLineDash([3, 6]); g.lineWidth = 1.2; g.strokeStyle = 'rgba(43,34,48,0.22)'; g.beginPath(); g.ellipse(312, 180, 292, 148, 0, 0, TAU); g.stroke(); g.setLineDash([]);

    const y = e.hy + BIG_R + 31;
    label(g, e.name, e.hx, y, `800 15px ${FONT}`, INK);
    if (e.cap) { g.font = `700 10.5px ${FONT}`; const w = g.measureText(e.cap).width + 16; pill(g, e.hx, y + 12.5, w, 15, MAT.gold[0], null); label(g, e.cap, e.hx, y + 16.2, `700 10.5px ${FONT}`, INK); }

  const order = ents.slice().sort((a, b) => (a.hy + a.oy * BIG_R) - (b.hy + b.oy * BIG_R));
  for (const e of order) drawUnitAt(g, e, e.sx, e.sy, SMALL_R, 0, e.type === 'rat');
  for (const e of order) drawUnitAt(g, e, e.hx, e.hy, BIG_R, 0, e.type === 'rat');

    g.beginPath(); g.arc(DOT.x, DOT.y, 8.5, 0, TAU); g.fillStyle = MAT.gold[0]; g.fill(); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
    g.beginPath(); g.arc(DOT.x, DOT.y, 2.8, 0, TAU); g.fillStyle = INK; g.fill(); }
}
const COMPASS = ['S', 'SW', 'W', 'NW', 'N', 'NE', 'E', 'SE'];
function renderTurn(g) {
  const e = selected;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = INK; g.font = `800 15px ${FONT}`; g.fillText('Turnaround · ' + e.name, 14, 24);
  g.globalAlpha = 0.62; g.font = `600 10.5px ${FONT}`; g.fillText(e.cap ? '' : '8 headings, 45° apart — tap a figure to play its moves', 14, 39); g.globalAlpha = 1;
  if (e.cap) { g.font = `700 10.5px ${FONT}`; const w = g.measureText(e.cap).width + 16; pill(g, 14 + w / 2, 35.5, w, 15, MAT.gold[0], null); g.fillStyle = INK; g.textAlign = 'center'; g.fillText(e.cap, 14 + w / 2, 39.2); }
  for (let pass = 0; pass < 2; pass++) for (let k = 0; k < 8; k++) { const a = HPI + k * Math.PI / 4, rot = a - e.base, x = TURN_X(k);
    if (pass === 0) { drawUnitAt(g, e, x, TURN_Y2, SMALL_R, rot, false);
      g.save(); g.translate(x, 186); g.rotate(a); g.strokeStyle = INK; g.globalAlpha = 0.5; g.lineWidth = 1.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-6, 0); g.lineTo(6, 0); g.moveTo(2, -4); g.lineTo(6, 0); g.lineTo(2, 4); g.stroke(); g.restore();
      label(g, COMPASS[k], x + 16, 189.5, `700 9.5px ${FONT}`, INK, 0.5); }
    else drawUnitAt(g, e, x, TURN_Y, TURN_R, rot, false); }
  ents.forEach((u, i) => { const x = W0 / 2 + (i - 2.5) * 112, on = u === selected;      // unit picker
    pill(g, x, PICK_Y, 104, 34, on ? MAT.gold[0] : null, INK);
    drawGroundShadow(g, x - 32, PICK_Y, 11 * u.k, u.st); DRAW[u.type](g, x - 32, PICK_Y, 11 * u.k, u === selected ? HPI + 0.3 : u.facing, u.st);

}
function renderSheet(g) {                                    // ?sheet : every unit at 8 headings, big and at game size (art review)
  const q = new URLSearchParams(location.search), only = q.get('u'), list = ents.filter(e => !only || only.split(',').includes(e.type));
  const R = +(q.get('r') || 40), rowH = R * 3.2 + 74, extra = q.get('st') ? JSON.parse(q.get('st')) : null;
  list.forEach((e, row) => { const st = newPose(); st.t = 1.3; if (extra) Object.assign(st, extra);
    for (let k = 0; k < 8; k++) { const a = HPI + k * Math.PI / 4, x = 100 + k * (VW - 130) / 8, y = 26 + R * 1.75 + row * rowH, y2 = y + R * 1.6 + 36;
      drawGroundShadow(g, x, y, R * e.k, st); DRAW[e.type](g, x, y, R * e.k, a, st);
      drawGroundShadow(g, x, y2, SMALL_R * e.k, st); DRAW[e.type](g, x, y2, SMALL_R * e.k, a, st); } });
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  if (SHEET) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); renderSheet(ctx); return; }

}
const ui = document.getElementById('ui'), bFacing = document.getElementById('bFacing'), bTurn = document.getElementById('bTurn'), hint = document.getElementById('hint');
function resize() {
  DPR = Math.min(3, window.devicePixelRatio || 1); VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  const cs = getComputedStyle(document.getElementById('safe')), sl = parseFloat(cs.paddingLeft) || 0, sr = parseFloat(cs.paddingRight) || 0, stp = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
  const w = VW - sl - sr, h = VH - stp - sb; S = Math.min(w / W0, h / H0); OX = sl + (w - W0 * S) / 2; OY = stp + (h - H0 * S) / 2;
  ui.style.transform = `translate(${OX}px,${OY}px) scale(${S})`; ui.style.display = SHEET ? 'none' : '';
}
function setMode(facing, turn) { MODE.facing = facing; MODE.turn = turn; bFacing.setAttribute('aria-pressed', facing); bTurn.setAttribute('aria-pressed', turn);
  hint.textContent = turn ? 'Tap a figure to play · pick a unit below' : facing ? 'Drag the dot — everyone turns to face it' : 'Tap a unit to play its moves'; }
bFacing.addEventListener('click', () => setMode(!MODE.facing, false));
bTurn.addEventListener('click', () => setMode(false, !MODE.turn));
function toDesign(ev2) { return [(ev2.clientX - OX) / S, (ev2.clientY - OY) / S]; }
cv.addEventListener('pointerdown', ev2 => {
  const [x, y] = toDesign(ev2);
  if (MODE.turn) {
    for (let i = 0; i < ents.length; i++) { const px = W0 / 2 + (i - 2.5) * 112; if (Math.abs(x - px) < 54 && Math.abs(y - PICK_Y) < 22) { selected = ents[i]; return; } }
    if (y > 50 && y < 290) play(selected); return;
  }
  if (MODE.facing && Math.hypot(x - DOT.x, y - DOT.y) < 30) { DOT.drag = true; DOT.held = 1e9; cv.setPointerCapture(ev2.pointerId); return; }
  let best = null, bd = 1e9;
  for (const e of ents) { const d1 = Math.hypot(x - e.hx, y - e.hy) / (BIG_R * 1.5), d2 = Math.hypot(x - e.sx, y - e.sy) / 34, d = Math.min(d1, d2); if (d < 1 && d < bd) { bd = d; best = e; } }
  if (best) { selected = best; play(best); }
});
cv.addEventListener('pointermove', ev2 => { if (!DOT.drag) return; const [x, y] = toDesign(ev2); DOT.hx = clamp(x, 12, W0 - 12); DOT.hy = clamp(y, 12, H0 - 12); });
const endDrag = () => { if (DOT.drag) { DOT.drag = false; DOT.held = 3; } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
function updateDot(dt) {
  if (!DOT.drag && DOT.held <= 0) DOT.ang += dt * TAU / 11;
  const ox = 312 + Math.cos(DOT.ang) * 292, oy = 180 + Math.sin(DOT.ang) * 148;
  if (DOT.drag) { DOT.x += (DOT.hx - DOT.x) * Math.min(1, dt * 30); DOT.y += (DOT.hy - DOT.y) * Math.min(1, dt * 30); }
  else if (DOT.held > 0) { DOT.held -= dt; if (DOT.held <= 0) DOT.ang = Math.atan2((DOT.y - 180) / 148, (DOT.x - 312) / 292); }

}
let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
  if (!SHEET) { updateDot(dt); for (const e of ents) updateEnt(e, dt); }

}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', resize);
DOT.hx = DOT.x; DOT.hy = DOT.y; { const a = DOT.ang; DOT.x = 312 + Math.cos(a) * 292; DOT.y = 180 + Math.sin(a) * 148; }
// small hook for scripted screenshots / poking from the console
window.DEMO = { ents, MODE, DOT, setMode, play: (type, from) => { const e = ents.find(u => u.type === type); selected = e; e.seq = null; play(e, from); }, select: type => { selected = ents.find(u => u.type === type); },
  holdDot: (x, y) => { DOT.x = DOT.hx = x; DOT.y = DOT.hy = y; DOT.held = 1e9; } };
