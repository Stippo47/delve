<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EDE6D8">
<title>C — Sliding 3/4 face</title>
<style>
  html,body{margin:0;height:100%;background:#EDE6D8;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas{position:fixed;left:0;top:0;display:block}
  #safe{position:fixed;inset:0;pointer-events:none;visibility:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
'use strict';
/* =====================================================================
   VARIANT C — "SLIDING 3/4 FACE"
   Every unit is a chibi head. The head never rotates; instead the FACE
   slides across the head toward the facing direction (up to ~40% of R),
   the far-side eye squashes, and hood/helmet/ear details drift the
   opposite way. Props orbit to the facing side.
   ===================================================================== */

/* ----------------------------- PALETTE ----------------------------- */
const PAL = {
  bg:'#EDE6D8', ink:'#2B2230', white:'#FFFFFF', groundShadow:'rgba(43,34,48,0.18)',
  skin:'#F2C7A0', skinD:'#D99C75', wood:'#A0683A', woodD:'#7A4A26',
  steel:'#C9CED6', steelD:'#8F97A3', gold:'#F2B53A',
  archer:['#5FA35A','#3E7A44','#9AD17F'], knight:['#4F7BC4','#36589A','#8DB0E8'], rogue:['#8A5BB8','#5E3D86','#B994E0'],
  rat:['#8E7A6B','#6B5A4E','#B3A091'], slime:['#4CC2A8','#2F8F7B','#8BE3CF'], skeleton:['#E8E0CC','#B8AD93','#FFF8E8'],
  rust:'#9C5B3A', enemyEye:'#E2483D',
  burn:'#FF7A2F', ice:'#7FD6F5', poison:'#9BCB3C', shock:'#FFE14D'
};
const FONT = '"Avenir Next Rounded","Arial Rounded MT Bold","Avenir Next","Nunito","Trebuchet MS",Helvetica,Arial,sans-serif';
const TAU = Math.PI*2, OW = 2;              // outline width (world px at 1x)
const W0 = 844, H0 = 390;
const SLIDE = 0.40;                          // how far the face slides (fraction of R)

/* ------------------------------ MATH ------------------------------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(b,a)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const easeOut=t=>1-(1-t)*(1-t), easeIn=t=>t*t, easeIO=t=>t<0.5?2*t*t:1-2*(1-t)*(1-t);
const easeBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);
const rnd=Math.random, rr=(a,b)=>a+rnd()*(b-a);

/* ---------------------------- CANVAS ------------------------------- */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let VW,VH,DPR,S,OX,OY; const SAFE={l:0,r:0,t:0,b:0};
function resize(){
  VW=innerWidth;VH=innerHeight;DPR=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';
  S=Math.min(VW/W0,VH/H0);OX=(VW-W0*S)/2;OY=(VH-H0*S)/2;
  const cs=getComputedStyle(document.getElementById('safe'));
  SAFE.l=Math.max(0,(parseFloat(cs.paddingLeft)||0)-OX)/S;SAFE.r=Math.max(0,(parseFloat(cs.paddingRight)||0)-OX)/S;
  SAFE.t=Math.max(0,(parseFloat(cs.paddingTop)||0)-OY)/S;
}
function baseT(){ctx.setTransform(S*DPR,0,0,S*DPR,OX*DPR,OY*DPR);}

/* ======================= SHAPE PRIMITIVES ==========================
   Path builders return fn(cont) so the same path can be filled, clipped,
   and re-used offset for the hard-edged shadow. FL = hit-flash override. */
let FL=null;
const P={
  c:(x,y,r)=>cont=>{if(!cont)ctx.beginPath();ctx.moveTo(x+r,y);ctx.arc(x,y,Math.max(0.01,r),0,TAU);},
  e:(x,y,rx,ry,rot)=>cont=>{if(!cont)ctx.beginPath();rx=Math.max(0.01,rx);ry=Math.max(0.01,ry);const r=rot||0;ctx.moveTo(x+Math.cos(r)*rx,y+Math.sin(r)*rx);ctx.ellipse(x,y,rx,ry,r,0,TAU);},
  rr:(x,y,w,h,r)=>cont=>{if(!cont)ctx.beginPath();r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();},
  poly:pts=>cont=>{if(!cont)ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();},
};
function ink(w,col){ctx.lineWidth=w==null?OW:w;ctx.strokeStyle=col||PAL.ink;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
function outline(pf,w){pf();ink(w);}
function flat(pf,col,noLine){pf();ctx.fillStyle=FL||col;ctx.fill();if(!noLine)ink();}
/* one form = flat base + ONE hard-edged dark shape (lit copy shifted by dx,dy) + optional hard highlight + outline */
function form(pf,base,dark,light,dx,dy,hl){
  pf();ctx.fillStyle=FL||base;ctx.fill();
  if(!FL&&(dark||light)){ctx.save();pf();ctx.clip();
    if(dark){ctx.beginPath();ctx.rect(-4000,-4000,8000,8000);ctx.translate(dx,dy);pf(true);ctx.translate(-dx,-dy);ctx.fillStyle=dark;ctx.fill('evenodd');}
    if(light&&hl){hl();ctx.fillStyle=light;ctx.fill();}
    ctx.restore();}
  outline(pf);
}
function line(pts,w,col){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ink(w,FL&&col&&col!==PAL.ink?FL:col);}
/* thick coloured stroke with ink outline (bow limbs, tails) */
function cord(build,w,col){build();ink(w+OW*2,PAL.ink);build();ink(w,FL||col);}

/* ======================= FACE (the variant) ========================
   faceAt(): face centre slides with facing. Far-side eye squashes. */
function faceAt(u){const c=Math.cos(u.th),s=Math.sin(u.th);return {x:c*SLIDE*u.R, y:s*SLIDE*0.8*u.R+0.08*u.R, c, s, ac:Math.abs(c)};}
function eyes(F,u,o){
  const R=u.R,{c,s,ac}=F,up=Math.max(0,-s);
  const sep=o.sep*R*(1-0.32*ac), vy=1-0.18*up, ey=F.y+o.y*R;
  for(const sd of [-1,1]){
    const far=sd*c<-0.05, kx=far?1-0.45*ac:1+0.05*ac;
    const ex=F.x+sd*sep+c*0.03*R, rx=o.rx*R*kx, ry=o.ry*R*vy, ex_=u.expr;
    if(ex_==='dead'){ctx.beginPath();ctx.moveTo(ex-rx,ey-ry*0.7);ctx.lineTo(ex+rx,ey+ry*0.7);ctx.moveTo(ex+rx,ey-ry*0.7);ctx.lineTo(ex-rx,ey+ry*0.7);ink(0.075*R);}
    else if(ex_==='hit'){ctx.beginPath();ctx.moveTo(ex-sd*rx,ey-ry*0.65);ctx.lineTo(ex+sd*rx*0.7,ey);ctx.lineTo(ex-sd*rx,ey+ry*0.65);ink(0.07*R);}
    else if(u.blink<0.3||ex_==='happy'){ctx.beginPath();ctx.moveTo(ex-rx,ey+ry*0.15);ctx.quadraticCurveTo(ex,ey-ry*(ex_==='happy'?0.9:-0.35),ex+rx,ey+ry*0.15);ink(0.06*R);}
    else{
      const pe=P.e(ex,ey,rx,ry);
      if(o.socket){flat(pe,PAL.ink,true);flat(P.c(ex+c*rx*0.15,ey+ry*0.1,rx*0.42),FL||o.iris,true);flat(P.c(ex-rx*0.1,ey-ry*0.12,rx*0.16),PAL.white,true);}
      else{
        flat(pe,PAL.ink,true);
        if(!FL){ctx.save();pe();ctx.clip();flat(P.c(ex+c*rx*0.2,ey+ry*0.75,rx*1.05),o.iris,true);ctx.restore();}
        flat(P.c(ex-rx*0.28+c*rx*0.12,ey-ry*0.36,rx*0.42),PAL.white,true);
        flat(P.c(ex+rx*0.34+c*rx*0.1,ey+ry*0.16,rx*0.17),PAL.white,true);
      }
    }
    if(o.brow&&ex_!=='dead'&&ex_!=='happy'){
      const bw=rx*1.05,by=ey-ry-0.08*R;let t=o.brow*R;if(ex_==='attack'||ex_==='shout')t*=1.7;if(ex_==='hit')t=-t*0.8;
      ctx.beginPath();ctx.moveTo(ex+sd*bw,by-t);ctx.lineTo(ex-sd*bw*0.75,by+t);ink(o.bw*R);
    }
  }
}
function mouth(F,u,o){
  const R=u.R,{c,s,ac}=F,k=1-0.3*ac,mx=F.x+c*0.07*R,my=F.y+o.y*R*(1-0.2*Math.max(0,-s)),w=o.w*R*k;
  const ex=u.expr==='idle'&&o.idle?o.idle:u.expr;
  if(ex==='attack'||ex==='grin'){const h=0.15*R;flat(P.rr(mx-w*1.2,my-h/2,w*2.4,h,0.05*R),PAL.white);ctx.beginPath();for(const q of [-0.4,0,0.4]){ctx.moveTo(mx+q*w*1.2,my-h/2);ctx.lineTo(mx+q*w*1.2,my+h/2);}ink(1.4);}
  else if(ex==='shout'||ex==='happy'){ctx.beginPath();ctx.moveTo(mx-w*1.1,my-0.05*R);ctx.ellipse(mx,my-0.05*R,w*1.1,0.17*R,0,0,Math.PI);ctx.closePath();ctx.fillStyle=FL||PAL.ink;ctx.fill();
    if(!FL){ctx.save();ctx.clip();flat(P.e(mx,my+0.1*R,w*0.7,0.07*R),o.tongue||PAL.skinD,true);ctx.restore();}ctx.beginPath();ctx.moveTo(mx-w*1.1,my-0.05*R);ctx.ellipse(mx,my-0.05*R,w*1.1,0.17*R,0,0,Math.PI);ctx.closePath();ink();}
  else if(ex==='hit'){flat(P.e(mx,my+0.02*R,0.065*R*k,0.085*R),PAL.ink,true);}
  else if(ex==='dead'){ctx.beginPath();ctx.moveTo(mx-w,my);ctx.quadraticCurveTo(mx-w/2,my-0.06*R,mx,my);ctx.quadraticCurveTo(mx+w/2,my+0.06*R,mx+w,my);ink(0.045*R);}
  else if(ex==='focus'){ctx.beginPath();ctx.moveTo(mx-w*0.6,my);ctx.lineTo(mx+w*0.6,my-0.01*R);ink(0.045*R);}
  else{ctx.beginPath();ctx.arc(mx,my-0.07*R,w*0.75,0.22*Math.PI,0.78*Math.PI);ink(0.048*R);}
}
function clipHead(R){ctx.save();P.c(0,0,R-0.6)();ctx.clip();}
function headForm(R,C,hlScale){form(P.c(0,0,R),C[0],C[1],C[2],-0.2*R,-0.22*R,P.e(-0.42*R,-0.52*R,0.17*R*(hlScale||1),0.1*R*(hlScale||1),-0.7));}
/* props sit on the facing side; sg smoothly flips handedness so a turn never pops */
function propAt(u,off,dist){const g=clamp(Math.cos(u.th)*3,-1,1),sg=g+(1-Math.abs(g)),a=u.th+off*sg;return {x:Math.cos(a)*dist*u.R,y:Math.sin(a)*dist*0.82*u.R+0.12*u.R,a,sg};}

/* ========================= PROP DRAWERS =========================== */
function drawBow(u){
  const R=u.R,a=u.aim!=null?u.aim:u.th,px=Math.cos(a)*1.18*R,py=Math.sin(a)*1.0*R+0.1*R,pull=u.draw*0.42*R;
  ctx.save();ctx.translate(px,py);ctx.rotate(a);
  const cx=-0.62*R,rad=0.68*R,t0=-1.0,t1=1.0,tx=cx+Math.cos(t1)*rad,ty=Math.sin(t1)*rad;
  ctx.beginPath();ctx.moveTo(tx,-ty);ctx.lineTo(tx-pull,0);ctx.lineTo(tx,ty);ink(1.6);
  if(u.draw>0.05){const ax=tx-pull;cord(()=>{ctx.beginPath();ctx.moveTo(ax,0);ctx.lineTo(ax+0.85*R,0);},2.2,PAL.wood);
    form(P.poly([ax+0.82*R,-0.1*R,ax+1.05*R,0,ax+0.82*R,0.1*R]),PAL.steel,PAL.steelD,null,0,-0.05*R);
    flat(P.poly([ax+0.02*R,0,ax-0.12*R,-0.11*R,ax+0.12*R,-0.11*R,ax+0.2*R,0]),PAL.archer[2]);}
  cord(()=>{ctx.beginPath();ctx.arc(cx,0,rad,t0,t1);},4.5,PAL.wood);
  form(P.c(cx+rad,0,0.12*R),PAL.skin,PAL.skinD,null,-0.04*R,-0.04*R);
  ctx.restore();
}
function drawSword(x,y,a,R){ctx.save();ctx.translate(x,y);ctx.rotate(a);
  flat(P.c(-0.38*R,0,0.08*R),PAL.gold);
  form(P.rr(-0.34*R,-0.07*R,0.36*R,0.14*R,0.05*R),PAL.wood,PAL.woodD,null,0,-0.06*R);
  form(P.poly([0.08*R,-0.1*R,1.0*R,-0.1*R,1.2*R,0,1.0*R,0.1*R,0.08*R,0.1*R]),PAL.steel,PAL.steelD,null,0,-0.08*R);
  flat(P.rr(0.0,-0.25*R,0.11*R,0.5*R,0.05*R),PAL.gold);
  form(P.c(-0.15*R,0,0.12*R),PAL.skin,PAL.skinD,null,-0.04*R,-0.04*R);
  ctx.restore();}
function drawShield(x,y,R){ctx.save();ctx.translate(x,y);const C=PAL.knight;
  flat(P.c(0,0,0.47*R),PAL.gold);
  form(P.c(0,0,0.36*R),C[0],C[1],C[2],-0.1*R,-0.11*R,P.e(-0.16*R,-0.2*R,0.1*R,0.06*R,-0.7));
  flat(P.poly([0,-0.2*R,0.13*R,0,0,0.2*R,-0.13*R,0]),PAL.gold);
  ctx.restore();}
function drawDagger(x,y,a,R,thr){ctx.save();ctx.translate(x+Math.cos(a)*thr,y+Math.sin(a)*thr);ctx.rotate(a);
  form(P.rr(-0.3*R,-0.06*R,0.3*R,0.12*R,0.05*R),PAL.rogue[1],null);
  form(P.poly([0.06*R,-0.09*R,0.5*R,-0.04*R,0.66*R,0,0.5*R,0.04*R,0.06*R,0.09*R]),PAL.steel,PAL.steelD,null,0,-0.06*R);
  flat(P.rr(-0.02*R,-0.16*R,0.08*R,0.32*R,0.04*R),PAL.gold);
  form(P.c(-0.15*R,0,0.11*R),PAL.skin,PAL.skinD,null,-0.04*R,-0.04*R);
  ctx.restore();}
function drawRustBlade(x,y,a,R){ctx.save();ctx.translate(x,y);ctx.rotate(a);
  form(P.rr(-0.36*R,-0.07*R,0.38*R,0.14*R,0.05*R),PAL.woodD,null);
  form(P.poly([0.06*R,-0.15*R,0.86*R,-0.2*R,1.08*R,-0.04*R,0.94*R,0.16*R,0.6*R,0.14*R,0.52*R,0.2*R,0.44*R,0.14*R,0.06*R,0.15*R]),PAL.rust,PAL.woodD,null,0,-0.1*R);
  flat(P.c(0.78*R,-0.03*R,0.05*R),PAL.ink,true);
  flat(P.rr(0.0,-0.24*R,0.1*R,0.48*R,0.04*R),PAL.steelD);
  form(P.c(-0.15*R,0,0.12*R),PAL.skeleton[0],PAL.skeleton[1],null,-0.04*R,-0.04*R);
  ctx.restore();}
function drawArrowShape(x,y,a,L){ctx.save();ctx.translate(x,y);ctx.rotate(a);
  cord(()=>{ctx.beginPath();ctx.moveTo(-L*0.5,0);ctx.lineTo(L*0.36,0);},2,PAL.wood);
  form(P.poly([L*0.32,-L*0.12,L*0.56,0,L*0.32,L*0.12]),PAL.steel,PAL.steelD,null,0,-L*0.06);
  flat(P.poly([-L*0.4,0,-L*0.56,-L*0.13,-L*0.3,-L*0.13,-L*0.2,0,-L*0.3,L*0.13,-L*0.56,L*0.13]),PAL.archer[2]);
  ctx.restore();}

/* =================== ONE DRAW FUNCTION PER UNIT ===================
   Local coords: head centre at (0,0), radius R. Order: back props →
   head form → clipped face → head outline → front props.            */
function drawArcher(u){
  const R=u.R,F=faceAt(u),{c,s}=F,C=PAL.archer;
  // quiver on the back (opposite the face)
  ctx.save();ctx.translate(-c*0.62*R,-0.42*R+s*0.1*R);ctx.rotate(-c*0.45);
  for(let i=-1;i<=1;i++){const x=i*0.12*R;line([x,-0.3*R,x,-0.66*R],2.4);flat(P.poly([x-0.09*R,-0.56*R,x,-0.84*R,x+0.09*R,-0.56*R,x,-0.64*R]),C[2]);}
  form(P.rr(-0.21*R,-0.42*R,0.42*R,0.82*R,0.1*R),PAL.wood,PAL.woodD,null,-0.1*R,0);
  flat(P.rr(-0.24*R,-0.3*R,0.48*R,0.1*R,0.04*R),PAL.gold);
  ctx.restore();
  // hood point sweeps away from the face
  const hx=-c*0.2*R;form(P.poly([hx-0.5*R,-0.6*R,-c*0.86*R,-1.2*R,hx+0.38*R,-0.78*R]),C[0],C[1],null,0.08*R,0.06*R);
  const bow=propAt(u,0,1),bowBack=Math.sin(u.aim!=null?u.aim:u.th)<-0.35;
  if(bowBack)drawBow(u);
  headForm(R,C);
  clipHead(R);
  const k=1-0.1*F.ac,op=P.e(F.x,F.y+0.02*R,0.6*R*k,0.56*R);
  form(op,PAL.skin,PAL.skinD,null,0,0.17*R);
  ctx.save();op();ctx.clip();
  const by=F.y-0.56*R,pts=[F.x-0.8*R,by-0.2*R,F.x+0.8*R,by-0.2*R,F.x+0.8*R,by+0.2*R];
  for(let i=0;i<=6;i++){const x=F.x+0.66*R-i*0.22*R;pts.push(x,by+(i%2?0.34*R:0.2*R)+c*(x-F.x)*0.12);}
  pts.push(F.x-0.8*R,by+0.2*R);flat(P.poly(pts),PAL.wood);
  ctx.restore();outline(op);
  if(F.ac<0.75){flat(P.e(F.x-0.34*R*(1-0.35*F.ac)+c*0.04*R,F.y+0.2*R,0.08*R,0.045*R),PAL.skinD,true);}
  flat(P.e(F.x+0.34*R*(1-0.35*F.ac)+c*0.04*R,F.y+0.2*R,0.08*R,0.045*R),PAL.skinD,true);
  eyes(F,u,{sep:0.25,y:0.0,rx:0.12,ry:0.165,iris:C[0],brow:0.035,bw:0.065});
  mouth(F,u,{y:0.29,w:0.1});
  ctx.restore();outline(P.c(0,0,R));
  // feather tucked into the hood, opposite the face
  ctx.save();ctx.translate(-c*0.58*R,-0.55*R);ctx.rotate(-0.9-c*0.3);
  form(P.e(0,0,0.36*R,0.1*R),PAL.gold,null);line([-0.3*R,0,0.3*R,0],1.4);ctx.restore();
  if(!bowBack)drawBow(u);
}
function drawKnight(u){
  const R=u.R,F=faceAt(u),{c,s}=F,C=PAL.knight;
  // plume fin drifts opposite the face
  form(P.e(-c*0.22*R,-0.98*R,0.2*R,0.4*R,-c*0.45),C[2],C[0],null,-0.08*R,0);
  const sh=propAt(u,0.62,1.3),sw=propAt(u,-1.2,1.05);
  const swA=u.swordA!=null?u.swordA:(-Math.PI/2+0.35*sw.sg+Math.sin(u.t*1.6)*0.04);
  if(sw.y<-0.25*R)drawSword(sw.x,sw.y,swA,R);
  if(sh.y<-0.25*R)drawShield(sh.x,sh.y,R);
  headForm(R,C);
  // rivets on the side away from the face
  clipHead(R);
  const k=1-0.1*F.ac,op=P.e(F.x,F.y+0.04*R,0.56*R*k,0.53*R);
  flat(P.e(F.x,F.y+0.04*R,0.56*R*k+0.08*R,0.61*R),PAL.gold);
  form(op,PAL.skin,PAL.skinD,null,0,0.15*R);
  form(P.rr(F.x+c*0.05*R-0.075*R,F.y-0.85*R,0.15*R,0.78*R,0.07*R),PAL.steel,PAL.steelD,null,-0.05*R,0);
  eyes(F,u,{sep:0.29,y:0.0,rx:0.12,ry:0.16,iris:C[0],brow:0.03,bw:0.07});
  mouth(F,u,{y:0.3,w:0.1});
  ctx.restore();outline(P.c(0,0,R));
  if(sh.y>=-0.25*R)drawShield(sh.x+(u.shieldPush||0)*Math.cos(u.th)*R,sh.y+(u.shieldPush||0)*Math.sin(u.th)*R,R);
  if(sw.y>=-0.25*R)drawSword(sw.x,sw.y,swA,R);
}
function drawRogue(u){

function updateFx(dt){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;
  if(f.k==='dot'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=220*dt;f.vx*=0.96;}
  if(f.k==='arrowFall'&&f.t>=f.dur&&!f.done){f.done=true;if(f.onLand)f.onLand(f);}
  if(f.k==='glob'&&f.t>=f.dur&&!f.done){f.done=true;if(f.onLand)f.onLand(f);}

function once(u,key,fn){if(!u.fired[key]){u.fired[key]=1;fn();}}
function wpos(u,lx,ly){return [u.x+u.ox+lx*u.sx,u.y+u.oy+ly*u.sy];}

function poseMove(u,p,D,hop,hops){

  u.ox=u.fwd*D*(go?easeIO(p/0.5):1-easeIO((p-0.5)/0.5));
  const h=Math.abs(Math.sin(p*Math.PI*hops));u.oy-=h*hop;u.sy*=1+0.06*h;u.sx*=1-0.04*h;}

  archer(u,step,p){const F=fwdA(u);

function drawUI(){
  const lx=SAFE.l+10,ly=SAFE.t+6;ctx.font='900 12px '+FONT;const lw=ctx.measureText('C — Sliding 3/4 face').width+22;
  flat(P.rr(lx,ly,lw,22,11),PAL.white);ctx.fillStyle=PAL.ink;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('C — Sliding 3/4 face',lx+11,ly+11.5);
  ctx.textAlign='center';ctx.font='600 11px '+FONT;ctx.globalAlpha=0.6;ctx.fillText('tap a unit: move · attack · ability · hit · defeat',W0/2,ly+11.5);ctx.globalAlpha=1;
  const b=togRect();flat(P.rr(b.x,b.y,b.w,b.h,11),demo?PAL.gold:PAL.white);ctx.fillStyle=PAL.ink;ctx.font='900 11.5px '+FONT;ctx.textAlign='left';ctx.fillText('Facing demo',b.x+11,b.y+11.5);
  const sx=b.x+b.w-36;flat(P.rr(sx,b.y+4,27,14,7),demo?PAL.archer[0]:PAL.steel);flat(P.c(demo?sx+20:sx+7,b.y+11,5),PAL.white);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,cv.width,cv.height);baseT();
  if(shake>0)ctx.translate((rnd()-0.5)*shake,(rnd()-0.5)*shake);
  drawLabels();
  ctx.fillStyle='rgba(43,34,48,0.06)';P.rr(232,SMALL_Y-30,486,58,29)();ctx.fill();
  ctx.fillStyle=PAL.ink;ctx.textAlign='right';ctx.textBaseline='middle';ctx.font='900 11px '+FONT;ctx.fillText('IN-GAME SIZE',222,SMALL_Y-6);
  ctx.font='600 10px '+FONT;ctx.globalAlpha=0.6;ctx.fillText('~40px tokens',222,SMALL_Y+8);ctx.globalAlpha=1;
  if(demo)drawDot();
  const active=units.some(u=>u.seq>=0);
  const list=[...units,...ratPack].sort((a,b)=>a.y-b.y);
  for(const u of [...small].sort((a,b)=>a.y-b.y))drawUnit(u,1);
  for(const u of units)if(u.dummy&&u.dummy.sc>0){const d=u.dummy;ctx.fillStyle=PAL.groundShadow;ctx.beginPath();ctx.ellipse(d.x,d.y+d.R*0.92,d.R*0.82*d.sc,d.R*0.22*d.sc,0,0,TAU);ctx.fill();drawDummy(d);}
  for(const u of list){const lead=ratPack.includes(u)?units[3]:u;drawUnit(u,active&&lead.seq<0?0.35:1);}
  drawFx();
  for(const u of units)drawCaption(u);
  baseT();drawUI();
}

/* ============================ INPUT ============================== */
function toWorld(ev){return [(ev.clientX-OX)/S,(ev.clientY-OY)/S];}
cv.addEventListener('pointerdown',ev=>{const [x,y]=toWorld(ev),b=togRect();ev.preventDefault();
  if(x>b.x-8&&x<b.x+b.w+8&&y>b.y-8&&y<b.y+b.h+8){demo=!demo;return;}
  for(const m of small)if(Math.hypot(x-m.x,y-m.y)<26){startSeq(units.find(u=>u.type===m.type));return;}
  for(const u of units){if(Math.hypot(x-u.x,y-u.y)<u.R*1.45||(u.type==='rat'&&ratPack.some(r=>Math.hypot(x-r.x,y-r.y)<r.R*1.5))){startSeq(u);return;}}
  if(demo){dragging=true;DOT.x=x;DOT.y=y;}});
cv.addEventListener('pointermove',ev=>{if(dragging){const [x,y]=toWorld(ev);DOT.x=x;DOT.y=y;}});
addEventListener('pointerup',()=>{if(dragging){dragging=false;DOT.phi=Math.atan2((DOT.y-196)/30,(DOT.x-422)/182);}});
addEventListener('keydown',e=>{if(e.key==='f')demo=!demo;if(e.key>='1'&&e.key<='6')startSeq(units[+e.key-1]);});

/* ============================= LOOP ============================== */
let last=performance.now();
function frame(now){const dt=Math.min(0.033,Math.max(0,(now-last)/1000));last=now;
  if(demo)updateDot(dt);
  for(const u of units)updateUnit(u,dt,demo);
  for(const m of small)updateUnit(m,dt,demo);
  for(const r of ratPack){updateUnit(r,dt,demo);if(!demo&&units[3].seq<0)r.thT=0.6;r.ox=units[3].seq===0?units[3].ox*0.9:0;}
  updateFx(dt);render();requestAnimationFrame(frame);}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();
if(/demo/.test(location.hash))demo=true;
requestAnimationFrame(frame);
</script>
</body>
</html>
