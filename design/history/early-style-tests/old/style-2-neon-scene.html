<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05051a">
<title>Style 2 — Neon</title>
<style>
  html,body{margin:0;height:100%;background:#05051a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
  .hud{position:fixed;font:600 10px/1 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    letter-spacing:.06em;color:#8d93e0;z-index:2}
  #label{left:calc(env(safe-area-inset-left) + 10px);bottom:calc(env(safe-area-inset-bottom) + 9px);
    pointer-events:none;opacity:.85}
  #toggle{right:calc(env(safe-area-inset-right) + 2px);top:calc(env(safe-area-inset-top) + 2px);
    padding:12px;background:none;border:0;cursor:pointer;touch-action:manipulation}
  #toggle span{display:block;padding:5px 10px 5px;border-radius:99px;border:1px solid rgba(120,128,255,.55);
    background:rgba(8,8,30,.72);color:#c9ccff;box-shadow:0 0 8px rgba(91,99,255,.35),inset 0 0 6px rgba(91,99,255,.25)}
  #toggle:active span{background:rgba(60,66,190,.5)}
  #toggle:focus-visible span{outline:2px solid #c9ccff;outline-offset:2px}
  #fps{right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 9px);display:none;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label" class="hud">Style 2 — Neon</div>
<button id="toggle" class="hud" aria-label="Toggle lineup view"><span>Lineup</span></button>
<div id="fps" class="hud"></div>
<script>
'use strict';
/* =====================================================================
   STYLE 2 — NEON GEOMETRY
   Everything is line-art light on a dark indigo floor. Glow is faked with
   layered strokes in 'lighter' composite + cached radial sprites + a cheap
   mip-chain bloom of the emissive layer. No shadowBlur anywhere.
   ===================================================================== */

// ---------------------------------------------------------------- config
const TAU = Math.PI * 2, HALF_PI = Math.PI / 2;
const WORLD_W = 844, WORLD_H = 390;
const ROOM = { x0: 30, y0: 22, x1: 814, y1: 368, chamfer: 38 };
const BLOOM = true;
const TRAIL_N = 10, TRAIL_DT = 0.04;

// ---------------------------------------------------------------- palette
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
/** A tone = signature colour + whitened core (for the hot centre of a neon tube). */
function tone(hex, coreMix = 0.55) { return { c: hex, core: mixHex(hex, '#ffffff', coreMix), rgb: hexRgb(hex) }; }

const PAL = {
  bg: '#05051a', floor: '#0a0a22', body: '#07071a', void: '#030310',
  wall: tone('#5b63ff', 0.45), torchA: tone('#5b63ff', 0.5), torchB: tone('#9a5cff', 0.5),
  pillar: tone('#7c6dff', 0.45),
  // heroes — cool, clean
  knight: tone('#4d9cff'), archer: tone('#3dffb0'), rogue: tone('#c77dff'),
  // foes — hot, sickly
  rat: tone('#ff3d5e'), slime: tone('#ff4fd8'), bone: tone('#f2e4c0', 0.4), boneEye: tone('#ff2e3a', 0.35),
  // statuses
  burn: tone('#ff7b22', 0.5), chill: tone('#8fe3ff', 0.6), poison: tone('#a8ff3e', 0.5), shock: tone('#fff27a', 0.7),
  // misc
  white: tone('#ffffff', 0), hurt: tone('#ff6b7d', 0.5), spike: tone('#cfd6ff', 0.5), danger: tone('#ff3b3b', 0.4),
  dummy: tone('#8a8fc8', 0.45), text: '#9ba0e0'
};
const STATUS_KEYS = ['burn', 'chill', 'poison', 'shock'];

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function crossed(pc, c, T) { return pc <= c ? (pc < T && T <= c) : (T > pc || T <= c); }

// ---------------------------------------------------------------- canvases
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const fxC = document.createElement('canvas'); const fx = fxC.getContext('2d');      // emissive layer
const floorC = document.createElement('canvas'); const fl = floorC.getContext('2d'); // static floor
const mips = [0, 1, 2, 3].map(() => { const c = document.createElement('canvas'); return { c, g: c.getContext('2d') }; });
let DPR = 1, W = 0, H = 0, SCALE = 1, OX = 0, OY = 0;

// ---------------------------------------------------------------- glow sprites (cached per colour)
const glowCache = new Map();
function glowSprite(t) {
  let s = glowCache.get(t.c); if (s) return s;
  const S = 64; s = document.createElement('canvas'); s.width = s.height = S;
  const g = s.getContext('2d'), [r, gg, b] = t.rgb, [cr, cg, cb] = hexRgb(t.core);
  const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  gr.addColorStop(0, `rgba(${cr},${cg},${cb},1)`);
  gr.addColorStop(0.16, `rgba(${r},${gg},${b},0.6)`);
  gr.addColorStop(0.42, `rgba(${r},${gg},${b},0.17)`);
  gr.addColorStop(0.7, `rgba(${r},${gg},${b},0.05)`);
  gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  glowCache.set(t.c, s); return s;
}
/** additive soft light blob (caller keeps composite = 'lighter') */
function glow(g, t, x, y, rad, alpha) {
  if (alpha <= 0.004 || rad <= 0.2) return;
  g.globalAlpha = alpha > 1 ? 1 : alpha; g.drawImage(glowSprite(t), x - rad, y - rad, rad * 2, rad * 2);
}

// ---------------------------------------------------------------- neon stroke helpers
let ghostMode = false; // when true, bodies are drawn outline-only (afterimages)
let lwMul = 1;          // thins strokes when an entity is drawn zoomed (lineup)
/** Full neon tube: wide faint halo + mid glow + hot core. Path must already be built. */
function neon(g, t, w, a) {
  w *= lwMul; g.strokeStyle = t.c;
  g.globalAlpha = Math.min(1, 0.13 * a); g.lineWidth = w * 4.6; g.stroke();
  g.globalAlpha = Math.min(1, 0.34 * a); g.lineWidth = w * 2.2; g.stroke();
  g.strokeStyle = t.core; g.globalAlpha = Math.min(1, a); g.lineWidth = w; g.stroke();
}
/** Cheaper 2-pass tube for secondary details. */
function neonLite(g, t, w, a) {
  w *= lwMul; g.strokeStyle = t.c; g.globalAlpha = Math.min(1, 0.3 * a); g.lineWidth = w * 2.6; g.stroke();
  g.strokeStyle = t.core; g.globalAlpha = Math.min(1, a); g.lineWidth = w; g.stroke();
}
/** Dark glass body — occludes floor & trails, then a faint additive tint of the signature colour. */
function darkFill(g, t, tint, flash, a) {
  if (ghostMode) return;
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 0.94 * a; g.fillStyle = PAL.body; g.fill();
  g.globalCompositeOperation = 'lighter';
  g.globalAlpha = Math.min(1, (tint + flash * 0.2) * a); g.fillStyle = t.c; g.fill();
}
function circlePath(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }

// ---------------------------------------------------------------- fonts (cached strings)
const FONT_FAMILY = 'ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif';
const fontCache = new Map();
function font(size, weight = 800) { const k = size * 1000 + weight; let f = fontCache.get(k); if (!f) { f = `${weight} ${size}px ${FONT_FAMILY}`; fontCache.set(k, f); } return f; }

// =====================================================================
// PARTICLES (pooled)
// =====================================================================
const PK = { DOT: 0, SPARK: 1, SHARD: 2, BUBBLE: 3, SHADE: 4, FLAME: 5 };
const P_MAX = 900, pPool = [], pLive = [];
for (let i = 0; i < P_MAX; i++) pPool.push({ x: 0, y: 0, vx: 0, vy: 0, t: 0, life: 1, size: 1, tone: null, kind: 0, rot: 0, vr: 0, drag: 0, grav: 0 });
function emit(kind, x, y, vx, vy, life, size, t, drag = 0, grav = 0) {
  const p = pPool.pop(); if (!p) return null;
  p.kind = kind; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.t = 0; p.life = life; p.size = size; p.tone = t;
  p.drag = drag; p.grav = grav; p.rot = Math.random() * TAU; p.vr = 0;
  pLive.push(p); return p;
}
function burst(kind, x, y, n, spMin, spMax, lifeMin, lifeMax, size, t, drag = 3, grav = 0, angC = null, spread = Math.PI) {
  for (let i = 0; i < n; i++) {
    const a = angC == null ? Math.random() * TAU : angC + rand(-spread, spread), sp = rand(spMin, spMax);
    const p = emit(kind, x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(lifeMin, lifeMax), size * rand(0.7, 1.25), t, drag, grav);
    if (p && kind === PK.SHARD) p.vr = rand(-14, 14);
  }
}
function updateParticles(dt) {
  for (let i = pLive.length - 1; i >= 0; i--) {
    const p = pLive[i]; p.t += dt;
    if (p.t >= p.life) { pLive[i] = pLive[pLive.length - 1]; pLive.pop(); pPool.push(p); continue; }
    const d = Math.exp(-p.drag * dt); p.vx *= d; p.vy = p.vy * d + p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}
function clearParticles() { while (pLive.length) pPool.push(pLive.pop()); }

function drawShadeParticles(g) {
  g.globalCompositeOperation = 'source-over'; g.fillStyle = '#000000';
  for (const p of pLive) {
    if (p.kind !== PK.SHADE) continue;
    const k = 1 - p.t / p.life; g.globalAlpha = 0.55 * k;
    circlePath(g, p.x, p.y, p.size * (1.4 - 0.6 * k)); g.fill();
  }
  g.globalCompositeOperation = 'lighter';
}
function drawParticles(g) {
  for (const p of pLive) {
    const k = 1 - p.t / p.life, T = p.tone;
    switch (p.kind) {
      case PK.DOT: glow(g, T, p.x, p.y, p.size * (0.45 + 0.55 * k), k); break;
      case PK.SPARK: {
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 0.045, p.y - p.vy * 0.045);
        g.strokeStyle = T.c; g.globalAlpha = 0.35 * k; g.lineWidth = p.size * 2.8; g.stroke();
        g.strokeStyle = T.core; g.globalAlpha = k; g.lineWidth = p.size * (0.4 + 0.6 * k); g.stroke(); break;
      }
      case PK.SHARD: {
        const s = p.size, c = Math.cos(p.rot), sn = Math.sin(p.rot);
        g.beginPath(); g.moveTo(p.x + c * s * 1.6, p.y + sn * s * 1.6);
        g.lineTo(p.x - c * s * 0.8 - sn * s * 0.7, p.y - sn * s * 0.8 + c * s * 0.7);
        g.lineTo(p.x - c * s * 0.8 + sn * s * 0.7, p.y - sn * s * 0.8 - c * s * 0.7); g.closePath();
        g.globalAlpha = 0.25 * k; g.fillStyle = T.c; g.fill();
        neonLite(g, T, 0.9, k); break;
      }
      case PK.BUBBLE: circlePath(g, p.x, p.y, p.size * (0.7 + 0.5 * (1 - k))); neonLite(g, T, 0.7, 0.85 * k); break;
      case PK.FLAME: {
        const s = p.size * (0.5 + 0.5 * k);
        g.beginPath(); g.moveTo(p.x, p.y - s * 1.8); g.lineTo(p.x + s * 0.8, p.y + s * 0.4); g.lineTo(p.x - s * 0.8, p.y + s * 0.4); g.closePath();
        g.globalAlpha = 0.5 * k; g.fillStyle = T.c; g.fill(); neonLite(g, T, 0.6, k); break;
      }
    }
  }
}

// =====================================================================
// FLOATING TEXT (pooled)
// =====================================================================
const T_MAX = 70, tPool = [], tLive = [];
for (let i = 0; i < T_MAX; i++) tPool.push({ x: 0, y: 0, vx: 0, vy: 0, t: 0, life: 1, str: '', tone: null, size: 9, word: false });
function popText(x, y, str, t, size = 9, word = false) {
  const o = tPool.pop(); if (!o) return;
  o.x = x + (word ? 0 : rand(-6, 6)); o.y = word ? y - 8 : y; o.vx = rand(-10, 10); o.vy = word ? -18 : -34; o.t = 0; o.life = word ? 1.05 : 0.8;
  o.str = str; o.tone = t; o.size = size; o.word = word; tLive.push(o);
}
function updateTexts(dt) {
  for (let i = tLive.length - 1; i >= 0; i--) {
    const o = tLive[i]; o.t += dt;
    if (o.t >= o.life) { tLive[i] = tLive[tLive.length - 1]; tLive.pop(); tPool.push(o); continue; }
    o.vy *= Math.exp(-2.6 * dt); o.vx *= Math.exp(-3 * dt); o.x += o.vx * dt; o.y += o.vy * dt;
  }
}
function drawTexts(g) {
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const o of tLive) {
    const p = o.t / o.life, a = p < 0.65 ? 1 : 1 - (p - 0.65) / 0.35;
    const pop = 1 + 0.6 * Math.max(0, 1 - p * 7);
    g.save(); g.translate(o.x, o.y); g.scale(pop, pop);
    glow(g, o.tone, 0, 0, o.size * (o.word ? 2.6 : 1.7), 0.45 * a);
    g.font = font(o.size, o.word ? 800 : 900);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 0.85 * a;
    g.lineWidth = 3; g.strokeStyle = PAL.void; g.strokeText(o.str, 0, 0);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = a; g.fillStyle = o.tone.core; g.fillText(o.str, 0, 0);
    g.restore();
  }
}

// =====================================================================
// TRANSIENT FX (rings, rays, flashes, slashes, bolts, ghosts, shadow paths)
// =====================================================================
const fxs = [];
function addFx(o) { o.t = 0; fxs.push(o); return o; }
function ring(x, y, r0, r1, life, t, w = 2, layer = 1) { return addFx({ k: 'ring', x, y, r0, r1, life, tone: t, w, layer }); }
function flash(x, y, rad, life, t) { return addFx({ k: 'flash', x, y, rad, life, tone: t, layer: 1 }); }
function rays(x, y, n, r0, r1, life, t, w = 1.3) { return addFx({ k: 'rays', x, y, n, r0, r1, life, tone: t, w, rot: Math.random() * TAU, layer: 1 }); }
function slash(x, y, ang, r, arc, dir, life, t, w = 2) { return addFx({ k: 'slash', x, y, ang, r, arc, dir, life, tone: t, w, layer: 1 }); }
function bolt(x0, y0, x1, y1, life = 0.28, t = PAL.shock) { const f = addFx({ k: 'bolt', x0, y0, x1, y1, life, tone: t, pts: new Float32Array(18), jt: 0, layer: 1 }); jitterBolt(f); return f; }
function shadowPath(x0, y0, x1, y1) { return addFx({ k: 'spath', x0, y0, x1, y1, life: 0.55, layer: 0 }); }
function xMark(x, y, s, life, t) { return addFx({ k: 'xmark', x, y, s, life, tone: t, rot: rand(0, 1), layer: 1 }); }
function ghost(e, life = 0.3, alpha = 0.5) {
  const snap = { type: e.type, x: e.x, y: e.y, r: e.r, facing: e.facing, tone: e.tone, anim: e.anim, flash: 0, state: e.state,
    swing: e.swing, pull: e.pull, stab: e.stab, stabSide: e.stabSide, bite: e.bite, squash: e.squash, teleP: e.teleP, size: e.size, drawScale: e.drawScale || 1 };
  return addFx({ k: 'ghost', e: snap, life, alpha, layer: 0 });
}
function jitterBolt(f) {
  const n = f.pts.length / 2, dx = f.x1 - f.x0, dy = f.y1 - f.y0, L = Math.hypot(dx, dy) || 1, px = -dy / L, py = dx / L;
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1), j = (i === 0 || i === n - 1) ? 0 : rand(-1, 1) * Math.min(9, L * 0.12);
    f.pts[i * 2] = f.x0 + dx * u + px * j; f.pts[i * 2 + 1] = f.y0 + dy * u + py * j;
  }
}
function updateFx(dt) {
  for (let i = fxs.length - 1; i >= 0; i--) {
    const f = fxs[i]; f.t += dt;
    if (f.k === 'bolt') { f.jt -= dt; if (f.jt <= 0) { f.jt = 0.035; jitterBolt(f); } }
    if (f.t >= f.life) { fxs[i] = fxs[fxs.length - 1]; fxs.pop(); }
  }
}
function drawFxLayer(g, layer) { for (const f of fxs) if (f.layer === layer) FX_DRAW[f.k](g, f); }

function drawRingFx(g, f) {
  const p = f.t / f.life, r = lerp(f.r0, f.r1, easeOut(p));
  circlePath(g, f.x, f.y, Math.max(0.1, r)); neon(g, f.tone, Math.max(0.2, f.w * (1 - p * 0.85)), 1 - p);
}
function drawFlashFx(g, f) { const p = f.t / f.life; glow(g, f.tone, f.x, f.y, f.rad * (0.6 + 0.4 * p), (1 - p) * (1 - p)); }
function drawRaysFx(g, f) {
  const p = f.t / f.life, e = easeOut(p), r1 = lerp(f.r0, f.r1, e), r0 = lerp(f.r0, f.r1, Math.max(0, e * 1.25 - 0.25));
  g.beginPath();
  for (let i = 0; i < f.n; i++) {
    const a = f.rot + i / f.n * TAU, c = Math.cos(a), s = Math.sin(a);
    g.moveTo(f.x + c * r0, f.y + s * r0); g.lineTo(f.x + c * r1, f.y + s * r1);
  }
  neonLite(g, f.tone, f.w * (1 - p * 0.6), 1 - p);
}
function drawSlashFx(g, f) {
  const p = f.t / f.life, a = 1 - p * p, half = f.arc / 2;
  const start = f.ang + half * f.dir, end = f.ang - half * f.dir;
  const head = start + (end - start) * easeOut(Math.min(1, p * 2.4));
  const tail = start + (end - start) * Math.min(1, p * 1.15);
  const a0 = Math.min(head, tail), a1 = Math.max(head, tail);
  if (a1 - a0 < 0.01) return;
  const mid = (a0 + a1) / 2, off = f.r * 0.2;
  g.beginPath(); g.arc(f.x, f.y, f.r, a0, a1);
  g.arc(f.x + Math.cos(mid) * off, f.y + Math.sin(mid) * off, f.r * 0.78, a1, a0, true); g.closePath();
  g.globalAlpha = 0.3 * a; g.fillStyle = f.tone.c; g.fill();
  g.beginPath(); g.arc(f.x, f.y, f.r, a0, a1); neon(g, f.tone, f.w, a);
  glow(g, f.tone, f.x + Math.cos(head) * f.r, f.y + Math.sin(head) * f.r, 8, a);
}
function drawBoltFx(g, f) {
  const p = f.t / f.life, n = f.pts.length / 2;
  g.beginPath(); g.moveTo(f.pts[0], f.pts[1]);
  for (let i = 1; i < n; i++) g.lineTo(f.pts[i * 2], f.pts[i * 2 + 1]);
  neon(g, f.tone, 1.3, 1 - p * 0.7);
  glow(g, f.tone, f.x1, f.y1, 12, 1 - p);
}
function drawSPathFx(g, f) {
  const p = f.t / f.life, dx = f.x1 - f.x0, dy = f.y1 - f.y0, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const n = Math.max(3, Math.min(8, L / 12 | 0));
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n, a = clamp(1.4 - p * 2 - (1 - u) * 0.5, 0, 1); if (a <= 0) continue;
    const x = f.x0 + dx * u, y = f.y0 + dy * u, s = 3.4;
    g.beginPath(); g.moveTo(x - ux * s - uy * s, y - uy * s + ux * s); g.lineTo(x, y); g.lineTo(x - ux * s + uy * s, y - uy * s - ux * s);
    neonLite(g, PAL.rogue, 1, a);
  }
}
function drawXMarkFx(g, f) {
  const p = f.t / f.life, a = 1 - p, s = f.s * (0.7 + 0.5 * easeOut(Math.min(1, p * 3)));
  g.beginPath();
  for (let i = 0; i < 2; i++) { const ang = f.rot + 0.785 + i * HALF_PI, c = Math.cos(ang) * s, sn = Math.sin(ang) * s; g.moveTo(f.x - c, f.y - sn); g.lineTo(f.x + c, f.y + sn); }
  neon(g, f.tone, 1.6, a);
}
function drawGhostFx(g, f) {
  const p = f.t / f.life, e = f.e, s = e.drawScale;
  ghostMode = true; g.save(); g.translate(e.x, e.y); g.scale(s, s); g.rotate(e.facing); lwMul = s > 1.2 ? 1.6 / (s + 0.6) : 1;
  DRAW[e.type](g, e, f.alpha * (1 - p)); g.restore(); ghostMode = false; lwMul = 1;
}
const FX_DRAW = { ring: drawRingFx, flash: drawFlashFx, rays: drawRaysFx, slash: drawSlashFx, bolt: drawBoltFx, spath: drawSPathFx, xmark: drawXMarkFx, ghost: drawGhostFx };

// screen shake
let shakeAmp = 0, shx = 0, shy = 0;
function shake(v) { shakeAmp = Math.max(shakeAmp, v); }

// =====================================================================
// ENTITIES — definitions
// =====================================================================
const DEFS = {

      case 'poison': if (c < 2.2) e.poison = c / 2.2 * 100; else decay('poison'); if (X(2.2)) { e.poison = 25; spawnCloud(e.x, e.y, -1, 2.0); } break;
      case 'shock':
        if (c < 2.0) e.shock = c / 2.0 * 100; else e.shock = 0;
        if (X(2.0)) {
          e.stun = 0.9; e.flash = 1; burst(PK.SPARK, e.x, e.y, 8, 60, 160, 0.15, 0.3, 1, PAL.shock, 5);
          let px = e.x, py = e.y, a = rand(0, TAU);
          for (let k = 0; k < 3; k++) { a += rand(1.4, 2.4); const nx = e.x + Math.cos(a) * rand(38, 52), ny = e.y + Math.sin(a) * rand(20, 30); bolt(px, py, nx, ny, 0.35); burst(PK.SPARK, nx, ny, 4, 40, 120, 0.12, 0.25, 0.9, PAL.shock, 5); px = nx; py = ny; }
          popText(e.x, e.y - R - 14, 'Chain shock', PAL.shock, 8, true);
        }
        if (e.stun > 0) e.stun -= dt;
        break;
    }
    statusParticles(e, dt);
  }
  updateProjectiles(dt, false);
  for (let i = clouds.length - 1; i >= 0; i--) { const c = clouds[i]; c.t += dt; if (Math.random() < dt * 6) emit(PK.BUBBLE, c.x + rand(-c.r, c.r) * 0.7, c.y + rand(-c.r, c.r) * 0.6, 0, rand(-8, -16), rand(0.6, 1), rand(1.2, 2.4), PAL.poison, 1); if (c.t >= c.life) { clouds[i] = clouds[clouds.length - 1]; clouds.pop(); } }
}
function drawLineupChrome(g) {
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  // section titles
  const titles = [['Heroes', 230], ['Foes', 614]];
  for (const [t, x] of titles) {
    g.font = font(10, 700); g.globalAlpha = 0.75; g.fillStyle = PAL.text; g.fillText(t, x, 52);
    g.beginPath(); g.moveTo(x - 108, 48.5); g.lineTo(x - 26, 48.5); g.moveTo(x + 26, 48.5); g.lineTo(x + 108, 48.5);
    g.strokeStyle = PAL.wall.c; g.globalAlpha = 0.3; g.lineWidth = 0.7; g.stroke();
  }
  // divider
  g.beginPath(); for (let y = 62; y < 236; y += 7) { g.moveTo(422, y); g.lineTo(422, y + 2.5); }
  g.strokeStyle = PAL.wall.c; g.globalAlpha = 0.35; g.lineWidth = 0.8; g.stroke();
  // labels
  for (const e of lineupEnts) {
    const L = e.L, T = e.tone;
    glow(g, T, L.x, 206, 30, 0.12);
    g.font = font(12.5, 800); g.globalAlpha = 1; g.fillStyle = T.core; g.fillText(L.name, L.x, 210);
    g.font = font(7.6, 500); g.globalAlpha = 0.85; g.fillStyle = PAL.text;
    wrapCentered(g, L.d1, L.x, 224, 112, 9.5);
    g.globalAlpha = 0.9; g.fillStyle = T.c; g.font = font(7.6, 650);
    wrapCentered(g, L.d2, L.x, 245, 112, 9.5);
  }
  // status row
  g.beginPath(); g.moveTo(90, 262.5); g.lineTo(754, 262.5);
  g.strokeStyle = PAL.wall.c; g.globalAlpha = 0.3; g.lineWidth = 0.7; g.stroke();
  for (const e of dummyEnts) { g.font = font(8.2, 650); g.globalAlpha = 0.95; g.fillStyle = PAL[e.D.st].core; g.fillText(e.D.label, e.D.x, 348); }
}
function wrapCentered(g, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '', yy = y;
  for (const w of words) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { g.fillText(line, x, yy); line = w; yy += lh; } else line = t; }
  if (line) g.fillText(line, x, yy);
}

// =====================================================================
// RENDER PIPELINE
// =====================================================================
let mode = 'battle';
const STATS = window.STATS = { scorch: 0, freeze: 0, shatter: 0, cloud: 0, chain: 0, charge: 0, barrage: 0, shadow: 0, split: 0, workMs: 0 };
function renderScene(g, list, extra) {
  drawAmbient(g, time + LT);
  if (mode === 'battle') drawSpikes(g, SPIKES, time);
  for (const e of list) if (e.type === 'bone' && e.state === 'tele') drawTelegraph(g, e);
  drawShadeParticles(g);
  for (const e of list) drawTrail(g, e);
  for (const e of list) drawHalo(g, e);
  drawFxLayer(g, 0);
  if (mode === 'battle') for (const p of PILLARS) drawPillar(g, p, time);
  for (const e of list) drawEntity(g, e);
  drawClouds(g);
  drawFxLayer(g, 1);
  drawProjectiles(g);
  drawParticles(g);
  if (extra) extra(g);
  drawTexts(g);
}
function render() {
  // shake
  if (shakeAmp > 0.05) { shx = rand(-1, 1) * shakeAmp; shy = rand(-1, 1) * shakeAmp; shakeAmp *= 0.86; } else { shx = shy = 0; shakeAmp = 0; }
  const sx = shx * SCALE, sy = shy * SCALE;
  // base: floor
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.void; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(floorC, sx, sy);
  if (mode === 'lineup') { ctx.globalAlpha = 0.5; ctx.fillStyle = PAL.void; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // emissive layer
  fx.setTransform(1, 0, 0, 1, 0, 0); fx.globalCompositeOperation = 'source-over'; fx.globalAlpha = 1; fx.clearRect(0, 0, W, H);
  fx.setTransform(SCALE, 0, 0, SCALE, OX + sx, OY + sy);
  fx.globalCompositeOperation = 'lighter'; fx.lineCap = 'round'; fx.lineJoin = 'round';
  if (mode === 'battle') renderScene(fx, ents, null);
  else renderScene(fx, lineupEnts.concat(dummyEnts), drawLineupChrome);
  fx.globalCompositeOperation = 'source-over'; fx.globalAlpha = 1;
  ctx.drawImage(fxC, 0, 0);
  // cheap bloom: mip chain of the emissive layer, added back
  if (BLOOM) {
    let src = fxC;
    for (const m of mips) { m.g.globalCompositeOperation = 'copy'; m.g.drawImage(src, 0, 0, m.c.width, m.c.height); src = m.c; }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.24; ctx.drawImage(mips[1].c, 0, 0, W, H);
    ctx.globalAlpha = 0.34; ctx.drawImage(mips[2].c, 0, 0, W, H);
    ctx.globalAlpha = 0.45; ctx.drawImage(mips[3].c, 0, 0, W, H);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
}

// =====================================================================
// BOOT / LOOP / INPUT
// =====================================================================
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  W = Math.max(1, Math.round(cw * DPR)); H = Math.max(1, Math.round(ch * DPR));
  cv.width = W; cv.height = H; fxC.width = W; fxC.height = H; floorC.width = W; floorC.height = H;
  SCALE = Math.min(cw / WORLD_W, ch / WORLD_H) * DPR;
  OX = (W - WORLD_W * SCALE) / 2; OY = (H - WORLD_H * SCALE) / 2;
  let w = W, h = H; for (const m of mips) { w = Math.max(1, Math.round(w / 2)); h = Math.max(1, Math.round(h / 2)); m.c.width = w; m.c.height = h; m.g.imageSmoothingEnabled = true; }
  buildFloor();
}
const toggleBtn = document.getElementById('toggle');
function setMode(m) {
  mode = m; projs.length = 0; clouds.length = 0; fxs.length = 0; clearParticles(); tLive.forEach(o => tPool.push(o)); tLive.length = 0;
  if (m === 'lineup') { buildLineup(); LT = 0; }
  toggleBtn.firstElementChild.textContent = m === 'lineup' ? 'Battle' : 'Lineup';
}
toggleBtn.addEventListener('click', e => { e.preventDefault(); setMode(mode === 'battle' ? 'lineup' : 'battle'); });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

const fpsEl = document.getElementById('fps'), showFps = /fps/.test(location.hash);
if (showFps) fpsEl.style.display = 'block';
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  const w0 = performance.now();
  if (mode === 'battle') updateBattle(dt); else updateLineup(dt);
  updateParticles(dt); updateFx(dt); updateTexts(dt);
  render();
  STATS.workMs = STATS.workMs * 0.95 + (performance.now() - w0) * 0.05;
  if (showFps) { fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fpsEl.textContent = Math.round(fpsN / fpsAcc) + ' fps  ' + STATS.workMs.toFixed(1) + 'ms  ' + pLive.length + 'p'; fpsAcc = 0; fpsN = 0; } }
  requestAnimationFrame(frame);
}
resize(); initBattle();
if (/lineup/.test(location.hash)) setMode('lineup');
requestAnimationFrame(frame);
</script>
