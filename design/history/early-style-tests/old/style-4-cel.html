<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2536">
<title>Style 4 — Cel</title>
<style>
  html,body{margin:0;height:100%;background:#2b2536;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas{position:fixed;left:0;top:0;display:block}
  #tag{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
    font:800 11px/1 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.03em;
    color:#2b2536;background:#ffe9b8;border:1.5px solid #8a5a3c;border-radius:999px;padding:5px 10px;pointer-events:none;
    box-shadow:0 2px 0 #8a5a3c}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag">Style 4 — Cel</div>
<script>
'use strict';
/* =====================================================================
   STYLE 4 — "CEL-SHADED VECTOR"
   Every form = flat base fill + ONE hard shadow shape + ONE hard highlight
   shape + a thin outline in a dark shade of its own colour. Ground shadows
   are flat hard-edged ellipses. No gradients, no blur. Everything is plain
   canvas paths, so it stays crisp at any scale and is cheap to draw.
   ===================================================================== */

// ---------- SHARED PALETTE ----------
const PAL = {
  bg:'#2b2536', bgPanel:'#332c40', stage:'#3b3349', stageRim:'#463d56', ground:'rgba(16,9,26,.42)',
  ink:'#1d1030',            // outlines are mixed toward this, never pure black
  shadeTo:'#2b1b4a',        // cel shadows shift cool/purple
  hiTo:'#fffdf0',           // highlights shift warm/cream
  text:'#ffe9b8', textSub:'#b9a9cf', heroTag:'#ffcf5a', foeTag:'#ff7a6b',
  knight:'#4f86f0', steel:'#d7e0ea', plume:'#f0503f', shield:'#d9443a', gold:'#ffc94a', blade:'#eef8ff', frost:'#9fe2ff',
  archer:'#5cb85a', hood:'#3d8a4a', skin:'#ffd2a6', cheek:'#ff8f86', wood:'#c98a4b', string:'#fff3da', fletch:'#ff6b5b', leather:'#8a5530',
  rogue:'#9a62d8', mask:'#2e2147', tail:'#3d2c63', dagger:'#e6eef6', teal:'#3fd0bb', venom:'#a6f050',
  rat:'#a99487', ratSnout:'#cdb9ab', ratPink:'#ffa9ae', ratEye:'#2a1420',
  slime:'#ff5fa0', slimeCore:'#ffb3d2', slimeEye:'#4a1030',
  bone:'#f1e6cc', socket:'#3b2630', ember:'#ffb03b', rust:'#b8653a', iron:'#a7b0bb', hilt:'#6b4a35',
  burn:'#ff7a26', burnHot:'#ffd24a', chill:'#86d8ff', ice:'#c9f0ff', poison:'#9be04a', gas:'#7fcf45', shock:'#ffe14a',
  white:'#ffffff', star:'#fff6c8', dmg:'#ffffff', crit:'#ffd84a', dodge:'#9ff0ff',
};
const FONT = 'ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const TAU = Math.PI * 2;
const W = 844, H = 390;

// ---------- UTIL ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIn = t => Math.pow(clamp(t, 0, 1), 2);
const easeInOut = t => (t = clamp(t, 0, 1), t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function hx(c) { c = c.slice(1); if (c.length === 3) c = c.replace(/./g, x => x + x); return [parseInt(c.slice(0,2),16), parseInt(c.slice(2,4),16), parseInt(c.slice(4,6),16)]; }
function toHex(a) { return '#' + a.map(v => Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join(''); }
function mix(a, b, t) { const A = hx(a), B = hx(b); return toHex([A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t]); }
// cel tone ramp, memoised so the hot path never parses colours
const TONES = new Map();
function tones(c) {
  let t = TONES.get(c);
  if (!t) { t = { base: c, sh: mix(c, PAL.shadeTo, .38), hi: mix(c, PAL.hiTo, .52), ol: mix(c, PAL.ink, .64) }; TONES.set(c, t); }
  return t;
}

// ---------- CANVAS / DPR ----------
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let DPR = 1, VS = 1, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
  cvs.width = Math.round(w * DPR); cvs.height = Math.round(h * DPR);
  VS = Math.min(w / W, h / H);
  OX = (w - W * VS) / 2; OY = (h - H * VS) / 2;
}
window.addEventListener('resize', resize);

// ---------- CEL PRIMITIVES ----------
// LW = outline width in unit space; set per draw so outlines stay ~constant on screen.
let LW = 1;
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
// A cel ball: shadow fill, lit disc (offset toward light, clipped), hard highlight, outline.
// Light is world top-left; callers drawing inside a rotated frame pass lx,ly = local light dir.
function cel(x, y, r, c, o) {
  const t = tones(c), lx = o && o.lx !== undefined ? o.lx : -.7, ly = o && o.ly !== undefined ? o.ly : -.7;
  circ(x, y, r); ctx.fillStyle = t.sh; ctx.fill();
  ctx.save(); ctx.clip();
  circ(x + lx * r * .3, y + ly * r * .3, r * .93); ctx.fillStyle = t.base; ctx.fill();
  if (!o || o.hl !== false) {
    const a = Math.atan2(ly, lx);
    ctx.beginPath(); ctx.ellipse(x + lx * r * .5, y + ly * r * .5, r * .3, r * .15, a + Math.PI / 2, 0, TAU);
    ctx.fillStyle = t.hi; ctx.fill();
  }
  ctx.restore();
  circ(x, y, r); ctx.lineWidth = (o && o.lw) || LW; ctx.strokeStyle = (o && o.ol) || t.ol; ctx.stroke();
}
// flat path helpers for props: fill base, then a hard shadow half, a hard light strip, outline
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
function fillStroke(fill, ol, lw) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw || LW; ctx.strokeStyle = ol; ctx.stroke(); }
function groundShadow(x, y, r, z) {
  const k = 1 / (1 + z * .012);
  ctx.beginPath(); ctx.ellipse(x + r * .16 + z * .25, y + r * .3 + z * .35, r * 1.04 * k, r * .86 * k, 0, 0, TAU);
  ctx.fillStyle = PAL.ground; ctx.fill();
}

// Light direction used by cel(): world top-left, re-expressed in a unit's facing frame.
let CLX = -.7, CLY = -.7;
function enterFacing(e) { ctx.save(); ctx.rotate(e.face); const c = Math.cos(e.face), s = Math.sin(e.face); CLX = -.7 * c - .7 * s; CLY = .7 * s - .7 * c; }
function exitFacing() { ctx.restore(); CLX = -.7; CLY = -.7; }
// patch cel() to read the current light frame
const _cel = cel;
cel = function (x, y, r, c, o) { o = o || {}; if (o.lx === undefined) { o.lx = CLX; o.ly = CLY; } _cel(x, y, r, c, o); };

// ---------- UNIT DEFINITIONS ----------
const TYPES = {
  knight:   { team: 'hero', r: 16, name: 'Knight',   role: 'Tank · Sword · Charge' },
  archer:   { team: 'hero', r: 14, name: 'Archer',   role: 'Ranged · Barrage · Dodge' },
  rogue:    { team: 'hero', r: 13, name: 'Rogue',    role: 'Skirmish · Shadow Walk' },
  rat:      { team: 'foe',  r: 9,  name: 'Rat',      role: 'Swarm · Bite · Scurry' },
  slime:    { team: 'foe',  r: 20, name: 'Slime',    role: 'Slam · Splits in two' },
  skeleton: { team: 'foe',  r: 14, name: 'Skeleton', role: 'Cleaver · Bone Toss' },
};
let UID = 0;
function makeUnit(type, x, y, o = {}) {
  const T = TYPES[type];
  const face0 = o.face ?? (T.team === 'hero' ? Math.PI / 2 - .5 : Math.PI / 2 + .5);
  return {
    id: ++UID, type, team: T.team, r: o.r || T.r, sc: o.sc || 2.2, hx: x, hy: y, x, y, z: 0, vz: 0, walkZ: 0, hop: 0,
    face: face0, face0, aimDir: T.team === 'hero' ? 0 : Math.PI, alpha: 1,
    sq: 0, sqV: 0, sqA: 0, sp: 0, spV: 0, flash: 0, ph: Math.random() * TAU, blinkT: rand(1, 4), blink: 0,
    swing: 0, handF: 0, aim: 0, pull: 0, nocked: true, pokeL: 0, pokeR: 0, guard: 0, bite: 0, lean: 0,
    act: null, t: 0, phase: '', fired: {}, status: o.status || null, mini: !!o.mini, split: 0, dead: false,
    lastX: x, lastY: y, speed: 0, gen: o.gen || 0,
  };
}

// ---------- UNIT PIPELINE ----------
// drawUnit handles shadow, lift, squash, facing and flash; each type supplies back/body/top/front.
function drawUnit(e) {
  if (e.alpha <= .01) return;
  const D = DRAW[e.type], z = e.z + e.walkZ;
  ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.sc, e.sc);
  LW = 1.55 / Math.sqrt(e.sc);
  ctx.globalAlpha = e.alpha;
  groundShadow(0, 0, e.r, z);
  const lift = 1 + z * .012 + e.sp;
  ctx.translate(0, -z * .22); ctx.scale(lift, lift);
  if (D.back) { enterFacing(e); D.back(e); exitFacing(); }
  ctx.save();
  if (e.status !== 'frozen') {
    const w = Math.sin(performance.now() / 1000 * (e.type === 'slime' ? 4 : 2.6) + e.ph) * (e.type === 'slime' ? .05 : .025);
    ctx.rotate(e.sqA); ctx.scale(1 + e.sq, 1 / (1 + e.sq)); ctx.rotate(-e.sqA);
    ctx.scale(1 + w, 1 - w);
  }
  D.body(e);
  enterFacing(e); D.top(e); exitFacing();
  if (e.flash > 0) { circ(0, 0, e.r + .4); ctx.fillStyle = `rgba(255,255,255,${clamp(e.flash / .12, 0, 1)})`; ctx.fill(); }
  ctx.restore();
  if (D.front) { enterFacing(e); D.front(e); exitFacing(); }
  if (e.status) drawStatusOverlay(e);
  ctx.restore();
  ctx.globalAlpha = 1;
}
const blinking = e => e.blink > 0;
function eyeDot(x, y, rx, ry, c, sparkle) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fillStyle = c; ctx.fill();
  if (sparkle) { circ(x + CLX * rx * .45, y + CLY * ry * .45, Math.max(.35, rx * .38)); ctx.fillStyle = '#fff'; ctx.fill(); }
}
function closedEye(x, y, w) { ctx.beginPath(); ctx.moveTo(x, y - w); ctx.lineTo(x, y + w); ctx.lineWidth = LW * .9; ctx.strokeStyle = PAL.ink; ctx.lineCap = 'round'; ctx.stroke(); }

const DRAW = {
  // ---------------- KNIGHT: cobalt tabard, steel helm with visor slit, red crest ----------------
  knight: {
    body(e) { cel(0, 0, e.r, PAL.knight); },
    top(e) {
      const r = e.r;
      cel(-r * .05, -r * .74, r * .36, PAL.steel); cel(-r * .05, r * .74, r * .36, PAL.steel);   // pauldrons
      cel(-r * .06, 0, r * .66, PAL.steel);                                                     // helm
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(-r * .06, 0, r * .45, -.64, .64); ctx.lineWidth = r * .2; ctx.strokeStyle = '#2a2f48'; ctx.stroke();
      if (!blinking(e)) { ctx.fillStyle = '#fff3c2'; for (const s of [-1, 1]) { circ(-r * .06 + Math.cos(.3 * s) * r * .45, Math.sin(.3 * s) * r * .45, r * .065); ctx.fill(); } }
      // crest: flat base + hard shadow half + light strip
      const t = tones(PAL.plume), x0 = -r * 1.12, x1 = r * .3, hw = r * .17;
      ctx.beginPath(); ctx.moveTo(x1, 0); ctx.quadraticCurveTo(x1 - 3, -hw, -r * .3, -hw); ctx.quadraticCurveTo(x0 + 3, -hw * .9, x0, 0);
      ctx.quadraticCurveTo(x0 + 3, hw * .9, -r * .3, hw); ctx.quadraticCurveTo(x1 - 3, hw, x1, 0); ctx.closePath();
      ctx.fillStyle = t.base; ctx.fill();
      ctx.save(); ctx.clip(); ctx.fillStyle = t.sh; ctx.fillRect(x0, CLY < 0 ? hw * .15 : -hw * 1.2, x1 - x0, hw * 1.05);
      ctx.fillStyle = t.hi; ctx.fillRect(x0 + 4, CLY < 0 ? -hw * .7 : hw * .3, (x1 - x0) * .55, hw * .4); ctx.restore();
      ctx.lineWidth = LW; ctx.strokeStyle = t.ol; ctx.stroke();
      ctx.beginPath(); for (let i = 1; i < 4; i++) { const x = x0 + i * (x1 - x0) / 4.3; ctx.moveTo(x, -hw * .8); ctx.lineTo(x - 1.6, hw * .8); }
      ctx.lineWidth = LW * .6; ctx.stroke();
    },
    front(e) { drawKnightProps(e); },
  },
  // ---------------- ARCHER: leaf-green hood with point, round face, quiver ----------------
  archer: {
    back(e) {
      const r = e.r, t = tones(PAL.hood);
      ctx.beginPath(); ctx.moveTo(-r * .5, -r * .62); ctx.quadraticCurveTo(-r * 1.15, -r * .3, -r * 1.55, r * .12);
      ctx.quadraticCurveTo(-r * 1.05, r * .38, -r * .5, r * .62); ctx.closePath();
      fillStroke(t.base, t.ol);
      ctx.beginPath(); ctx.moveTo(-r * .7, r * .1); ctx.quadraticCurveTo(-r * 1.1, r * .3, -r * 1.55, r * .12); ctx.quadraticCurveTo(-r * 1.05, r * .38, -r * .6, r * .55); ctx.closePath();
      ctx.fillStyle = t.sh; ctx.fill();
    },
    body(e) { cel(0, 0, e.r, PAL.archer); },
    top(e) {
      const r = e.r, sk = tones(PAL.skin);
      ctx.beginPath(); ctx.ellipse(r * .44, 0, r * .4, r * .56, 0, 0, TAU); ctx.fillStyle = tones(PAL.hood).sh; ctx.fill();   // hood opening
      ctx.beginPath(); ctx.ellipse(r * .5, 0, r * .32, r * .46, 0, 0, TAU); ctx.fillStyle = sk.base; ctx.fill();
      ctx.save(); ctx.clip(); ctx.beginPath(); ctx.ellipse(r * .5 - CLX * r * .2, -CLY * r * .2, r * .32, r * .46, 0, 0, TAU);
      ctx.fillStyle = sk.sh; ctx.fill(); ctx.beginPath(); ctx.ellipse(r * .5, 0, r * .25, r * .4, 0, 0, TAU); ctx.fillStyle = sk.base; ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.ellipse(r * .5, 0, r * .32, r * .46, 0, 0, TAU); ctx.lineWidth = LW * .8; ctx.strokeStyle = sk.ol; ctx.stroke();
      ctx.fillStyle = PAL.cheek; for (const s of [-1, 1]) { circ(r * .5, s * r * .3, r * .075); ctx.fill(); }
      if (blinking(e)) { closedEye(r * .6, -r * .15, r * .07); closedEye(r * .6, r * .15, r * .07); }
      else { eyeDot(r * .6, -r * .15, r * .07, r * .1, PAL.ratEye, true); eyeDot(r * .6, r * .15, r * .07, r * .1, PAL.ratEye, true); }
      // quiver across the back
      ctx.save(); ctx.translate(-r * .42, r * .42); ctx.rotate(-.65);
      const q = tones(PAL.leather);
      ctx.fillStyle = PAL.fletch; for (const s of [-1.6, 0, 1.6]) { ctx.beginPath(); ctx.ellipse(-r * .62, s, r * .2, r * .09, s * .25, 0, TAU); ctx.fill(); }
      rrectPath(-r * .5, -r * .18, r * .95, r * .36, r * .18); fillStroke(q.base, q.ol, LW * .8);
      ctx.fillStyle = q.sh; ctx.fillRect(-r * .44, 0, r * .85, r * .14);
      ctx.fillStyle = PAL.gold; ctx.fillRect(r * .05, -r * .18, r * .1, r * .36);
      ctx.restore();
    },
    front(e) { drawBow(e); },
  },
  // ---------------- ROGUE: violet, mask band, trailing bandana tails, twin daggers ----------------
  rogue: {
    back(e) {
      const r = e.r, tt = performance.now() / 1000, amp = 1.4 + Math.min(4, e.speed * .05);
      ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        const w1 = Math.sin(tt * 7 + s) * amp, w2 = Math.sin(tt * 7 + s + 1.4) * amp * 1.3;
        ctx.beginPath(); ctx.moveTo(-r * .7, s * r * .12); ctx.quadraticCurveTo(-r * 1.3, s * r * .3 + w1, -r * 2.0, s * r * .5 + w2);
        ctx.lineWidth = r * .34; ctx.strokeStyle = tones(PAL.tail).ol; ctx.stroke();
        ctx.lineWidth = r * .22; ctx.strokeStyle = PAL.tail; ctx.stroke();
      }
    },
    body(e) { cel(0, 0, e.r, PAL.rogue); },
    top(e) {
      const r = e.r, m = tones(PAL.mask);
      ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.arc(0, 0, r * .6, -1.05, 1.05); ctx.lineWidth = r * .42; ctx.strokeStyle = m.ol; ctx.stroke();
      ctx.lineWidth = r * .32; ctx.strokeStyle = m.base; ctx.stroke();
      for (const s of [-1, 1]) {
        const a = .34 * s, x = Math.cos(a) * r * .6, y = Math.sin(a) * r * .6;
        if (blinking(e)) { ctx.beginPath(); ctx.moveTo(x - r * .04, y - s * r * .12); ctx.lineTo(x + r * .02, y + s * r * .02); ctx.lineWidth = LW; ctx.strokeStyle = '#fff'; ctx.stroke(); }
        else { ctx.beginPath(); ctx.ellipse(x, y, r * .09, r * .15, -s * .45, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); }
      }
      cel(-r * .84, 0, r * .24, PAL.mask);
    },
    front(e) { drawDaggers(e); },
  },
  // ---------------- RAT: dusty grey, pink ears & tail, beady eyes ----------------
  rat: {
    back(e) {
      const r = e.r, tt = performance.now() / 1000, w = Math.sin(tt * 6 + e.ph) * r * .35;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-r * .8, 0); ctx.quadraticCurveTo(-r * 1.6, w, -r * 2.5, -w * .6);
      ctx.lineWidth = r * .3; ctx.strokeStyle = tones(PAL.ratPink).ol; ctx.stroke();
      ctx.lineWidth = r * .18; ctx.strokeStyle = PAL.ratPink; ctx.stroke();
    },
    body(e) { cel(0, 0, e.r, PAL.rat); },
    top(e) {
      const r = e.r;
      for (const s of [-1, 1]) { cel(-r * .15, s * r * .68, r * .42, PAL.rat, { hl: false }); circ(-r * .12, s * r * .7, r * .24); ctx.fillStyle = PAL.ratPink; ctx.fill(); }
      const sn = tones(PAL.ratSnout);
      ctx.beginPath(); ctx.ellipse(r * .66, 0, r * .44, r * .38, 0, 0, TAU); fillStroke(sn.base, sn.ol, LW * .8);
      if (e.bite > .2) { ctx.fillStyle = '#fff'; ctx.fillRect(r * .98, -r * .2, r * .16, r * .14); ctx.fillRect(r * .98, r * .06, r * .16, r * .14); }
      circ(r * 1.06, 0, r * .16); ctx.fillStyle = '#ff7f93'; ctx.fill();
      ctx.beginPath(); for (const s of [-1, 1]) { ctx.moveTo(r * .86, s * r * .22); ctx.lineTo(r * 1.32, s * r * .58); ctx.moveTo(r * .84, s * r * .3); ctx.lineTo(r * 1.18, s * r * .78); }
      ctx.lineWidth = LW * .55; ctx.strokeStyle = 'rgba(255,240,230,.75)'; ctx.stroke();
      if (blinking(e)) { closedEye(r * .38, -r * .38, r * .1); closedEye(r * .38, r * .38, r * .1); }
      else for (const s of [-1, 1]) eyeDot(r * .38, s * r * .38, r * .13, r * .13, PAL.ratEye, true);
    },
  },
  // ---------------- SLIME: bubblegum jelly, big gloss, bubbles, simple face ----------------
  slime: {
    body(e) {
      const r = e.r, t = tones(PAL.slime);
      cel(0, 0, r, PAL.slime, { hl: false });
      ctx.save(); circ(0, 0, r); ctx.clip();
      ctx.beginPath(); ctx.ellipse(r * .22, r * .3, r * .46, r * .34, -.5, 0, TAU); ctx.fillStyle = PAL.slimeCore; ctx.globalAlpha *= .55; ctx.fill(); ctx.restore();
      ctx.fillStyle = t.hi;
      ctx.beginPath(); ctx.ellipse(-r * .4, -r * .44, r * .34, r * .17, -.75, 0, TAU); ctx.fill();
      circ(-r * .02, -r * .66, r * .07); ctx.fill();
      ctx.lineWidth = LW * .7; ctx.strokeStyle = t.hi;
      circ(r * .48, -r * .12, r * .1); ctx.stroke(); circ(r * .3, r * .58, r * .06); ctx.stroke();
    },
    top(e) {
      const r = e.r;
      if (blinking(e)) { closedEye(r * .3, -r * .3, r * .12); closedEye(r * .3, r * .3, r * .12); }
      else for (const s of [-1, 1]) eyeDot(r * .3, s * r * .3, r * .12, r * .17, PAL.slimeEye, true);
      ctx.beginPath(); ctx.arc(r * .38, 0, r * .16, -1.1, 1.1); ctx.lineWidth = LW; ctx.strokeStyle = PAL.slimeEye; ctx.lineCap = 'round'; ctx.stroke();
    },
  },
  // ---------------- SKELETON: chibi skull, ember eyes, rusty cleaver ----------------
  skeleton: {
    body(e) {
      const r = e.r; cel(0, 0, r, PAL.bone);
      ctx.beginPath(); ctx.moveTo(r * .1, -r * .95); ctx.lineTo(r * .02, -r * .62); ctx.lineTo(r * .22, -r * .45); ctx.lineTo(r * .12, -r * .22);
      ctx.moveTo(-r * .72, r * .4); ctx.lineTo(-r * .48, r * .32); ctx.lineTo(-r * .42, r * .5);
      ctx.lineWidth = LW * .7; ctx.strokeStyle = tones(PAL.bone).ol; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    },
    top(e) {
      const r = e.r, glow = .75 + Math.sin(performance.now() / 160 + e.ph) * .25;
