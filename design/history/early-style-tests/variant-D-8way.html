<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EDE6D8">
<title>D — 8-way turns</title>
<style>
  html,body{margin:0;height:100%;background:#EDE6D8;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas{position:fixed;left:0;top:0;display:block}
  .chip{font:800 11px/1 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;color:#2B2230;
    background:#FFFFFF;border:2px solid #2B2230;border-radius:999px;padding:5px 10px;box-shadow:0 2px 0 #2B2230;display:inline-block}
  #tag{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);pointer-events:none}
  #tog{position:fixed;right:calc(env(safe-area-inset-right,0px) + 2px);top:calc(env(safe-area-inset-top,0px) + 0px);height:44px;min-width:44px;
    padding:0 6px;border:0;background:none;cursor:pointer;display:flex;align-items:center}
  #tog .chip{padding:6px 11px}
  #tog.on .chip{background:#F2B53A}
  #tog:active .chip{transform:translateY(2px);box-shadow:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag" class="chip">D — 8-way turns</div>
<button id="tog" aria-label="Toggle facing demo"><span class="chip">&#9673; Facing demo</span></button>
<script>
'use strict';
/* =====================================================================
   VARIANT D — FRONT FACE + 8-WAY HEAD TURNS
   Each unit is a chibi head. Facing snaps to the nearest of 8 views
   (front, front-3/4, side, back-3/4, back). Views are NOT 8 drawings:
   every face part / prop has an azimuth on the head, and one projection
   (x = cos(F+a)*R, depth = sin(F+a)) places it for the snapped angle F.
   Back-facing parts hide; props sort in front of / behind the head.
   Rendering per PALETTE.md: flat fills, ink outline, one hard shadow shape.
   ===================================================================== */

// ---------- SHARED PALETTE (PALETTE.md) ----------
const PAL = {
  bg: '#EDE6D8', ink: '#2B2230', ground: 'rgba(43,34,48,0.18)',
  skin: '#F2C7A0', skinD: '#D99C75',
  wood: '#A0683A', woodD: '#7A4A26',
  steel: '#C9CED6', steelD: '#8F97A3',
  gold: '#F2B53A',
  archer: '#5FA35A', archerD: '#3E7A44', archerL: '#9AD17F',
  knight: '#4F7BC4', knightD: '#36589A', knightL: '#8DB0E8',
  rogue: '#8A5BB8', rogueD: '#5E3D86', rogueL: '#B994E0',
  rat: '#8E7A6B', ratD: '#6B5A4E', ratL: '#B3A091',
  slime: '#4CC2A8', slimeD: '#2F8F7B', slimeL: '#8BE3CF',
  bone: '#E8E0CC', boneD: '#B8AD93', boneL: '#FFF8E8', rust: '#9C5B3A',
  foeEye: '#E2483D', white: '#FFFFFF',
  burn: '#FF7A2F', ice: '#7FD6F5', poison: '#9BCB3C', shock: '#FFE14D',
};
// darker tone for parts that only have one colour in the palette
const DARK = { [PAL.gold]: '#C98A1E', [PAL.rust]: '#74401F', [PAL.white]: '#D8D2C6', [PAL.foeEye]: '#A82E26', [PAL.ink]: PAL.ink };
const FONT = 'ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const TAU = Math.PI * 2, W = 844, H = 390;
const OL = 2;   // outline width at 1x (unit space; scales with the unit)

// ---------- UTIL ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIn = t => Math.pow(clamp(t, 0, 1), 2);
const easeInOut = t => (t = clamp(t, 0, 1), t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const sgn = v => v < 0 ? -1 : 1;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

// ---------- CANVAS / DPR ----------
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let DPR = 1, VS = 1, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
  cvs.width = Math.round(w * DPR); cvs.height = Math.round(h * DPR);
  VS = Math.min(w / W, h / H); OX = (w - W * VS) / 2; OY = (h - H * VS) / 2;
}
window.addEventListener('resize', resize);

// ---------- FLAT PRIMITIVES ----------
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot || 0, 0, TAU); }
function poly(p) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); ctx.closePath(); }
function rrect(x, y, w, h, r) { r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ink(lw) { ctx.lineWidth = lw || OL; ctx.strokeStyle = PAL.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function fillInk(c, lw) { ctx.fillStyle = c; ctx.fill(); ink(lw); }
// Hard cel shadow inside the current path: path must be built by `build()`; light is top-left (world).
function celShape(build, base, dark, light, ox, oy, hl) {
  build(); ctx.fillStyle = dark; ctx.fill();
  ctx.save(); build(); ctx.clip();
  ctx.translate(-ox, -oy); build(); ctx.fillStyle = base; ctx.fill();
  ctx.restore();
  if (hl && light) { ctx.fillStyle = light; hl(); ctx.fill(); }
  build(); ink();
}
// The head / any ball: flat base, hard crescent shadow lower-right, small hard highlight top-left.
function ball(x, y, r, base, dark, light, lw) {
  circ(x, y, r); ctx.fillStyle = dark; ctx.fill();
  ctx.save(); circ(x, y, r); ctx.clip(); circ(x - r * .13, y - r * .15, r * .94); ctx.fillStyle = base; ctx.fill(); ctx.restore();
  if (light) { ell(x - r * .42, y - r * .46, r * .2, r * .12, -.75); ctx.fillStyle = light; ctx.fill(); }
  circ(x, y, r); ink(lw);
}

// ---------- 8-WAY VIEW PROJECTION ----------
// world facing f: 0 = screen-right, PI/2 = toward the viewer (front). Snap to 45 degrees.
const VIEW_NAMES = ['Side R', 'Front ¾ R', 'Front', 'Front ¾ L', 'Side L', 'Back ¾ L', 'Back', 'Back ¾ R'];
const viewIndex = f => ((Math.round(f / (Math.PI / 4)) % 8) + 8) % 8;
// A part at head azimuth a (0 = nose), horizontal radius rr, height y.
// Returns screen x, the depth (+1 = facing viewer) and a foreshortening width factor.
let F = Math.PI / 2, CF = 0, SF = 1;   // current snapped facing (set per unit)
function setView(f) { F = f; CF = Math.cos(f); SF = Math.sin(f); }
const PX = (a, rr) => Math.cos(F + a) * rr;
const PD = a => Math.sin(F + a);
const PW = a => .42 + .58 * Math.max(0, Math.sin(F + a));
// point on the head's top meridian: b = angle from straight-up toward the nose (+) / back (-)
function meridian(b, R) { const fw = Math.sin(b), up = Math.cos(b); return [fw * CF * R, -up * R + fw * SF * R * .22, fw * SF]; }

// ---------- FACE PARTS (shared by every head) ----------
// expr: 'idle' | 'blink' | 'attack' | 'hit' | 'dead'
function eyePair(R, o, expr) {
  for (const s of [-1, 1]) {
    const a = o.a * s, d = PD(a);
    if (d < (o.minD ?? .12)) continue;
    const x = PX(a, R * o.rr), y = R * o.y, k = .35 + .65 * d, rx = R * o.rx * k, ry = R * o.ry;
    const look = CF * R * .05;                      // pupils lean toward the facing side
    if (expr === 'dead') {                          // X eyes
      ctx.beginPath(); ctx.moveTo(x - rx * .8, y - ry * .6); ctx.lineTo(x + rx * .8, y + ry * .6); ctx.moveTo(x + rx * .8, y - ry * .6); ctx.lineTo(x - rx * .8, y + ry * .6); ink(OL * 1.3); if (o.onMask) { ctx.strokeStyle = PAL.white; ctx.lineWidth = OL * .9; ctx.stroke(); } continue;
    }
    if (expr === 'hit') {                           // > < squeeze
      const q = PX(0, R * o.rr) - x >= 0 ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(x - rx * .7 * q, y - ry * .55); ctx.lineTo(x + rx * .6 * q, y); ctx.lineTo(x - rx * .7 * q, y + ry * .55); ink(OL * 1.3); if (o.onMask) { ctx.strokeStyle = PAL.white; ctx.lineWidth = OL * .9; ctx.stroke(); } continue;
    }
    if (expr === 'blink') { ctx.beginPath(); ctx.moveTo(x - rx, y + ry * .15); ctx.quadraticCurveTo(x, y + ry * .55, x + rx, y + ry * .15); ink(OL * 1.2); if (o.onMask) { ctx.strokeStyle = PAL.white; ctx.lineWidth = OL * .9; ctx.stroke(); } continue; }
    const sq = expr === 'attack' ? .62 : 1;
    if (o.style === 'bead') {                       // rat: red beads
      ell(x, y, rx, ry * sq, 0); fillInk(PAL.foeEye, OL * .8);
      circ(x - rx * .3 + look * .5, y - ry * .35 * sq, Math.max(.6, rx * .32)); ctx.fillStyle = PAL.white; ctx.fill();
    } else if (o.style === 'socket') {              // skeleton: ink sockets, red ember dot
      ell(x, y, rx, ry, s * .15); ctx.fillStyle = PAL.ink; ctx.fill();
      circ(x + look, y + ry * .1, R * .085 * (expr === 'attack' ? 1.35 : 1)); ctx.fillStyle = PAL.foeEye; ctx.fill();
      circ(x + look - R * .03, y, R * .03); ctx.fillStyle = PAL.white; ctx.fill();
    } else {                                        // sclera + big pupil + highlights
      ell(x, y, rx, ry * sq, 0); fillInk(PAL.white, OL * .8);
      ctx.save(); ell(x, y, rx, ry * sq, 0); ctx.clip();
      const pr = Math.min(rx * .85, ry * .62), px = x + look + (o.cross ? -s * rx * .15 : 0);
      if (o.iris) { ell(px, y + ry * .1, pr * 1.05, pr * 1.2, 0); ctx.fillStyle = o.iris; ctx.fill(); }
      ell(px, y + ry * .12, pr * (o.iris ? .55 : .9), pr * (o.iris ? .7 : 1.05), 0); ctx.fillStyle = PAL.ink; ctx.fill();
      circ(px - pr * .35, y - ry * .22 * sq, pr * .36); ctx.fillStyle = PAL.white; ctx.fill();
      ctx.restore();
      ell(x, y, rx, ry * sq, 0); ink(OL * .8);
    }
    if (o.brow) {                                   // brows: inner end lower = determined / angry
      const by = y - ry * (expr === 'attack' ? .85 : 1.12) - R * .04, tilt = (o.brow + (expr === 'attack' ? .1 : 0)) * R;
      const inner = PX(0, R * o.rr) - x >= 0 ? 1 : -1;   // toward the nose
      ctx.beginPath(); ctx.moveTo(x - inner * rx * 1.0, by - tilt); ctx.lineTo(x + inner * rx * .9, by + tilt * .6); ink(OL * 1.5);
    }
  }
}
function mouth(R, o, expr) {
  const d = PD(0);
  if (d < (o.minD ?? -.1)) return;
  const x = PX(0, R * o.rr), y = R * o.y, k = .45 + .55 * Math.max(0, d), w = R * o.w * k;
  ctx.beginPath();
  if (expr === 'attack') {                          // gritted teeth
    rrect(x - w, y - R * .09, w * 2, R * .2, R * .07); fillInk(PAL.white, OL * .8);
    ctx.beginPath(); ctx.moveTo(x - w * .9, y + R * .01); ctx.lineTo(x + w * .9, y + R * .01);
    for (const t of [-.4, 0, .4]) { ctx.moveTo(x + w * t, y - R * .08); ctx.lineTo(x + w * t, y + R * .1); }
    ink(OL * .55); return;
  }
  if (expr === 'hit') { ell(x, y + R * .02, w * .45, R * .1, 0); fillInk(PAL.ink, OL * .6); return; }
  if (expr === 'dead') { ctx.moveTo(x - w, y); for (let i = 1; i <= 4; i++) ctx.lineTo(x - w + i * w / 2, y + (i % 2 ? -1 : 1) * R * .05); ink(OL * .9); return; }
  if (o.kind === 'smirk') { ctx.moveTo(x - w * .8, y); ctx.quadraticCurveTo(x + w * .1, y + R * .1, x + w * .9, y - R * .07); ink(OL * .95); return; }
  if (o.kind === 'grin') {                          // slime: wide grin + one fang
    ctx.moveTo(x - w, y - R * .03); ctx.quadraticCurveTo(x, y + R * .2, x + w, y - R * .03); ctx.closePath(); fillInk(PAL.ink, OL * .8);
    poly([x + w * .2, y + R * .02, x + w * .5, y + R * .03, x + w * .35, y + R * .14]); ctx.fillStyle = PAL.white; ctx.fill(); return;
  }
  if (o.kind === 'teeth') {                         // skeleton tooth row
    rrect(x - w, y - R * .08, w * 2, R * .17, R * .04); fillInk(PAL.boneL, OL * .8);
    ctx.beginPath(); for (let i = 1; i < 4; i++) { ctx.moveTo(x - w + i * w / 2, y - R * .08); ctx.lineTo(x - w + i * w / 2, y + R * .09); } ink(OL * .55); return;
  }
  ctx.moveTo(x - w, y - R * .02); ctx.quadraticCurveTo(x, y + R * .11, x + w, y - R * .02); ink(OL);   // determined smile
}
// skin face opening at azimuth 0, clipped to the head; returns its build fn so masks can clip to it
function faceWindow(R, y, rx, ry) {
  const d = PD(0); if (d < -.4) return null;
  const x = PX(0, R * .4), k = .56 + .44 * Math.max(0, d);
  const build = () => ell(x, R * y, R * rx * k, R * ry, 0);
  celShape(build, PAL.skin, PAL.skinD, null, -R * .1, -R * .12);
  return build;
}
function headBall(R, base, dark, light) { ball(0, 0, R, base, dark, light); }
const clipHead = R => { ctx.save(); circ(0, 0, R); ctx.clip(); };
const headLine = R => { circ(0, 0, R); ink(); };

// ---------- CHARACTERS ----------
// head(e, R, expr) draws the head for the current snapped view; props(e, R, L) pushes [depth, fn] layers.
const CHARS = {
  archer: {
    r: 15, name: 'Archer', role: 'Ranged · Barrage · Dodge', team: 'hero',
    head(e, R, ex) {
      // hood point: trails behind (toward -CF), always peeks above the crown
      const tipX = -CF * R * 1.1, tipY = -R * 1.3 + Math.abs(CF) * R * .14;
      const point = () => { ctx.beginPath(); ctx.moveTo(-R * .5 - CF * R * .15, -R * .72); ctx.quadraticCurveTo(tipX * .6 - R * .05, -R * 1.05, tipX, tipY); ctx.quadraticCurveTo(tipX * .4 + R * .3, -R * 1.0, R * .5 - CF * R * .15, -R * .72); ctx.closePath(); };
      if (SF > -.3) celShape(point, PAL.archer, PAL.archerD, null, -R * .08, -R * .1);
      headBall(R, PAL.archer, PAL.archerD, PAL.archerL);
      if (SF <= -.3) { const dx = -CF * R * .3; celShape(() => { ctx.beginPath(); ctx.moveTo(-R * .42 + dx * .3, -R * .82); ctx.quadraticCurveTo(-R * .4 + dx, R * .05, dx, R * .42); ctx.quadraticCurveTo(R * .4 + dx, R * .05, R * .42 + dx * .3, -R * .82); ctx.closePath(); }, PAL.archer, PAL.archerD, null, -R * .1, -R * .06); }
      clipHead(R);
      if (faceWindow(R, .16, .66, .58)) { eyePair(R, { a: .55, rr: .62, y: .1, rx: .17, ry: .22, brow: .05 }, ex); mouth(R, { rr: .6, y: .5, w: .13 }, ex); }
      ctx.restore(); headLine(R);
    },
    props(e, R, L) { propBow(e, R, L); },
  },
  knight: {
    r: 16, name: 'Knight', role: 'Tank · Shield · Charge', team: 'hero',
    head(e, R, ex) {
      // gold crest along the top meridian: a fin end-on, a long arc in profile.
      // Points facing away are drawn before the head so they tuck behind it.
      const pts = []; for (let i = 0; i <= 12; i++) pts.push(meridian(lerp(.5, -1.6, i / 12), R * 1.07));
      const crest = back => {
        ctx.beginPath(); let on = false;
        for (const p of pts) { const ok = back ? p[2] <= .02 : p[2] >= -.02; if (ok) { on ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); on = true; } }
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineWidth = R * .24 + OL * 2; ctx.strokeStyle = PAL.ink; ctx.stroke(); ctx.lineWidth = R * .24; ctx.strokeStyle = PAL.gold; ctx.stroke();
      };
      crest(true);
      headBall(R, PAL.knight, PAL.knightD, PAL.knightL);
      clipHead(R);
      const fw = faceWindow(R, .2, .6, .52);
      if (fw) {
        eyePair(R, { a: .55, rr: .6, y: .14, rx: .16, ry: .2, brow: .07 }, ex); mouth(R, { rr: .58, y: .54, w: .12 }, ex);
        fw(); ctx.lineWidth = R * .14 + OL * 2; ctx.strokeStyle = PAL.ink; ctx.stroke(); fw(); ctx.lineWidth = R * .14; ctx.strokeStyle = PAL.steel; ctx.stroke();
      }
      ctx.restore(); headLine(R);
      crest(false);
    },
    props(e, R, L) { propShield(e, R, L); propSword(e, R, L, PAL.steel, PAL.steelD, 1.35); },
  },
  rogue: {
    r: 14, name: 'Rogue', role: 'Darts in · Shadow Walk', team: 'hero',
    head(e, R, ex) {
      headBall(R, PAL.rogue, PAL.rogueD, PAL.rogueL);
      clipHead(R);
      const fw = faceWindow(R, .2, .62, .52);
      if (fw) {
        ctx.save(); fw(); ctx.clip(); ctx.fillStyle = PAL.ink; ctx.fillRect(-R * 1.1, -R * .12, R * 2.2, R * .42); ctx.restore();   // bandit mask
        eyePair(R, { a: .55, rr: .62, y: .1, rx: .15, ry: .15, brow: .0, minD: .15, onMask: 1 }, ex);
        mouth(R, { rr: .6, y: .52, w: .14, kind: 'smirk' }, ex);
      }
      ctx.restore(); headLine(R);
    },
    props(e, R, L) { propTails(e, R, L); propDaggers(e, R, L); },
  },
  rat: {
    r: 11, name: 'Rat', role: 'Swarm · Bite · Scurry', team: 'foe',
    head(e, R, ex) {
      for (const s of [-1, 1]) {   // ears sit behind the crown
        const a = 1.2 * s, x = PX(a, R * .62);
        ball(x, -R * .78, R * .44, PAL.rat, PAL.ratD, null);
        if (SF > .2) { ell(x + CF * R * .03, -R * .76, R * .25 * (.4 + .6 * SF), R * .25, 0); ctx.fillStyle = PAL.ratL; ctx.fill(); }
      }
      headBall(R, PAL.rat, PAL.ratD, PAL.ratL);
      clipHead(R); eyePair(R, { a: .6, rr: .6, y: -.16, rx: .17, ry: .19, brow: .09, style: 'bead' }, ex); ctx.restore(); headLine(R);
      const d = PD(0);
      if (d > -.45) {              // snout is a real bump: sticks out of the silhouette in profile
        const x = PX(0, R * .74), y = R * .4;
        ball(x, y, R * .32, PAL.ratL, PAL.rat, null);
        const nx = PX(0, R * 1.04), ny = R * .3;
        ell(nx, ny, R * .14, R * .11, 0); ctx.fillStyle = PAL.ink; ctx.fill();
        rrect(PX(0, R * .98) - R * .1, R * .48, R * .2, R * .2, R * .04); fillInk(PAL.white, OL * .7);
        ctx.beginPath(); ctx.moveTo(PX(0, R * .98), R * .48); ctx.lineTo(PX(0, R * .98), R * .68); ink(OL * .5);
        ctx.beginPath(); for (const s of [-1, 1]) { const wx = x + s * R * .3 + CF * R * .15; ctx.moveTo(wx, y - R * .02); ctx.lineTo(wx + s * R * .5, y - R * .12); ctx.moveTo(wx, y + R * .06); ctx.lineTo(wx + s * R * .48, y + R * .14); } ink(OL * .55);
        if (ex === 'attack') { ell(x + CF * R * .2, y + R * .28, R * .16, R * .08, 0); ctx.fillStyle = PAL.ink; ctx.fill(); }
      }
    },
    props(e, R, L) { propRatTail(e, R, L); },
  },
  slime: {
    r: 18, name: 'Slime', role: 'Slam · Splits on death', team: 'foe',
    head(e, R, ex) {
      // jelly body: flat-bottomed blob
      const blob = () => { ctx.beginPath(); ctx.moveTo(-R, R * .25); ctx.bezierCurveTo(-R * 1.02, -R * .7, -R * .55, -R * 1.02, 0, -R * 1.0); ctx.bezierCurveTo(R * .55, -R * 1.02, R * 1.02, -R * .7, R, R * .25); ctx.bezierCurveTo(R * 1.0, R * .85, -R * 1.0, R * .85, -R, R * .25); ctx.closePath(); };
      celShape(blob, PAL.slime, PAL.slimeD, PAL.slimeL, -R * .12, -R * .14, () => ell(-R * .45, -R * .5, R * .2, R * .12, -.75));
      // curl on top bends toward the back: a quick read of facing even from behind
      const tx = -CF * R * .42;
      const curl = () => { ctx.beginPath(); ctx.moveTo(-R * .22, -R * .9); ctx.quadraticCurveTo(-R * .1 + tx * .3, -R * 1.35, tx, -R * 1.32); ctx.quadraticCurveTo(tx * .5 + R * .15, -R * 1.18, R * .22, -R * .9); ctx.closePath(); };
      celShape(curl, PAL.slime, PAL.slimeD, null, -R * .06, -R * .08);
      ctx.save(); blob(); ctx.clip();
      eyePair(R, { a: .55, rr: .6, y: .0, rx: .19, ry: .23, brow: .08, iris: PAL.foeEye }, ex);
      mouth(R, { rr: .58, y: .42, w: .22, kind: 'grin' }, ex);
      ctx.restore(); blob(); ink();
    },
    props() {},
  },
  skeleton: {

  DEMO.x = 422 + Math.cos(DEMO.phi) * 392; DEMO.y = 196 + Math.sin(DEMO.phi) * 172;
  for (const u of UNITS) updateUnit(u, dt);
  for (let i = LATER.length - 1; i >= 0; i--) { const l = LATER[i]; l.t -= dt; if (l.t <= 0) { dmgNum(l.x, l.y, l.n); LATER.splice(i, 1); } }
  updateFx(dt); updateParts(dt);
  SHAKE = Math.max(0, SHAKE - dt);
}

// ---------- RENDER ----------
function text(s, x, y, size, color, align, weight) { ctx.font = `${weight || 800} ${size}px ${FONT}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color || PAL.ink; ctx.fillText(s, x, y); }
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, cvs.width, cvs.height);
  const sh = SHAKE > 0 ? SHAKE * 14 : 0;
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, (OX + rand(-sh, sh) * VS) * DPR, (OY + rand(-sh, sh) * VS) * DPR);
  // row captions + divider for the in-game-size strip
  text('HEROES', 34, 96, 11, 'rgba(43,34,48,.45)', 'left', 900);
  text('ENEMIES', 34, 236, 11, 'rgba(43,34,48,.45)', 'left', 900);
  text('IN-GAME', 34, 338, 10, 'rgba(43,34,48,.45)', 'left', 900); text('~40px', 34, 351, 10, 'rgba(43,34,48,.45)', 'left', 900);
  ctx.beginPath(); ctx.moveTo(120, 314); ctx.lineTo(724, 314); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(43,34,48,.15)'; ctx.setLineDash([4, 5]); ctx.stroke(); ctx.setLineDash([]);
  drawFx('under');
  const order = UNITS.slice().sort((a, b) => a.y - b.y);
  for (const u of order) drawUnit(u);
  drawParts(); drawFx('top');
  for (const u of UNITS) if (u.label) {
    const y = u.hy + u.r * u.sc + 17;
    text(u.C.name, u.hx, y, 13, PAL.ink, 'center', 900);
    text(DEMO.on ? 'View: ' + VIEW_NAMES[u.vi] : u.C.role, u.hx, y + 13, 10, DEMO.on ? PAL.ink : 'rgba(43,34,48,.6)', 'center', 700);
  }
  if (!DEMO.on) text('Tap a unit to play: move · attack · ability · hit · death', 422, 375, 10, 'rgba(43,34,48,.5)', 'center', 700);
  if (DEMO.on) { circ(DEMO.x, DEMO.y, 7); fillInk(PAL.gold, 2.5); circ(DEMO.x, DEMO.y, 2.4); ctx.fillStyle = PAL.ink; ctx.fill(); }
}

// ---------- LOOP ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);
window.__units = UNITS; window.__demo = DEMO; window.__start = startAction;
</script>
</body>
</html>
