<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EDE6D8">
<title>B — Faces where it's going</title>
<style>
  html,body{margin:0;height:100%;background:#EDE6D8;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;cursor:pointer}
  .hud{position:fixed;font:700 11px/1 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color:#2B2230;z-index:2}
  #label{left:calc(env(safe-area-inset-left) + 10px);bottom:calc(env(safe-area-inset-bottom) + 9px);pointer-events:none}
  #hint{right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + 9px);pointer-events:none;font-weight:600;opacity:.6}
  #facing{right:calc(env(safe-area-inset-right) + 2px);top:calc(env(safe-area-inset-top) + 2px);padding:8px;background:none;border:0;cursor:pointer;touch-action:manipulation}
  #facing span{display:block;padding:6px 11px;border-radius:99px;border:2px solid #2B2230;background:#EDE6D8;color:#2B2230}
  #facing[aria-pressed="true"] span{background:#F2B53A}
  #facing:focus-visible span{outline:2px solid #2B2230;outline-offset:2px}
  #fps{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 9px);display:none;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label" class="hud">B — Faces where it's going</div>
<div id="hint" class="hud">Tap a unit to play its moves</div>
<button id="facing" class="hud" aria-pressed="false"><span>Facing demo</span></button>
<div id="fps" class="hud"></div>
<script>
'use strict';
/* =====================================================================
   VARIANT B — FACE POINTS WHERE IT'S GOING
   True top-down chibi heads. Everything that belongs to the head (face,
   hood, ears, props) is drawn in a local frame where +x = facing, and the
   frame rotates a full 360°. Lighting does NOT rotate: the hard shadow
   crescent (lower-right) and the highlight fleck (upper-left) are clip
   regions fixed in screen space, and each head is re-painted inside them
   with its "dark" / "light" tones. Flat fills, ink outlines, no gradients.
   ===================================================================== */

// ------------------------------------------------------------- palette (PALETTE.md)
const INK = '#2B2230', BG = '#EDE6D8', WHITE = '#FFFFFF', EYE_RED = '#E2483D', GROUND = 'rgba(43,34,48,0.18)';
// material = [base, dark, light]; index 3 is the hit-flash pass
const M = {
  skin: ['#F2C7A0', '#D99C75', '#F2C7A0'],
  wood: ['#A0683A', '#7A4A26', '#A0683A'],
  steel: ['#C9CED6', '#8F97A3', '#C9CED6'],
  gold: ['#F2B53A', '#F2B53A', '#F2B53A'],
  archer: ['#5FA35A', '#3E7A44', '#9AD17F'], archerL: ['#9AD17F', '#5FA35A', '#9AD17F'],
  knight: ['#4F7BC4', '#36589A', '#8DB0E8'],
  rogue: ['#8A5BB8', '#5E3D86', '#B994E0'], rogueD: ['#5E3D86', '#5E3D86', '#8A5BB8'],
  rat: ['#8E7A6B', '#6B5A4E', '#B3A091'], ratL: ['#B3A091', '#8E7A6B', '#B3A091'],
  slime: ['#4CC2A8', '#2F8F7B', '#8BE3CF'], slimeL: ['#8BE3CF', '#4CC2A8', '#8BE3CF'],
  bone: ['#E8E0CC', '#B8AD93', '#FFF8E8'],
  rust: ['#9C5B3A', '#7A4A26', '#9C5B3A']
};
const col = (mat, m) => m === 3 ? WHITE : M[mat][m];
const FX = { burn: '#FF7A2F', ice: '#7FD6F5', poison: '#9BCB3C', shock: '#FFE14D' };

// ------------------------------------------------------------- utils
const TAU = Math.PI * 2, HALF_PI = Math.PI / 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function turnTo(e, target, rate, dt) { e.facing += angDiff(e.facing, target) * Math.min(1, rate * dt); }
const FONT = 'ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif';

// ------------------------------------------------------------- canvas
const WORLD_W = 844, WORLD_H = 390;
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
let DPR = 1, W = 0, H = 0, SCALE = 1, OX = 0, OY = 0;
let OUT = 2; // outline width in the current local units

// ------------------------------------------------------------- stroke helpers
function ink(g, w = 1) { g.lineWidth = OUT * w; g.strokeStyle = INK; g.stroke(); }
function circ(g, x, y, r) { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }
function ell(g, x, y, rx, ry, rot = 0) { g.moveTo(x + Math.cos(rot) * rx, y + Math.sin(rot) * rx); g.ellipse(x, y, rx, ry, rot, 0, TAU); }

// =====================================================================
// HEAD DESIGNS
// Each design: r (in-game radius, ~40px diameter), shapes[] (filled + inked, shaded
// by the fixed light), under() (unshaded bits behind the head), face config, props().
// Shapes use local space: origin = head centre, +x = facing direction.
// =====================================================================
const SH = (p, mat, extra = {}) => Object.assign({ p, mat }, extra);
const clipHead = (g, r) => circ(g, 0, 0, r);

const DESIGN = {
  // ---------------------------------------------------------------- ARCHER
  archer: {
    r: 19, name: 'Archer', desc: 'Ranged, strafes, may dodge', ability: 'Arrow barrage', side: 'hero',
    shapes: [
      // hood with a droopy point at the back
      SH((g, r) => { g.arc(0, 0, r, -2.25, 2.25); g.quadraticCurveTo(-1.08 * r, 0.72 * r, -1.5 * r, 0.12 * r); g.quadraticCurveTo(-1.05 * r, -0.42 * r, Math.cos(-2.25) * r, Math.sin(-2.25) * r); g.closePath(); }, 'archer', { w: 1.2 }),
      // face opening
      SH((g, r) => circ(g, 0.5 * r, 0, 0.6 * r), 'skin', { clip: clipHead })
    ],
    face: { ex: 0.47, ey: 0.27, erx: 0.15, ery: 0.12, mx: 0.8, iris: INK, brows: true, mouth: 'smile', cheeks: true },
    props: drawArcherProps
  },
  // ---------------------------------------------------------------- KNIGHT
  knight: {
    r: 21, name: 'Knight', desc: 'Tough, shield and sword', ability: 'Charge', side: 'hero',
    shapes: [
      SH((g, r) => circ(g, 0, 0, r), 'knight', { w: 1.2 }),
      // face opening — a squared-off visor window
      SH((g, r) => { g.roundRect(0.18 * r, -0.5 * r, 1.2 * r, 1.0 * r, 0.32 * r); }, 'skin', { clip: clipHead }),
      // crest running front-to-back over the crown
      SH((g, r) => { g.moveTo(0.02 * r, 0); g.quadraticCurveTo(-0.5 * r, -0.36 * r, -1.36 * r, 0); g.quadraticCurveTo(-0.5 * r, 0.36 * r, 0.02 * r, 0); g.closePath(); }, 'gold')
    ],
    face: { ex: 0.48, ey: 0.25, erx: 0.15, ery: 0.12, mx: 0.8, iris: INK, brows: true, mouth: 'flat' },
    props: drawKnightProps
  },
  // ---------------------------------------------------------------- ROGUE
  rogue: {
    r: 18, name: 'Rogue', desc: 'Nimble, darts in and out', ability: 'Shadow step', side: 'hero',
    under: drawRogueScarf,
    shapes: [
      SH((g, r) => circ(g, 0, 0, r), 'rogue', { w: 1.2 }),
      // knot at the back
      SH((g, r) => circ(g, -0.95 * r, 0, 0.24 * r), 'rogueD'),
      SH((g, r) => circ(g, 0.56 * r, 0, 0.52 * r), 'skin', { clip: clipHead }),
      // mask over the lower face (the edge nearest the facing direction)
      SH((g, r) => { g.rect(0.68 * r, -r, r, 2 * r); }, 'rogueD', { clip: (g, r) => { circ(g, 0, 0, r); } , clip2: (g, r) => circ(g, 0.56 * r, 0, 0.52 * r) })
    ],
    face: { ex: 0.44, ey: 0.25, erx: 0.13, ery: 0.12, mx: 0.85, iris: INK, brows: true, browTilt: 1.3, mouth: 'none' },
    props: drawRogueProps
  },
  // ---------------------------------------------------------------- RAT
  rat: {
    r: 14, name: 'Rat', desc: 'Small, quick, comes in packs', ability: 'Frenzy', side: 'foe',
    under: drawRatTail,
    shapes: [
      SH((g, r) => { circ(g, -0.18 * r, -0.86 * r, 0.5 * r); circ(g, -0.18 * r, 0.86 * r, 0.5 * r); }, 'rat'),
      SH((g, r) => { circ(g, -0.1 * r, -0.95 * r, 0.27 * r); circ(g, -0.1 * r, 0.95 * r, 0.27 * r); }, 'ratL', { noInk: true }),
      SH((g, r) => circ(g, 0, 0, r), 'rat', { w: 1.2 }),
      // muzzle
      SH((g, r) => { g.moveTo(0.3 * r, -0.66 * r); g.quadraticCurveTo(1.3 * r, -0.52 * r, 1.48 * r, 0); g.quadraticCurveTo(1.3 * r, 0.52 * r, 0.3 * r, 0.66 * r); g.arc(0, 0, 0.73 * r, 1.15, -1.15, true); g.closePath(); }, 'ratL', { w: 1.1 })
    ],
    face: { ex: 0.36, ey: 0.36, erx: 0.15, ery: 0.13, mx: 1.22, iris: EYE_RED, brows: true, browTilt: 1.2, mouth: 'rat' },
    props: drawRatExtras
  },
  // ---------------------------------------------------------------- SLIME
  slime: {
    r: 20, name: 'Slime', desc: 'Squishy, splits when popped', ability: 'Big splat', side: 'foe',
    shapes: [
      SH((g, r, e) => slimePath(g, r, e.anim), 'slime', { w: 1.2 }),
      SH((g, r, e) => { const t = e.anim; circ(g, -0.38 * r + Math.sin(t * 1.3) * 0.05 * r, -0.3 * r, 0.13 * r); circ(g, -0.5 * r, 0.28 * r + Math.cos(t * 1.1) * 0.05 * r, 0.09 * r); }, 'slimeL', { noInk: true })
    ],
    face: { ex: 0.4, ey: 0.3, erx: 0.16, ery: 0.14, mx: 0.76, iris: EYE_RED, brows: false, mouth: 'open' }
  },
  // ---------------------------------------------------------------- SKELETON
  skeleton: {
    r: 19, name: 'Skeleton', desc: 'Bony brute, rusty blade', ability: 'Spin slash', side: 'foe',
    shapes: [
      // jaw (drawn first so the skull covers its inner edge)
      SH((g, r) => { g.roundRect(0.3 * r, -0.4 * r, 0.8 * r, 0.8 * r, 0.34 * r); }, 'bone', { w: 1.2 }),
      SH((g, r) => circ(g, 0, 0, r), 'bone', { w: 1.2 })
    ],
    face: { ex: 0.34, ey: 0.32, erx: 0.2, ery: 0.17, mx: 0.85, iris: EYE_RED, socket: true, brows: false, mouth: 'teeth' },
    props: drawSkeletonProps
  }
};
const ORDER = ['archer', 'knight', 'rogue', 'rat', 'slime', 'skeleton'];

function slimePath(g, r, t) {
  const N = 30;
  for (let i = 0; i <= N; i++) {
    const th = i / N * TAU, back = Math.pow(Math.max(0, -Math.cos(th)), 10);
    const rr = r * (1 + 0.035 * Math.sin(3 * th + t * 3) + 0.025 * Math.sin(5 * th - t * 2.2) + 0.3 * back);
    const x = Math.cos(th) * rr, y = Math.sin(th) * rr + back * Math.sin(t * 2.4) * 0.12 * r;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
}

// ------------------------------------------------------------- shape passes
function shapePass(g, e, D, m, stroke) {
  const r = D.r;
  for (const sh of D.shapes) {
    if (stroke && sh.noInk) continue;
    const clipped = !!sh.clip;
    if (clipped) { g.save(); g.beginPath(); sh.clip(g, r, e); g.clip(); if (sh.clip2) { g.beginPath(); sh.clip2(g, r, e); g.clip(); } }
    g.beginPath(); sh.p(g, r, e);
    if (stroke) ink(g, sh.w || 1); else { g.fillStyle = col(sh.mat, m); g.fill(); }
    if (clipped) g.restore();
  }
}

// =====================================================================
// FACE — sits toward the +x edge; light-fixed eye highlights
// =====================================================================
function drawFace(g, e, D) {
  const f = D.face, r = D.r, ex = f.ex * r, ey = f.ey * r, rx = f.erx * r, ry = f.ery * r, x = e.expr;
  // highlight direction: screen up-left, expressed in the rotated frame
  const c = Math.cos(-e.facing), s = Math.sin(-e.facing), hx = c * -0.55 - s * -0.6, hy = s * -0.55 + c * -0.6;
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let side = -1; side <= 1; side += 2) {
    const cx = ex, cy = side * ey;
    if (x === 'dead') {
      g.beginPath(); const k = Math.max(rx, ry) * 0.9;
      g.moveTo(cx - k, cy - k); g.lineTo(cx + k, cy + k); g.moveTo(cx + k, cy - k); g.lineTo(cx - k, cy + k); ink(g, 1.4);
      continue;
    }
    if (x === 'hit') { // >< wince: chevron points at the nose line
      g.beginPath(); g.moveTo(cx - rx * 1.1, cy + side * ry * 0.8); g.lineTo(cx, cy - side * ry * 0.7); g.lineTo(cx + rx * 1.1, cy + side * ry * 0.8); ink(g, 1.4);
      continue;
    }
    if (e.blink > 0 && x === 'idle') { // closed: gentle arc across the eye's width
      g.beginPath(); g.moveTo(cx, cy - ry); g.quadraticCurveTo(cx + rx * 0.9, cy, cx, cy + ry); ink(g, 1.3);
      continue;
    }
    const nrx = x === 'attack' ? rx * 0.62 : rx; // narrowed when attacking
    if (f.socket) { // skeleton: dark socket + red ember pupil
      g.beginPath(); ell(g, cx, cy, nrx, ry); g.fillStyle = INK; g.fill();
      g.beginPath(); circ(g, cx + 0.15 * rx, cy, Math.min(nrx, ry) * 0.42); g.fillStyle = EYE_RED; g.fill();
      g.beginPath(); circ(g, cx + 0.15 * rx + hx * rx * 0.2, cy + hy * ry * 0.2, Math.min(nrx, ry) * 0.15); g.fillStyle = WHITE; g.fill();
      continue;
    }
    g.beginPath(); ell(g, cx, cy, nrx, ry);
    g.fillStyle = f.iris; g.fill();
    if (f.iris !== INK) ink(g, 0.9);
    // two hard highlights
    g.beginPath(); circ(g, cx + hx * nrx * 0.42, cy + hy * ry * 0.42, Math.min(nrx, ry) * 0.36); circ(g, cx - hx * nrx * 0.45, cy - hy * ry * 0.45, Math.min(nrx, ry) * 0.16);
    g.fillStyle = WHITE; g.fill();
  }
  // brows — "above" the eyes means toward the crown (−x)
  if (f.brows && x !== 'dead') {
    const tilt = f.browTilt || 1, mad = x === 'attack' ? 1.4 : x === 'hit' ? -0.6 : 1;
    g.beginPath();
    for (let side = -1; side <= 1; side += 2) {
      const cy = side * ey, bx = ex - rx * 1.55;
      g.moveTo(bx - rx * 0.25 * mad * tilt, cy + side * ry * 1.0); g.lineTo(bx + rx * 0.35 * mad * tilt, cy - side * ry * 0.55);
    }
    ink(g, 1.25);
  }
  // cheeks
  if (f.cheeks && x === 'idle') { g.beginPath(); ell(g, ex + rx * 1.3, ey * 1.75, rx * 0.5, ry * 0.45); ell(g, ex + rx * 1.3, -ey * 1.75, rx * 0.5, ry * 0.45); g.fillStyle = M.skin[1]; g.fill(); }
  // mouth
  const mx = f.mx * r, w = 0.15 * r;
  g.beginPath();
  switch (f.mouth === 'none' ? 'none' : x === 'dead' ? 'o' : x === 'hit' ? 'wavy' : x === 'attack' ? 'grit' : f.mouth) {
    case 'smile': g.moveTo(mx - w * 0.3, -w); g.quadraticCurveTo(mx + w * 0.75, 0, mx - w * 0.3, w); ink(g, 1.2); break;
    case 'flat': g.moveTo(mx, -w * 0.8); g.quadraticCurveTo(mx + w * 0.3, 0, mx, w * 0.8); ink(g, 1.25); break;
    case 'open': g.moveTo(mx - w * 0.2, -w * 1.1); g.quadraticCurveTo(mx + w * 1.4, 0, mx - w * 0.2, w * 1.1); g.closePath(); g.fillStyle = INK; g.fill(); break;
    case 'grit':
      g.roundRect(mx - w * 0.45, -w * 1.1, w * 0.9, w * 2.2, w * 0.3); g.fillStyle = WHITE; g.fill(); ink(g, 1.1);
      g.beginPath(); g.moveTo(mx, -w * 1.1); g.lineTo(mx, w * 1.1); g.moveTo(mx - w * 0.45, -w * 0.35); g.lineTo(mx + w * 0.45, -w * 0.35); g.moveTo(mx - w * 0.45, w * 0.35); g.lineTo(mx + w * 0.45, w * 0.35); ink(g, 0.7); break;
    case 'wavy': g.moveTo(mx, -w); g.quadraticCurveTo(mx - w * 0.4, -w * 0.5, mx, 0); g.quadraticCurveTo(mx + w * 0.4, w * 0.5, mx, w); ink(g, 1.1); break;
    case 'o': circ(g, mx, 0, w * 0.4); ink(g, 1.1); break;
    case 'rat': // nose + little buck teeth
      break;
    case 'teeth': break;
  }
  if (D === DESIGN.rat) drawRatNose(g, e, r);
  if (D === DESIGN.skeleton) drawSkullDetails(g, e, r);
}
function drawRatNose(g, e, r) {
  const t = e.anim, wig = Math.sin(t * 9) * 0.03 * r;
  // whiskers
  g.beginPath();
  for (let sd = -1; sd <= 1; sd += 2) { g.moveTo(1.05 * r, sd * 0.3 * r); g.lineTo(1.2 * r + wig, sd * 0.9 * r); g.moveTo(1.0 * r, sd * 0.3 * r); g.lineTo(0.85 * r - wig, sd * 0.95 * r); }
  ink(g, 0.8);
  // teeth (bared when biting / attacking)
  if (e.expr === 'attack' || e.bite > 0.2) { g.beginPath(); g.rect(1.12 * r, -0.17 * r, 0.24 * r, 0.16 * r); g.rect(1.12 * r, 0.01 * r, 0.24 * r, 0.16 * r); g.fillStyle = WHITE; g.fill(); ink(g, 0.8); }
  g.beginPath(); ell(g, 1.45 * r + e.bite * 0.1 * r, 0, 0.13 * r, 0.17 * r); g.fillStyle = INK; g.fill();
}
function drawSkullDetails(g, e, r) {
  // nose hole
  g.beginPath(); g.moveTo(0.58 * r, 0); g.lineTo(0.74 * r, -0.09 * r); g.lineTo(0.74 * r, 0.09 * r); g.closePath(); g.fillStyle = INK; g.fill();
  // teeth row
  const open = e.expr === 'attack' ? 0.08 * r : 0;
  g.beginPath(); g.moveTo(0.9 * r + open, -0.34 * r); g.lineTo(0.9 * r + open, 0.34 * r);
  for (let k = -1; k <= 1; k++) { g.moveTo(0.8 * r + open, k * 0.17 * r); g.lineTo(1.0 * r + open, k * 0.17 * r); }
  ink(g, 0.9);
  // crack across the crown
  g.beginPath(); g.moveTo(-0.95 * r, -0.2 * r); g.lineTo(-0.62 * r, -0.05 * r); g.lineTo(-0.5 * r, -0.28 * r); g.lineTo(-0.3 * r, -0.2 * r); ink(g, 0.8);
}

// =====================================================================
// PROPS — rotate with the head; each blade carries its own hard shadow half
// =====================================================================
/** Blade along +x of the current frame; `worldAng` = this frame's world angle, used to put the dark half away from the light. */
function blade(g, x0, x1, w, mat, worldAng, tipLen = w) {
  const nx = Math.cos(worldAng + HALF_PI), ny = Math.sin(worldAng + HALF_PI), darkSide = nx + ny > 0 ? 1 : -1;
  g.beginPath(); g.moveTo(x0, -w / 2); g.lineTo(x1 - tipLen, -w / 2); g.lineTo(x1, 0); g.lineTo(x1 - tipLen, w / 2); g.lineTo(x0, w / 2); g.closePath();
  g.fillStyle = col(mat, 0); g.fill();
  g.beginPath(); g.moveTo(x0, 0); g.lineTo(x1, 0); g.lineTo(x1 - tipLen, darkSide * w / 2); g.lineTo(x0, darkSide * w / 2); g.closePath();
  g.fillStyle = col(mat, 1); g.fill();
  g.beginPath(); g.moveTo(x0, -w / 2); g.lineTo(x1 - tipLen, -w / 2); g.lineTo(x1, 0); g.lineTo(x1 - tipLen, w / 2); g.lineTo(x0, w / 2); g.closePath(); ink(g, 1);
}
function hand(g, x, y, r, mat = 'skin') { g.beginPath(); circ(g, x, y, r); g.fillStyle = col(mat, 0); g.fill(); ink(g, 0.9); }
function bar(g, x0, y0, x1, y1, w, color) { // chunky outlined stroke (bows, grips, guards)
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.lineCap = 'round';
  g.strokeStyle = INK; g.lineWidth = w + OUT * 2; g.stroke(); g.strokeStyle = color; g.lineWidth = w; g.stroke();
}
function drawArcherProps(g, e) {
  const r = DESIGN.archer.r, pull = e.pull, hx = 0.62 * r, hy = -1.08 * r;
  const barr = e.state === 'barrage';
  // bow ")" held at the left hand, string pulled toward the head
  const t1x = hx - 0.42 * r, t1y = hy - 0.62 * r, t2x = hx - 0.42 * r, t2y = hy + 0.62 * r, sx = t1x - pull * 0.5 * r;
  g.beginPath(); g.moveTo(t1x, t1y); g.lineTo(sx, hy); g.lineTo(t2x, t2y); g.strokeStyle = INK; g.lineWidth = OUT * 0.8; g.stroke();
  if (pull > 0.05) { // nocked arrow
    bar(g, sx, hy, hx + 0.55 * r, hy, 0.09 * r, M.wood[0]);
    g.beginPath(); g.moveTo(hx + 0.55 * r, hy - 0.16 * r); g.lineTo(hx + 0.85 * r, hy); g.lineTo(hx + 0.55 * r, hy + 0.16 * r); g.closePath();
    g.fillStyle = barr ? FX.shock : M.steel[0]; g.fill(); ink(g, 0.9);
  }

      } else if (e.type === 'rogue') {

        const l = Math.sin(clamp((t - 0.15) / 0.8, 0, 1) * Math.PI) * 10; e.ox = fx * l; e.oy = fy * l;
      } else if (e.type === 'rat') {
        for (const T of [0.2, 0.45, 0.7]) if (X(T)) { e.bite = 1; const [px, py] = front(1.85); star(px, py, R * 0.38); }
        const l = e.bite * 9; e.ox = fx * l; e.oy = fy * l;
      } else if (e.type === 'slime') {
        const k = t < 0.45 ? easeOut(t / 0.45) : 1 - easeInOut(clamp((t - 0.6) / 0.7, 0, 1));
        e.ox = fx * k * 22; e.oy = fy * k * 22; e.lift = t < 0.45 ? Math.sin(t / 0.45 * Math.PI) * 0.25 : 0;
        if (X(0.45)) { const [px, py] = front(1); ringFx(px, py, R * 0.3, R * 1.1, 0.35, M.slime[2]); star(px, py, R * 0.45); }
      } else if (e.type === 'skeleton') {
        if (t > 0.15 && t < 0.6) { e.state = 'windup'; e.wind = (t - 0.15) / 0.45; }
        if (X(0.6)) { e.state = 'idle'; e.swing = 0.001; }
        if (X(0.7)) { slashFx(e.x, e.y, e.facing, R * 1.95, 2.2, 1, 0.3, WHITE); const [px, py] = front(2); star(px, py, R * 0.42); }
      }
      break;
    case 2: // ABILITY
      e.expr = 'attack';
      if (e.type === 'archer') {
        turnTo(e, ad, 12, dt);
        if (t < 1.0) { e.state = 'barrage'; if (t < 0.45) e.pull = t / 0.45; } else { e.state = 'idle'; e.pull = 0; e.expr = 'idle'; }
        if (X(0.45)) popText(e.x, e.y - R * 1.25, 'Barrage!', 13, M.archer[1]);
        for (let k = 0; k < 7; k++) if (X(0.45 + k * 0.07)) {
          const hx = 0.62 * D.r * S, hy = -1.08 * D.r * S, c = Math.cos(e.facing), s = Math.sin(e.facing);
          shoot(e.x + c * hx - s * hy, e.y + s * hx + c * hy, e.facing + (k - 3) * 0.13, 360, FX.shock, 0.85 * R, 0.42); e.pull = 0.6;
        }
      } else if (e.type === 'knight') {
        turnTo(e, ad, 14, dt);
        if (t < 0.45) { e.state = 'windup'; const k = t / 0.45; e.ox = -fx * 8 * k; e.oy = -fy * 8 * k; e.breath = -0.04 * k; }
        else if (t < 0.7) { e.state = 'charge'; const k = easeOut((t - 0.45) / 0.25) * 62 - 8; e.ox = fx * k; e.oy = fy * k; e.breath = 0.05; if (Math.random() < dt * 60) emit(PK.LINE, e.x - fx * R * rand(0.8, 1.4), e.y + rand(-R, R) * 0.9, -fx * 300, -fy * 300, 0.18, 3, INK, 2); }
        else { e.state = 'idle'; e.breath = 0; const k = 54 * (1 - easeInOut(clamp((t - 0.95) / 0.9, 0, 1))); e.ox = fx * k; e.oy = fy * k; if (t > 1.0) e.expr = 'idle'; }
        if (X(0.7)) { const [px, py] = front(1.7); star(px, py, R * 0.75, 0.35, M.gold[0]); ringFx(px, py, R * 0.3, R * 1.2, 0.35, WHITE); popText(e.x, e.y - R * 1.25, 'Charge!', 13, M.knight[1]); burst(PK.DOT, px, py, 8, 80, 200, 0.35, 4, M.gold[0], 5); }
      } else if (e.type === 'rogue') {
        const D2 = 64;
        if (X(0.12)) { puff(e.x, e.y, R * 0.9); e.hidden = true; }
        if (X(0.42)) { e.ox = fx * D2; e.oy = fy * D2; e.facing = ad + Math.PI; e.hidden = false; e.x = e.hx + e.ox; e.y = e.hy + e.oy; puff(e.x, e.y, R * 0.8); popText(e.x, e.y - R * 1.25, 'Shadow step!', 13, M.rogue[1]); }
        if (X(0.6)) { e.stab = 1; e.stabSide = -1; const [px, py] = front(1.9); star(px, py, R * 0.5, 0.3, WHITE); popText(px, py - R * 0.6, '32', 15, M.rogue[1]); }
        if (X(1.3)) { puff(e.x, e.y, R * 0.8); e.hidden = true; }
        if (X(1.55)) { e.ox = 0; e.oy = 0; e.x = e.hx; e.y = e.hy; e.facing = HALF_PI; e.hidden = false; puff(e.x, e.y, R * 0.7); e.expr = 'idle'; }
      } else if (e.type === 'rat') {
        if (X(0.05)) popText(e.x, e.y - R * 1.3, 'Frenzy!', 13, M.rat[1]);
        const k = t < 1.5 ? Math.sin(clamp(t / 1.5, 0, 1) * Math.PI) : 0, zig = Math.sin(t * 20) * 10 * k, f = k * 34;
        e.ox = fx * f - fy * zig; e.oy = fy * f + fx * zig; e.facing = ad + Math.cos(t * 20) * 0.7 * k;
        if (Math.floor(t / 0.16) !== Math.floor(pt / 0.16) && t < 1.4) { e.bite = 1; const [px, py] = front(1.8); star(px, py, R * 0.3); }
        if (t > 1.5) e.expr = 'idle';
      } else if (e.type === 'slime') {
        turnTo(e, ad, 10, dt);
        if (t < 0.4) { e.breath = -0.12 * (t / 0.4); }
        else if (t < 1.0) { const k = (t - 0.4) / 0.6; e.breath = 0.06; e.lift = Math.sin(k * Math.PI) * 0.75; e.ox = fx * 16 * k; e.oy = fy * 16 * k; }
        else { e.breath *= Math.exp(-dt * 8); e.lift = 0; e.ox *= Math.exp(-dt * 3); e.oy *= Math.exp(-dt * 3); if (t > 1.4) e.expr = 'idle'; }
        if (X(1.0)) { e.breath = -0.16; ringFx(e.x, e.y + R * 0.2, R * 0.8, R * 2.4, 0.5, M.slime[0], 7); burst(PK.DOT, e.x, e.y, 12, 90, 200, 0.45, 5, M.slime[2], 4); popText(e.x, e.y - R * 1.3, 'Splat!', 13, M.slime[1]); }
      } else if (e.type === 'skeleton') {
        if (t < 0.5) { e.state = 'windup'; e.wind = t / 0.5; turnTo(e, ad, 10, dt); }
        else if (t < 1.25) { e.state = 'spin'; e.facing = ad + easeInOut((t - 0.5) / 0.75) * TAU * 2; }
        else { e.state = 'idle'; turnTo(e, ad, 10, dt); if (t > 1.5) e.expr = 'idle'; }
        if (X(0.5)) popText(e.x, e.y - R * 1.3, 'Spin slash!', 13, M.rust[0]);
        for (const T of [0.6, 0.85, 1.1]) if (X(T)) slashFx(e.x, e.y, e.facing, R * 1.9, 3.0, -1, 0.26, WHITE);
      }
      break;
    case 3: { // HIT
      e.ox *= Math.exp(-dt * 8); e.oy *= Math.exp(-dt * 8); turnTo(e, ad, 10, dt);
      for (const [T, n] of [[0.1, 0], [0.5, 1]]) if (X(T)) {
        if (e.type === 'archer' && n === 1) { e.kvx = -fy * 260; e.kvy = fx * 260; popText(e.x, e.y - R * 1.4, 'Dodge!', 13, M.archer[1]); e.expr = 'attack'; continue; }
        e.flash = 0.12; e.expr = 'hit'; e.kvx = -fx * 240; e.kvy = -fy * 240;
        const [px, py] = front(1); star(px, py, R * 0.45);
        popText(e.x + (n ? 14 : -10), e.y - R * 1.25 - n * 10, n ? '17' : '12', 16);
      }
      if (t > 0.85) e.expr = 'idle';
      break;
    }
    case 4: // DEATH
      if (X(0.02)) { e.expr = 'dead'; e.dying = 0.001; }
      if (e.dying > 0) e.dying = Math.min(1, t / 0.45);
      if (X(0.45)) {
        e.dying = 0; e.hidden = true;
        star(e.x, e.y, R * 0.9, 0.3, WHITE); ringFx(e.x, e.y, R * 0.6, R * 1.8, 0.4, M[D === DESIGN.skeleton ? 'bone' : e.type][0]);
        if (e.type === 'skeleton') burst(PK.BONE, e.x, e.y, 6, 80, 180, 0.7, R * 0.28, '', 4, 120);
        else { burst(PK.DOT, e.x, e.y, 10, 90, 220, 0.5, 5, M[e.type][0], 4, 60); burst(PK.DOT, e.x, e.y, 6, 60, 160, 0.5, 3.5, M[e.type][2], 4, 60); }
        if (e.type === 'slime') for (let sd = -1; sd <= 1; sd += 2) {
          const c = makeUnit('slime', e.x, e.y, e.scale); c.k = 0.6; c.facing = ad + sd * 0.8; c.vx = -fy * sd * 120 + fx * 30; c.vy = fx * sd * 120 + fy * 30; c.life = 0.75; c.spawnT = 0.3; c.lift = 0;
          extras.push(c);
        }
      }
      break;
    case 5: // RESPAWN
      if (X(0.01)) { e.hidden = false; e.expr = 'idle'; e.spawnT = 0.45; e.ox = e.oy = 0; e.facing = HALF_PI; e.state = 'idle'; ringFx(e.x, e.y, R * 1.6, R * 0.9, 0.35, WHITE, 4); }
      break;
  }
}
function updateAnim(e, dt) {
  e.anim += dt;
  if (e.flash > 0) e.flash -= dt;
  if (e.swing > 0) { e.swing += dt / 0.34; if (e.swing >= 1) e.swing = 0; }
  if (e.stab > 0) e.stab = Math.max(0, e.stab - dt * 5);
  if (e.bite > 0) e.bite = Math.max(0, e.bite - dt * 6);
  if (e.spawnT > 0) e.spawnT = Math.max(0, e.spawnT - dt);
  e.blinkT -= dt; if (e.blinkT <= 0) { e.blink = 0.12; e.blinkT = rand(2.2, 4.5); } if (e.blink > 0) e.blink -= dt;
  e.kx += e.kvx * dt; e.ky += e.kvy * dt; e.kvx *= Math.exp(-dt * 12); e.kvy *= Math.exp(-dt * 12); e.kx *= Math.exp(-dt * 7); e.ky *= Math.exp(-dt * 7);
}
function idleFacing(e, dt) {
  if (facingDemo) { turnTo(e, Math.atan2(DOT.y - e.y, DOT.x - e.x), 5, dt); return; }
  e.lookT -= dt; if (e.lookT <= 0) { e.lookT = rand(1.6, 3.4); e.look = HALF_PI + [0, 0, -0.75, 0.75, -1.3, 1.3][Math.floor(rand(0, 6))]; }
  turnTo(e, e.look, 3.5, dt);
}
function updateSheet(dt) {
  LT += dt;
  if (facingDemo) { if (!dotStill) dotAng += dt * 0.32; DOT.x = 422 + Math.cos(dotAng) * 392; DOT.y = 182 + Math.sin(dotAng) * 158; }
  for (const e of units) {
    updateAnim(e, dt);
    if (e.seq) {
      const q = e.seq; q.pt = q.t; q.t += dt;
      if (q.t >= 0) {
        const dur = PHASES[q.i][1]; runPhase(e, q.i, q.t, Math.max(0, q.pt), dur, dt);
        if (q.t >= dur) { q.i++; q.t = 0; q.pt = 0; if (q.i >= PHASES.length) { e.seq = null; e.state = 'idle'; e.pull = 0; e.lift = 0; e.breath = 0; } }
      } else idleFacing(e, dt);
    } else {
      idleFacing(e, dt); e.ox *= Math.exp(-dt * 5); e.oy *= Math.exp(-dt * 5);
      e.breath = Math.sin(LT * 2.4 + e.hx * 0.01) * 0.025;
      if (e.type === 'slime') e.breath = Math.sin(LT * 3 + 1) * 0.045;
    }
    e.x = e.hx + e.ox + e.kx; e.y = e.hy + e.oy + e.ky;
  }
  for (let i = extras.length - 1; i >= 0; i--) {
    const c = extras[i]; updateAnim(c, dt); c.hx += c.vx * dt; c.hy += c.vy * dt; c.vx *= Math.exp(-dt * 4); c.vy *= Math.exp(-dt * 4); c.x = c.hx; c.y = c.hy; c.life -= dt;
    c.lift = Math.abs(Math.sin(c.life * 9)) * 0.2; c.breath = Math.sin(c.anim * 9) * 0.06;
    if (c.life <= 0) { const R = DESIGN.slime.r * c.scale * c.k; star(c.x, c.y, R * 0.8, 0.25); burst(PK.DOT, c.x, c.y, 7, 70, 170, 0.45, 4, M.slime[0], 4, 50); extras.splice(i, 1); }
  }
  for (const m of minis) { updateAnim(m, dt); idleFacing(m, dt); m.breath = Math.sin(LT * 2.4 + m.hx * 0.02) * 0.025; }
  updateProjs(dt);
}

// =====================================================================
// RENDER
// =====================================================================
function drawLabels(g) {
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  for (const e of units) {
    const D = DESIGN[e.type], y = e.hy + 64, x = e.hx;
    g.font = `800 15px ${FONT}`; g.fillStyle = INK; g.fillText(D.name, x, y);
    if (e.seq && e.seq.t >= 0 && e.seq.i < 5) {
      const label = e.seq.i === 2 ? 'Ability: ' + D.ability : PHASES[e.seq.i][0];
      g.font = `700 10px ${FONT}`; g.fillStyle = M[D === DESIGN.skeleton ? 'rust' : e.type][1]; g.fillText(label, x, y + 14);
      for (let k = 0; k < 5; k++) { g.beginPath(); circ(g, x - 16 + k * 8, y + 24, 2.2); g.fillStyle = k === e.seq.i ? INK : 'rgba(43,34,48,0.2)'; g.fill(); }
    } else {
      g.font = `600 10px ${FONT}`; g.fillStyle = 'rgba(43,34,48,0.62)'; g.fillText(D.desc, x, y + 14);
    }
  }
  // in-game size row caption
  g.textAlign = 'right'; g.font = `700 10px ${FONT}`; g.fillStyle = 'rgba(43,34,48,0.62)'; g.fillText('In-game size', MINI_X0 - 40, MINI_Y + 4);
  g.beginPath(); g.moveTo(MINI_X0 - 40, MINI_Y - 31.5); g.lineTo(MINI_X0 + 5 * MINI_DX + 40, MINI_Y - 31.5); g.strokeStyle = 'rgba(43,34,48,0.14)'; g.lineWidth = 1; g.stroke();
}
function drawDot(g) {
  if (!facingDemo) return;
  g.beginPath(); g.ellipse(422, 182, 392, 158, 0, 0, TAU); g.setLineDash([2, 7]); g.strokeStyle = 'rgba(43,34,48,0.16)'; g.lineWidth = 1.5; g.stroke(); g.setLineDash([]);
  g.beginPath(); circ(g, DOT.x, DOT.y + 4, 9); g.fillStyle = GROUND; g.fill();
  g.beginPath(); circ(g, DOT.x, DOT.y, 9); g.fillStyle = M.gold[0]; g.fill(); g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();
  g.beginPath(); circ(g, DOT.x, DOT.y, 3.2); g.fillStyle = INK; g.fill();
}
function render() {
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = BG; g.fillRect(0, 0, W, H);
  g.setTransform(SCALE, 0, 0, SCALE, OX, OY);
  drawLabels(g);
  drawDot(g);
  const all = units.concat(extras, minis);
  all.sort((a, b) => a.y - b.y);
  for (const e of all) drawUnit(g, e);
  drawFx(g); drawProjs(g); drawParticles(g); drawTexts(g);
}

// =====================================================================
// BOOT / INPUT / LOOP
// =====================================================================
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const cw = window.innerWidth, ch = window.innerHeight;
  W = Math.max(1, Math.round(cw * DPR)); H = Math.max(1, Math.round(ch * DPR)); cv.width = W; cv.height = H;
  SCALE = Math.min(cw / WORLD_W, ch / WORLD_H) * DPR; OX = (W - WORLD_W * SCALE) / 2; OY = (H - WORLD_H * SCALE) / 2;
}
cv.addEventListener('pointerdown', ev => {
  const wx = (ev.clientX * DPR - OX) / SCALE, wy = (ev.clientY * DPR - OY) / SCALE;
  let best = null, bd = 1e9;
  for (const e of units) { const d = Math.hypot(e.hx - wx, e.hy - wy); if (d < bd) { bd = d; best = e; } }
  for (const m of minis) { const d = Math.hypot(m.hx - wx, m.hy - wy); if (d < 30 && d < bd) { bd = d; best = units[minis.indexOf(m)]; } }
  if (best && bd < 120) play(best);
});
const facingBtn = document.getElementById('facing');
function setFacing(on) { facingDemo = on; facingBtn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
facingBtn.addEventListener('click', () => setFacing(!facingDemo));
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// hash options (handy for screenshots): #facing  #dot=-1.0  #still  #play  #fps
const HASH = location.hash;
if (/facing/.test(HASH)) setFacing(true);
const dm = HASH.match(/dot=(-?[\d.]+)/); if (dm) dotAng = parseFloat(dm[1]);
if (/still/.test(HASH)) dotStill = true;
const fpsEl = document.getElementById('fps'), showFps = /fps/.test(HASH); if (showFps) fpsEl.style.display = 'block';
let last = performance.now(), fAcc = 0, fN = 0, work = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  const w0 = performance.now();
  updateSheet(dt); updateParticles(dt); updateFx(dt); updateTexts(dt); render();
  work = work * 0.95 + (performance.now() - w0) * 0.05;
  if (showFps) { fAcc += dt; fN++; if (fAcc > 0.5) { fpsEl.textContent = Math.round(fN / fAcc) + ' fps ' + work.toFixed(1) + 'ms'; fAcc = fN = 0; } }
  requestAnimationFrame(frame);
}
resize(); buildSheet();
if (/play/.test(HASH)) units.forEach((e, i) => play(e, 0.3 + i * 0.12));
requestAnimationFrame(frame);
</script>
