<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- Attempt 2 (lineless soft): one heavy outer silhouette, NO inner lines; parts separated by colour and
       soft contact shadows; the two-tone split is kept but each half is a gentle gradient. Calm face in a
       soft warm shadow gradient. Facing = DOWN (+y). Rotate whole sprite around (100,100). -->
  <defs>
    <path id="hood" d="M100 14 C118 32 150 56 159 92 C166 124 146 153 100 155 C54 153 34 124 41 92 C50 56 82 32 100 14 Z"/>
    <clipPath id="hoodClip"><use href="#hood"/></clipPath>
    <path id="pBackL" d="M60 96 C34 88 12 104 8 134 C28 140 52 128 70 112 Z"/>
    <path id="pBackR" d="M140 96 C166 88 188 104 192 134 C172 140 148 128 130 112 Z"/>
    <path id="pFrontL" d="M52 112 C30 114 18 134 22 158 C44 156 66 142 76 126 Z"/>
    <path id="pFrontR" d="M148 112 C170 114 182 134 178 158 C156 156 134 142 124 126 Z"/>
    <path id="brim" d="M50 134 C50 90 150 90 150 134 C148 152 130 160 100 160 C70 160 52 152 50 134 Z"/>
    <clipPath id="brimClip"><use href="#brim"/></clipPath>
    <path id="open" d="M62 132 C64 101 136 101 138 132 C134 151 66 151 62 132 Z"/>
    <clipPath id="openClip"><use href="#open"/></clipPath>
    <path id="bow" d="M28 146 C37 178 70 192 100 192 C130 192 163 178 172 146 L165 144 C154 169 128 181 100 181 C72 181 46 169 35 144 Z"/>
    <clipPath id="bowClip"><use href="#bow"/></clipPath>
    <g id="quiverShape" transform="rotate(30 138 52)">
      <path d="M130 30 C120 24 118 12 124 6 C132 12 134 22 130 30 Z"/>
      <path d="M146 30 C156 24 158 12 152 6 C144 12 142 22 146 30 Z"/>
      <rect x="120" y="26" width="36" height="50" rx="10"/>
    </g>
    <path id="shadeR" d="M100 -10 C97 40 98 66 100 90 V220 H220 V-10 Z"/>

    <linearGradient id="gLit" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7CC06F"/><stop offset="1" stop-color="#5EA459"/>
    </linearGradient>
    <linearGradient id="gShade" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#57995A"/><stop offset="1" stop-color="#3F7C46"/>
    </linearGradient>
    <linearGradient id="gPetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E7E45"/><stop offset="1" stop-color="#2F6637"/>
    </linearGradient>
    <linearGradient id="gPetalBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D6234"/><stop offset="1" stop-color="#244F2A"/>
    </linearGradient>
    <linearGradient id="gBrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C858"/><stop offset="1" stop-color="#E9A232"/>
    </linearGradient>
    <!-- face: warm shadow under the brim fading softly into lit skin (no hard band) -->
    <linearGradient id="gFace" x1="0" y1="102" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9E6650"/>
      <stop offset="0.38" stop-color="#C98E6C"/>
      <stop offset="0.62" stop-color="#F2C7A0"/>
      <stop offset="1" stop-color="#F6D0AC"/>
    </linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D0935A"/><stop offset="0.5" stop-color="#B57944"/><stop offset="1" stop-color="#94602F"/>
    </linearGradient>
    <radialGradient id="gHand" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#F8D4B2"/><stop offset="1" stop-color="#DFA57F"/>
    </radialGradient>
  </defs>

  <!-- ===== heavy outer silhouette ===== -->
  <g fill="#2B2230" stroke="#2B2230" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <use href="#pBackL"/><use href="#pBackR"/><use href="#pFrontL"/><use href="#pFrontR"/>
    <use href="#quiverShape"/>
    <use href="#hood"/><use href="#brim"/>
    <use href="#bow"/>
    <path d="M32 146 L100 156 L168 146" fill="none" stroke-width="8"/>
    <path d="M100 152 V194" stroke-width="14"/>
    <path d="M90 192 L100 208 L110 192 Z"/>
    <rect x="86" y="175" width="28" height="21" rx="8"/>
  </g>

  <!-- ===== interior: colour only ===== -->
  <use href="#pBackL" fill="url(#gPetalBack)"/>
  <use href="#pBackR" fill="url(#gPetalBack)"/>
  <!-- back petals tucked under front petals: soft contact shade -->
  <use href="#pFrontL" fill="#1F4425" transform="translate(0 -3)"/>
  <use href="#pFrontR" fill="#1F4425" transform="translate(0 -3)"/>
  <use href="#pFrontL" fill="url(#gPetal)"/>
  <use href="#pFrontR" fill="url(#gPetal)"/>
  <path d="M62 124 C46 128 36 138 30 150 C40 138 50 130 62 124 Z" fill="none"/>

  <g transform="rotate(30 138 52)">
    <path d="M130 30 C120 24 118 12 124 6 C132 12 134 22 130 30 Z" fill="#FFF8E8"/>
    <path d="M146 30 C156 24 158 12 152 6 C144 12 142 22 146 30 Z" fill="#9AD17F"/>
    <rect x="120" y="26" width="36" height="50" rx="10" fill="url(#gWood)"/>
    <rect x="120" y="40" width="36" height="7" fill="#6E4222"/>
  </g>

  <!-- hood sits on a soft dark rim so it separates from petals/quiver without a line -->
  <use href="#hood" fill="#24502B" transform="translate(0 3)"/>
  <use href="#hood" fill="url(#gLit)"/>
  <g clip-path="url(#hoodClip)">
    <use href="#shadeR" fill="url(#gShade)"/>
    <!-- vein as a tone, tapering -->
    <path d="M100 18 C97 42 97 68 100 92 C101 68 102 42 100 18 Z" fill="#3F7C46" opacity="0.6"/>
  </g>

  <!-- brim -->
  <use href="#brim" fill="url(#gBrim)"/>
  <g clip-path="url(#brimClip)"><use href="#shadeR" fill="#D9952A" opacity="0.55"/></g>

  <!-- face -->
  <use href="#open" fill="#2E5E35"/>
  <g clip-path="url(#openClip)">
    <path d="M66 132 C68 104 132 104 134 132 C130 150 70 150 66 132 Z" fill="url(#gFace)"/>
    <path d="M100 100 H140 V152 H100 Z" fill="#8A4E36" opacity="0.14"/>
    <path d="M97 136 Q100 138.5 103 136" fill="none" stroke="#C98868" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- leaf clasp, two tones, no outline -->
  <path d="M100 84 C112 90 114 103 100 112 C86 103 88 90 100 84 Z" fill="#24502B"/>
  <path d="M100 87 C110 93 111 102 100 109 C89 102 90 93 100 87 Z" fill="#A6DA88"/>
  <path d="M100 87 C110 93 111 102 100 109 Z" fill="#82C268"/>

  <!-- string -->
  <path d="M32 146 L100 156 L168 146" fill="none" stroke="#FFF8E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrow -->
  <path d="M100 152 V194" stroke="#A0683A" stroke-width="4"/>
  <path d="M90 192 L100 208 L110 192 Z" fill="#D3D8DF"/>
  <path d="M100 192 L110 192 L100 208 Z" fill="#A4ACB8"/>

  <!-- bow -->
  <use href="#bow" fill="url(#gWood)"/>
  <g clip-path="url(#bowClip)">
    <path d="M20 130 L44 150 L36 162 L14 150 Z" fill="#2B2230"/>
    <path d="M180 130 L156 150 L164 162 L186 150 Z" fill="#2B2230"/>
  </g>
  <rect x="83" y="178" width="34" height="15" rx="4" fill="#8A3B2E"/>

  <!-- hands: rounded rects, soft shaded, no outline -->
  <rect x="88" y="175" width="24" height="21" rx="8" fill="url(#gHand)"/>
  <rect x="89" y="147" width="22" height="20" rx="8" fill="#2B2230" opacity="0.35" transform="translate(0 2)"/>
  <rect x="89" y="147" width="22" height="20" rx="8" fill="url(#gHand)"/>
</svg>
