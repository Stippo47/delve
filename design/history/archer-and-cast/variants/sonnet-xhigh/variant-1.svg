<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- Variant 1 "Plump Sprout": bubbly rounded hood, soft gradients, one uniform line weight, mitten hands, layered petal shoulders.
       Single sprite. Front = DOWN (+y). Rotate whole sprite around (100,100). -->
  <defs>
    <path id="hood" d="M100 16 C109 16 114 27 122 34 C146 51 163 75 163 104 C163 141 136 161 100 161 C64 161 37 141 37 104 C37 75 54 51 78 34 C86 27 91 16 100 16 Z"/>
    <clipPath id="hoodClip"><use href="#hood"/></clipPath>
    <path id="open" d="M61 128 C61 105 139 105 139 128 C139 148 122 154 100 154 C78 154 61 148 61 128 Z"/>
    <clipPath id="openClip"><use href="#open"/></clipPath>

    <radialGradient id="hoodGrad" gradientUnits="userSpaceOnUse" cx="84" cy="62" r="118">
      <stop offset="0" stop-color="#8BCF75"/>
      <stop offset="0.5" stop-color="#55A057"/>
      <stop offset="1" stop-color="#357C45"/>
    </radialGradient>
    <linearGradient id="brimGrad" gradientUnits="userSpaceOnUse" x1="0" y1="92" x2="0" y2="164">
      <stop offset="0" stop-color="#FFD66E"/>
      <stop offset="1" stop-color="#F0A92C"/>
    </linearGradient>
    <linearGradient id="foreheadShade" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="124">
      <stop offset="0" stop-color="#C98162"/>
      <stop offset="1" stop-color="#C98162" stop-opacity="0"/>
    </linearGradient>

    <!-- one petal pair (left), mirrored for the right -->
    <g id="petalsL" stroke="#2B2230" stroke-width="5" stroke-linejoin="round">
      <path d="M62 90 C36 80 8 92 10 114 C12 130 44 130 68 116 Z" fill="#2F6E3E"/>
      <path d="M62 112 C36 110 14 126 22 146 C34 158 64 154 80 138 Z" fill="#418A4A"/>
    </g>
  </defs>

  <!-- layered petal shoulders (behind hood) -->
  <use href="#petalsL"/>
  <use href="#petalsL" transform="matrix(-1 0 0 1 200 0)"/>

  <!-- quiver, back-right -->
  <g transform="translate(-2 2) rotate(30 138 52)" stroke="#2B2230" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M131 31 C119 26 115 12 123 5 C133 10 136 22 131 31 Z" fill="#FFF8E8"/>
    <path d="M145 31 C157 26 161 12 153 5 C143 10 140 22 145 31 Z" fill="#A6DB86"/>
    <rect x="120" y="26" width="36" height="50" rx="14" fill="#A56B3C"/>
    <rect x="123" y="42" width="30" height="8" fill="#7C4B26" stroke="none"/>
  </g>

  <!-- hood -->
  <use href="#hood" fill="url(#hoodGrad)" stroke="#2B2230" stroke-width="5" stroke-linejoin="round"/>
  <!-- soft centre crease -->
  <path d="M100 28 C98 46 98 64 100 84" fill="none" stroke="#3B8046" stroke-width="5" stroke-linecap="round" clip-path="url(#hoodClip)"/>

  <!-- brim ring -->
  <path d="M45 128 C45 90 155 90 155 128 C155 155 132 164 100 164 C68 164 45 155 45 128 Z" fill="url(#brimGrad)" stroke="#2B2230" stroke-width="5" stroke-linejoin="round"/>
  <use href="#open" fill="#F7D0A9" stroke="#2B2230" stroke-width="5" stroke-linejoin="round"/>

  <!-- face -->
  <g clip-path="url(#openClip)">
    <rect x="55" y="100" width="90" height="34" fill="url(#foreheadShade)"/>
    <ellipse cx="74" cy="140" rx="8" ry="5" fill="#F08E86" opacity="0.85"/>
    <ellipse cx="126" cy="140" rx="8" ry="5" fill="#F08E86" opacity="0.85"/>
    <!-- eyeless: calm face, nose nub and cheeks only -->
    <ellipse cx="100" cy="133" rx="6.5" ry="4.6" fill="#EDA98A"/>
    <ellipse cx="98.5" cy="131.6" rx="2.4" ry="1.5" fill="#FBDDC0"/>
  </g>

  <!-- leaf clasp -->
  <path d="M100 86 C113 92 115 106 100 115 C85 106 87 92 100 86 Z" fill="#B4E08B" stroke="#2B2230" stroke-width="5" stroke-linejoin="round"/>

  <!-- bow string -->
  <path d="M34 148 L100 158 L166 148" fill="none" stroke="#2B2230" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke="#2B2230" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- arrow -->
    <path d="M100 156 V190" stroke-width="14"/>
    <path d="M100 156 V190" stroke="#C99160" stroke-width="4"/>
    <path d="M100 186 C113 192 114 198 100 206 C86 198 87 192 100 186 Z" fill="#CBD2DA"/>
  </g>

  <!-- chunky bow, outlined with the same weight as everything else -->
  <path d="M33 144 C30 164 62 182 100 182 C138 182 170 164 167 144" fill="none" stroke="#2B2230" stroke-width="18" stroke-linecap="round"/>
  <path d="M33 144 C30 164 62 182 100 182 C138 182 170 164 167 144" fill="none" stroke="#B5763F" stroke-width="8" stroke-linecap="round"/>
  <circle cx="33" cy="144" r="7.5" fill="#F6BE45" stroke="#2B2230" stroke-width="5"/>
  <circle cx="167" cy="144" r="7.5" fill="#F6BE45" stroke="#2B2230" stroke-width="5"/>

  <!-- mitten hands -->
  <g fill="#F7D0A9" stroke="#2B2230" stroke-width="5" stroke-linejoin="round">
    <rect x="86" y="148" width="28" height="19" rx="9"/>
    <rect x="86" y="172" width="28" height="19" rx="9"/>
  </g>
</svg>
