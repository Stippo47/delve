<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- Archer, single sprite. Facing = DOWN (+y). Rotate the whole sprite around (100,100) to aim. -->
  <defs>
    <path id="hood" d="M100 16 C116 32 148 56 158 90 C166 122 148 152 100 154 C52 152 34 122 42 90 C52 56 84 32 100 16 Z"/>
    <clipPath id="hoodClip"><use href="#hood"/></clipPath>
    <path id="open" d="M62 132 C64 100 136 100 138 132 C134 152 66 152 62 132 Z"/>
    <clipPath id="openClip"><use href="#open"/></clipPath>
  </defs>

  <g stroke="#2B2230" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- shoulder cape lobes (behind hood) -->
    <path d="M58 94 C28 98 18 126 32 142 C44 154 66 148 76 138 Z" fill="#3E7A44"/>
    <path d="M142 94 C172 98 182 126 168 142 C156 154 134 148 124 138 Z" fill="#3E7A44"/>

    <!-- quiver peeking out the back-right -->
    <g transform="rotate(30 138 52)">
      <path d="M130 30 C120 24 118 12 124 6 C132 12 134 22 130 30 Z" fill="#FFF8E8"/>
      <path d="M146 30 C156 24 158 12 152 6 C144 12 142 22 146 30 Z" fill="#9AD17F"/>
      <rect x="120" y="26" width="36" height="50" rx="10" fill="#A0683A"/>
      <rect x="120" y="40" width="36" height="7" fill="#7A4A26"/>
    </g>

    <!-- hood base -->
    <use href="#hood" fill="#3E7A44"/>
  </g>

  <!-- hood: lit body offset up-left leaves a hard shadow crescent lower-right -->
  <g clip-path="url(#hoodClip)">
    <use href="#hood" fill="#5FA35A" transform="translate(-9 -6)"/>
    <!-- centre seam -->
    <path d="M100 16 C97 40 98 66 100 90" fill="none" stroke="#3E7A44" stroke-width="4" stroke-linecap="round"/>
    <!-- highlight -->
    <path d="M72 50 C64 60 58 72 56 86" fill="none" stroke="#9AD17F" stroke-width="8" stroke-linecap="round"/>
  </g>
  <use href="#hood" fill="none" stroke="#2B2230" stroke-width="4" stroke-linejoin="round"/>

  <!-- gold brim + face opening -->
  <g stroke="#2B2230" stroke-width="4" stroke-linejoin="round">
    <path d="M50 134 C50 90 150 90 150 134 C148 152 130 160 100 160 C70 160 52 152 50 134 Z" fill="#F2B53A"/>
    <use href="#open" fill="#2B2230"/>
  </g>

  <!-- face -->
  <g clip-path="url(#openClip)">
    <path d="M64 142 C66 118 134 118 136 142 C132 160 68 160 64 142 Z" fill="#F2C7A0"/>
    <path d="M122 120 C138 130 136 150 122 160 L150 160 L150 116 Z" fill="#D99C75"/>
    <!-- brim shadow on the forehead -->
    <path d="M56 96 H144 V122 C122 115 78 115 56 122 Z" fill="#2B2230"/>
    <!-- cheeks -->
    <ellipse cx="76" cy="144" rx="6" ry="3.5" fill="#E8A383"/>
    <ellipse cx="124" cy="144" rx="6" ry="3.5" fill="#E8A383"/>
    <!-- eyes -->
    <ellipse cx="86" cy="133" rx="7" ry="9" fill="#2B2230"/>
    <ellipse cx="114" cy="133" rx="7" ry="9" fill="#2B2230"/>
    <circle cx="83.5" cy="129.5" r="3" fill="#FFFFFF"/>
    <circle cx="111.5" cy="129.5" r="3" fill="#FFFFFF"/>
    <!-- brows (determined) -->
    <path d="M76 121 L94 125" stroke="#2B2230" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M124 121 L106 125" stroke="#2B2230" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- leaf clasp -->
  <path d="M100 86 C111 92 113 104 100 112 C87 104 89 92 100 86 Z" fill="#9AD17F" stroke="#2B2230" stroke-width="4" stroke-linejoin="round"/>
  <path d="M100 91 V107" stroke="#3E7A44" stroke-width="2.5" stroke-linecap="round"/>

  <!-- bow string, drawn back to the chin -->
  <path d="M38 154 L100 156 L162 154" fill="none" stroke="#2B2230" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 154 L100 156 L162 154" fill="none" stroke="#FFF8E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke="#2B2230" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- arrow -->
    <path d="M100 152 V194" stroke="#2B2230" stroke-width="7"/>
    <path d="M100 152 V194" stroke="#A0683A" stroke-width="3"/>
    <path d="M90 192 L100 208 L110 192 Z" fill="#C9CED6"/>
    <path d="M100 195 V204" stroke="#8F97A3" stroke-width="2.5"/>

    <!-- recurve bow -->
    <path d="M34 146 C30 156 36 164 44 166 C60 178 80 184 100 184 C120 184 140 178 156 166 C164 164 170 156 166 146"
          fill="none" stroke="#2B2230" stroke-width="12"/>
    <path d="M34 146 C30 156 36 164 44 166 C60 178 80 184 100 184 C120 184 140 178 156 166 C164 164 170 156 166 146"
          fill="none" stroke="#A0683A" stroke-width="5"/>
    <path d="M118 182 C134 179 148 173 156 166" fill="none" stroke="#7A4A26" stroke-width="5" stroke-linecap="butt"/>
    <rect x="90" y="177" width="20" height="13" rx="3.5" fill="#F2B53A"/>

    <!-- hands -->
    <circle cx="100" cy="185" r="10.5" fill="#F2C7A0"/>
    <circle cx="100" cy="157" r="10.5" fill="#F2C7A0"/>
  </g>
  <path d="M104 160 A7 7 0 0 1 96 162" fill="none" stroke="#D99C75" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 188 A7 7 0 0 1 96 190" fill="none" stroke="#D99C75" stroke-width="3" stroke-linecap="round"/>
</svg>
