<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- FARMER design 4 "Market Day": plum knit beanie with a cream pompom and a turned-up cuff, wicker back-basket
       heaped with a pumpkin, a cabbage and carrot tops, hoe gripped two-handed and chopped forward-left.
       Facing = DOWN (+y). Rotate whole sprite around (100,100). -->
  <defs>
    <ellipse id="basket" cx="100" cy="40" rx="56" ry="34"/>
    <clipPath id="basketClip"><use href="#basket"/></clipPath>
    <circle id="beanie" cx="100" cy="92" r="51"/>
    <clipPath id="beanieClip"><use href="#beanie"/></clipPath>
    <path id="cuff" d="M50 104 C62 118 80 124 100 124 C120 124 138 118 150 104 C152 118 146 132 132 138 C122 142 112 143 100 143 C88 143 78 142 68 138 C54 132 48 118 50 104 Z"/>
    <clipPath id="cuffClip"><use href="#cuff"/></clipPath>
    <ellipse id="face" cx="100" cy="146" rx="31" ry="19"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <path id="shadeR" d="M100 -10 V220 H220 V-10 Z"/>
    <g id="hoe">
      <rect x="-5" y="-40" width="10" height="82" rx="5"/>
      <rect x="-30" y="34" width="60" height="11" rx="5.5"/>
      <rect x="-27.5" y="42" width="7" height="17" rx="3.5"/><rect x="-15.5" y="42" width="7" height="17" rx="3.5"/><rect x="-3.5" y="42" width="7" height="17" rx="3.5"/><rect x="8.5" y="42" width="7" height="17" rx="3.5"/><rect x="20.5" y="42" width="7" height="17" rx="3.5"/>
    </g>

    <linearGradient id="gWicker" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#C98E52"/><stop offset="1" stop-color="#A86F3A"/>
    </linearGradient>
    <linearGradient id="gWickerS" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9A6230"/><stop offset="1" stop-color="#814F25"/>
    </linearGradient>
    <linearGradient id="gPump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A04A"/><stop offset="1" stop-color="#E07F2E"/>
    </linearGradient>
    <linearGradient id="gCab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE38E"/><stop offset="1" stop-color="#93C46A"/>
    </linearGradient>
    <linearGradient id="gCabS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93C46A"/><stop offset="1" stop-color="#76A853"/>
    </linearGradient>
    <linearGradient id="gBeanie" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#A673B4"/><stop offset="1" stop-color="#875597"/>
    </linearGradient>
    <linearGradient id="gBeanieS" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7A4A8A"/><stop offset="1" stop-color="#633B72"/>
    </linearGradient>
    <linearGradient id="gCuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B886C5"/><stop offset="1" stop-color="#9A68AA"/>
    </linearGradient>
    <linearGradient id="gCuffS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C5C9C"/><stop offset="1" stop-color="#744885"/>
    </linearGradient>
    <radialGradient id="gPom" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#F3DDF7"/><stop offset="1" stop-color="#D4B0DE"/>
    </radialGradient>
    <linearGradient id="gFace" x1="0" y1="136" x2="0" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A6250"/>
      <stop offset="0.36" stop-color="#C98E6C"/>
      <stop offset="0.64" stop-color="#F2C7A0"/>
      <stop offset="1" stop-color="#F6D0AC"/>
    </linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C98C55"/><stop offset="0.5" stop-color="#B07442"/><stop offset="0.5" stop-color="#94602F"/><stop offset="1" stop-color="#875629"/>
    </linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EAEF"/><stop offset="1" stop-color="#B3BCC7"/>
    </linearGradient>
    <radialGradient id="gHand" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#F8D4B2"/><stop offset="1" stop-color="#DFA57F"/>
    </radialGradient>
  </defs>

  <!-- ===== heavy outer silhouette ===== -->
  <g fill="#2B2230" stroke="#2B2230" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <path d="M92 20 L85 2 L96 12 L100 0 L104 12 L115 2 L108 20 Z"/>
    <circle cx="74" cy="30" r="20"/>
    <circle cx="127" cy="28" r="19"/>
    <use href="#basket"/>
    <use href="#face"/>
    <use href="#beanie"/>
    <use href="#cuff"/>
    <use href="#hoe" transform="translate(66 144) rotate(50)"/>
    <g transform="translate(66 144) rotate(50)">
      <rect x="-12" y="-24" width="24" height="21" rx="8"/>
      <rect x="-12" y="2" width="24" height="21" rx="8"/>
    </g>
  </g>

  <!-- ===== interior ===== -->
  <!-- back-basket -->
  <use href="#basket" fill="url(#gWicker)"/>
  <g clip-path="url(#basketClip)">
    <use href="#shadeR" fill="url(#gWickerS)"/>
    <ellipse cx="100" cy="36" rx="46" ry="25" fill="#5E3A1C" opacity="0.55"/>
  </g>
  <!-- carrot tops -->
  <path d="M92 20 L85 2 L96 12 L100 0 L104 12 L115 2 L108 20 Z" fill="#6DB257"/>
  <path d="M100 0 L104 12 L115 2 L108 20 H100 Z" fill="#4E9244"/>
  <!-- pumpkin -->
  <circle cx="74" cy="32" r="20" fill="#5E3A1C" opacity="0.4"/>
  <circle cx="74" cy="30" r="20" fill="url(#gPump)"/>
  <path d="M74 10 A20 20 0 0 1 74 50 Z" fill="#D0702A"/>
  <path d="M74 12 C70 22 70 38 74 48" fill="none" stroke="#E58A36" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <rect x="70" y="11" width="8" height="9" rx="3" fill="#6B8F3C"/>
  <!-- cabbage -->
  <circle cx="127" cy="30" r="19" fill="#5E3A1C" opacity="0.4"/>
  <circle cx="127" cy="28" r="19" fill="url(#gCab)"/>
  <path d="M127 9 A19 19 0 0 1 127 47 Z" fill="url(#gCabS)"/>
  <path d="M116 22 C122 30 132 30 138 22" fill="none" stroke="#7FB25A" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(66 144) rotate(50)"><rect x="-5" y="-40" width="10" height="82" rx="5" fill="url(#gWood)"/></g>

  <!-- face -->
  <g clip-path="url(#faceClip)">
    <use href="#face" fill="url(#gFace)"/>
    <path d="M100 120 H140 V170 H100 Z" fill="#8A4E36" opacity="0.14"/>
    <path d="M97 157 Q100 159.5 103 157" fill="none" stroke="#C98868" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- beanie on a contact shadow -->
  <use href="#beanie" fill="#2B2230" opacity="0.3" transform="translate(0 3)"/>
  <use href="#beanie" fill="url(#gBeanie)"/>
  <g clip-path="url(#beanieClip)">
    <use href="#shadeR" fill="url(#gBeanieS)"/>
    <g fill="none" stroke-width="3.5" stroke-linecap="round">
      <path d="M78 50 C70 66 68 86 72 106" stroke="#9563A5" opacity="0.9"/>
      <path d="M122 50 C130 66 132 86 128 106" stroke="#6C4180" opacity="0.9"/>
    </g>
  </g>
  <!-- folded cuff -->
  <use href="#cuff" fill="#3E2448" opacity="0.4" transform="translate(0 -3)"/>
  <use href="#cuff" fill="url(#gCuff)"/>
  <g clip-path="url(#cuffClip)"><use href="#shadeR" fill="url(#gCuffS)"/></g>
  <!-- pompom -->
  <circle cx="100" cy="62" r="18" fill="#3E2448" opacity="0.35" transform="translate(0 3)"/>
  <circle cx="100" cy="62" r="18" fill="url(#gPom)"/>
  <path d="M100 44 A18 18 0 0 1 100 80 Z" fill="#BE95CB"/>

  <!-- rake -->
  <g transform="translate(66 144) rotate(50)">
    <g fill="url(#gSteel)"><rect x="-27.5" y="42" width="7" height="17" rx="3.5"/><rect x="-15.5" y="42" width="7" height="17" rx="3.5"/><rect x="-3.5" y="42" width="7" height="17" rx="3.5"/></g>
    <g fill="#A3ACB8"><rect x="8.5" y="42" width="7" height="17" rx="3.5"/><rect x="20.5" y="42" width="7" height="17" rx="3.5"/></g>
    <rect x="-30" y="34" width="60" height="11" rx="5.5" fill="url(#gSteel)"/>
    <path d="M0 34 H24.5 A5.5 5.5 0 0 1 30 39.5 A5.5 5.5 0 0 1 24.5 45 H0 Z" fill="#939DAA" opacity="0.7"/>
    <rect x="-12" y="-24" width="24" height="21" rx="8" fill="url(#gHand)"/>
    <rect x="-12" y="4" width="24" height="21" rx="8" fill="#2B2230" opacity="0.3"/>
    <rect x="-12" y="2" width="24" height="21" rx="8" fill="url(#gHand)"/>
  </g>
</svg>
