  <!-- crypt walls, option a (Tomb ashlar): a straight run. Round 19 art lane (walls). 1 SVG unit = 1 room unit. The wall's own frame: x runs along the wall, y = 0 is the foot (where the wall meets the floor; the room is below, +y), y < 0 rises up the wall away from the room. Face (the wall's inner side, folded flat like the doors' arch): y -86..0. Cap (the top, seen from above): y -104..-86. The whole wall is 104 deep; the doors' arch reaches y -57, so the wall rises 47 past it. Everything repeats every 160 along x, so runs tile end to end. No outline in the file: the renderer draws the one ink outline round the wall's mass. Rotate the piece so +y points into the room. Tile it. -->
