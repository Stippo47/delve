<path d="M154 -30L153 -44L134.5 -44L136 -30Z" fill="#3E8A9A" />
<path d="M0 -80H160V-92C130 -98 30 -98 0 -92Z" fill="url(#g2)" />
<rect x="0" y="-82" width="160" height="4" fill="#E8B84A" />
