<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -110 160 110" width="640" height="440">
  <!-- frost walls, option c (Crystal ridge): the stretch a door sits in. Round 19 art lane (walls). 1 SVG unit = 1 room unit. The wall's own frame: x runs along the wall, y = 0 is the foot (where the wall meets the floor; the room is below, +y), y < 0 rises up the wall away from the room. Face (the wall's inner side, folded flat like the doors' arch): y -82..0. Cap (the top, seen from above): y -110..-82. The whole wall is 110 deep; the doors' arch reaches y -57, so the wall rises 53 past it. Everything repeats every 160 along x, so runs tile end to end. No outline in the file: the renderer draws the one ink outline round the wall's mass. Rotate the piece so +y points into the room. An overlay: drawn over the run (which carries on under it) wherever a door stands, then the door (art/props/door-*.svg, box 141.4) on top, its doorway centred on (80, 0). -->
