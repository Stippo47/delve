<!-- RANGED Marksman: a wide teal slouch hat with a big cream plume sweeping back, buff leather coat, white cravat. A long musket aimed forward, held in front with both hands (all in arm-r, arm-l left out): the stock runs under the head (drawn before #body), the rear fist grips the wrist beside the chin and the front hand cradles the fore-stock, so the long barrel shows out front. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). -->
