<!-- BANSHEE take A "wailer" (round 4): a drowned-looking spirit woman on the base body. Cold blue-white skin, long silver hair falling down her back and streaming behind her into one long tail of hair (no legs), two dark hollow eyes and a wide-open wailing mouth, a ragged dark-teal shawl over the shoulders, pale hands reaching forward. Parts: #back = the hair tail (pivot at the head, sways), #body = shawl, head, hair, face, #arm-l, #arm-r = the hands (pivot at the shoulders). Facing = DOWN (+y), centre (100,100). -->
