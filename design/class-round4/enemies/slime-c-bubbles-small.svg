<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- SLIME take C "bubbles" (small): a cluster of glossy jelly bubbles stuck together like frogspawn: one big bubble at the front with the face, smaller ones bunched behind it (they pop off as slimelets). Parts: #body only. Facing = DOWN (+y), centre (100,100). -->
<defs>
<filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="g1" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#FFDDEE"/><stop offset="1" stop-color="#DC7AAE"/></linearGradient>
<path id="p2" d="M102 70 A24 24 0 1 0 150 70 A24 24 0 1 0 102 70 Z"/>
<clipPath id="c3"><use href="#p2"/></clipPath>
<linearGradient id="g4" x1="0" y1="0" x2="1" y2="0.25"><stop offset="0.45" stop-color="#1A1030" stop-opacity="0"/><stop offset="1" stop-color="#1A1030" stop-opacity="0.3"/></linearGradient>
<path id="p5" d="M56 112 A44 44 0 1 0 144 112 A44 44 0 1 0 56 112 Z"/>
<clipPath id="c6"><use href="#p2"/></clipPath>
<clipPath id="c7"><use href="#p5"/></clipPath>
</defs>
<g id="sprite" filter="url(#outline)">
<g id="body"><g transform="translate(100 100) scale(0.62) translate(-100 -100)">
