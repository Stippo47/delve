<!-- SNOWMAN take A (round 4): two packed-snow balls seen straight from above, the head sitting right on top of the body so it stands upright (the round-3 one leaned forward), a plain black top hat seen from above (a round crown on a round brim, one red band), two lumps of coal for eyes, a carrot nose pointing forward, a red scarf with one end blowing back, stick arms. About 110% of the archer. Parts: #arm-l, #arm-r = the stick arms (pivot where they go into the body, before #body), #body = everything else. Facing = DOWN (+y), centre (100,100). -->
