<!-- MIMIC (round 4): the game's own chest from above (rounded brown box, a gold band across the middle, a gold lock), so it looks like the real chest until it bites. The band is where it opens: the lid and the box part along it into a wide mouth with teeth on both lips, two yellow eyes glowing inside, and a fat tongue that grows out of the back of the mouth and lolls forward over the front of the box. Parts: #body = chest, mouth, teeth, eyes; #arm-r = the tongue (pivot at its root inside the mouth, so it can lash; drawn after #body so its root shows in the mouth). Facing = DOWN (+y), centre (100,100). -->
