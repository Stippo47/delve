<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GHOST (round 4, tail take B "trail"): the round-3 sheet ghost; the sheet tapers behind the head and breaks up into a trail of three shrinking puffs, like smoke left behind as it drifts. Round head at the front, two dark eyes and an "oo" mouth, two little sheet-arm nubs reaching forward. Parts: #arm-l, #arm-r = the nubs (pivot at the sheet sides, before #body), #body = the sheet and tail (sway the tail by skewing #body). Facing = DOWN (+y), centre (100,100). -->
<defs>
<filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="gSheet" x1="50" y1="20" x2="150" y2="160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DEDDF2"/></linearGradient><linearGradient id="shX" x1="96" y1="0" x2="152" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5A5C9A" stop-opacity="0"/><stop offset="1" stop-color="#5A5C9A" stop-opacity="0.36"/></linearGradient><linearGradient id="shTail" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5A5C9A" stop-opacity="0.32"/><stop offset="1" stop-color="#5A5C9A" stop-opacity="0"/></linearGradient><radialGradient id="gDome" cx="90" cy="112" r="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient><linearGradient id="gNub" x1="28" y1="0" x2="66" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCDBF0"/></linearGradient><linearGradient id="gNubR" x1="28" y1="0" x2="66" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9C8E6"/><stop offset="1" stop-color="#D9D8EE"/></linearGradient>
<path id="tail" d="M146 120 C159.6 116 139.1 103.4 135.7 96 C132.2 88.6 128.4 81.4 125.3 75.3 C122.2 69.3 123.2 63.1 116.9 59.9 C110.5 56.7 94.1 54 87.1 56.1 C80.1 58.3 78.5 66 74.7 72.7 C70.9 79.3 67.8 88.1 64.3 96 C60.9 103.9 40.4 116 54 120 C67.6 124 132.4 124 146 120 Z M88 54 A15 15 0 1 0 118 54 A15 15 0 1 0 88 54 Z M78 30 A10 10 0 1 0 98 30 A10 10 0 1 0 78 30 Z M101 12 A7 7 0 1 0 115 12 A7 7 0 1 0 101 12 Z"/><path id="head" d="M53 118 A47 47 0 1 0 147 118 A47 47 0 1 0 53 118 Z"/><clipPath id="sheetC"><use href="#tail"/><use href="#head"/></clipPath>
</defs>
<g id="sprite" filter="url(#outline)">
<g id="arm-l" data-pivot="62 112"><g>
<path d="M64 104 C50 106 36 116 31 132 C30 138 36 141 42 140 C52 138 60 134 66 128 Z" fill="url(#gNub)" stroke="url(#gNub)" stroke-width="4" stroke-linejoin="round"/>
</g></g>
<g id="arm-r" data-pivot="138 112"><g>
<g transform="translate(200 0) scale(-1 1)"><path d="M64 104 C50 106 36 116 31 132 C30 138 36 141 42 140 C52 138 60 134 66 128 Z" fill="url(#gNubR)" stroke="url(#gNubR)" stroke-width="4" stroke-linejoin="round"/></g>
</g></g>
<g id="body"><g>
<rect x="-10" y="-10" width="220" height="220" fill="url(#gSheet)" clip-path="url(#sheetC)"/>
<g clip-path="url(#sheetC)"><rect x="30" y="-10" width="140" height="106" fill="url(#shTail)"/><rect x="30" y="-10" width="140" height="180" fill="url(#shX)"/><circle cx="96" cy="118" r="60" fill="url(#gDome)"/></g>
<path d="M78.5 136 A7.5 10 0 1 0 93.5 136 A7.5 10 0 1 0 78.5 136 Z" fill="#2B2230"/>
<path d="M106.5 136 A7.5 10 0 1 0 121.5 136 A7.5 10 0 1 0 106.5 136 Z" fill="#2B2230"/>
<path d="M95 153 A5 5.5 0 1 0 105 153 A5 5.5 0 1 0 95 153 Z" fill="#2B2230"/>
</g></g>
</g>
</svg>
