<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- PEDESTAL (the choice room's): a short round stone plinth seen from above and a little in front, a violet cushion with a gold trim on top; the game floats the reward over the cushion (cushion centre at SVG 100,77). 40 room units wide (100 SVG units). Stays upright on screen. -->
  <defs>
    <filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gPedTop" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#D9CEBB"/><stop offset="1" stop-color="#A99B86"/></linearGradient>
    <linearGradient id="gPedSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A39581"/><stop offset="0.5" stop-color="#8C7F6C"/><stop offset="1" stop-color="#6E6252"/></linearGradient>
    <radialGradient id="gCush" cx="0.38" cy="0.34" r="0.75"><stop offset="0" stop-color="#C9B2F2"/><stop offset="1" stop-color="#7E5EC0"/></radialGradient>
    <linearGradient id="gGoldP" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FAD06A"/><stop offset="1" stop-color="#D9952A"/></linearGradient>
  </defs>
  <g id="sprite" filter="url(#outline)">
    <path d="M50 126 A50 24 0 0 0 150 126 V138 A50 24 0 0 1 50 138 Z" fill="url(#gPedSide)"/>
    <ellipse cx="100" cy="126" rx="50" ry="24" fill="url(#gPedTop)"/>
    <path d="M72 82 V118 A28 12 0 0 0 128 118 V82 Z" fill="url(#gPedSide)"/>
    <ellipse cx="100" cy="122" rx="30" ry="10" fill="#2B2230" opacity="0.2"/>
    <path d="M72 82 V118 A28 12 0 0 0 128 118 V82 Z" fill="url(#gPedSide)"/>
    <path d="M60 78 A40 20 0 0 0 140 78 V88 A40 20 0 0 1 60 88 Z" fill="url(#gPedSide)"/>
    <ellipse cx="100" cy="78" rx="40" ry="20" fill="url(#gPedTop)"/>
    <ellipse cx="100" cy="77" rx="30" ry="14" fill="url(#gCush)"/>
    <path d="M70 77 A30 14 0 0 0 130 77" fill="none" stroke="url(#gGoldP)" stroke-width="3"/>
    <circle cx="70" cy="78" r="3.4" fill="url(#gGoldP)"/><circle cx="130" cy="78" r="3.4" fill="url(#gGoldP)"/><circle cx="100" cy="91" r="3.4" fill="url(#gGoldP)"/>
    <ellipse cx="90" cy="70" rx="10" ry="3.5" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>
