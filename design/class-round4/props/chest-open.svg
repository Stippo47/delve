<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- CHEST, open: the lid stands up behind the box (its dark inside showing), the box full of gold coins and a ruby, a warm glow and three sparkles over it. #glow has no outline; the game can fade it. 48 room units wide. Stays upright on screen. -->
  <defs>
    <filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A86E3C"/><stop offset="0.38" stop-color="#D99E60"/><stop offset="1" stop-color="#8E5A30"/></linearGradient>
    <linearGradient id="gWoodDk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E5A30"/><stop offset="1" stop-color="#6E4222"/></linearGradient>
    <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FAD06A"/><stop offset="1" stop-color="#D9952A"/></linearGradient>
    <linearGradient id="gBrass" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#E0A82A"/></linearGradient>
    <linearGradient id="shX" x1="96" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2B1A10" stop-opacity="0"/><stop offset="1" stop-color="#2B1A10" stop-opacity="0.32"/></linearGradient>
    <path id="lid" d="M56 40 H144 A18 18 0 0 1 162 58 V112 H38 V58 A18 18 0 0 1 56 40 Z"/>
    <clipPath id="lidC"><use href="#lid"/></clipPath>
    <path id="front" d="M44 108 H156 V148 A10 10 0 0 1 146 158 H54 A10 10 0 0 1 44 148 Z"/>
    <clipPath id="frontC"><use href="#front"/></clipPath>
    <radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF4C8" stop-opacity="0.95"/><stop offset="0.45" stop-color="#FFE08A" stop-opacity="0.55"/><stop offset="1" stop-color="#FFD45A" stop-opacity="0"/></radialGradient>
    <linearGradient id="gCoin" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E09A2A"/></linearGradient>
    <linearGradient id="gCav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2016"/><stop offset="1" stop-color="#5A341E"/></linearGradient>
    <path id="lidUp" d="M50 14 H150 A12 12 0 0 1 162 26 V52 H38 V26 A12 12 0 0 1 50 14 Z"/>
    <clipPath id="lidUpC"><use href="#lidUp"/></clipPath>
    <path id="cav" d="M60 56 H140 A6 6 0 0 1 146 62 V96 A6 6 0 0 1 140 102 H60 A6 6 0 0 1 54 96 V62 A6 6 0 0 1 60 56 Z"/>
    <clipPath id="cavC"><use href="#cav"/></clipPath>
  </defs>
  <g id="sprite" filter="url(#outline)">
    <use href="#lidUp" fill="#7A4A26"/>
    <g clip-path="url(#lidUpC)">
      <rect x="36" y="12" width="130" height="10" fill="url(#gBand)"/>
      <rect x="56" y="12" width="12" height="44" fill="url(#gBand)" opacity="0.8"/>
      <rect x="132" y="12" width="12" height="44" fill="url(#gBand)" opacity="0.8"/>
      <rect x="36" y="12" width="130" height="44" fill="url(#shX)"/>
    </g>
    <use href="#front" fill="url(#gWoodDk)"/>
    <g clip-path="url(#frontC)"><rect x="56" y="20" width="12" height="150" fill="url(#gBand)"/><rect x="132" y="20" width="12" height="150" fill="url(#gBand)"/><rect x="36" y="108" width="130" height="52" fill="url(#shX)"/></g>
    <path d="M44 46 H156 V110 H44 Z" fill="#B9824C"/>
