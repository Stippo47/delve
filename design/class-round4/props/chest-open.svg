      <circle cx="66" cy="92" r="9" fill="url(#gCoin)"/><circle cx="63.3" cy="89.3" r="3.1" fill="#FFF6CC" opacity="0.8"/><circle cx="80" cy="86" r="10" fill="url(#gCoin)"/><circle cx="77.0" cy="83.0" r="3.5" fill="#FFF6CC" opacity="0.8"/><circle cx="96" cy="90" r="10" fill="url(#gCoin)"/><circle cx="93.0" cy="87.0" r="3.5" fill="#FFF6CC" opacity="0.8"/><circle cx="112" cy="84" r="10" fill="url(#gCoin)"/><circle cx="109.0" cy="81.0" r="3.5" fill="#FFF6CC" opacity="0.8"/><circle cx="128" cy="90" r="9" fill="url(#gCoin)"/><circle cx="125.3" cy="87.3" r="3.1" fill="#FFF6CC" opacity="0.8"/><circle cx="90" cy="76" r="9" fill="url(#gCoin)"/><circle cx="87.3" cy="73.3" r="3.1" fill="#FFF6CC" opacity="0.8"/><circle cx="108" cy="72" r="9" fill="url(#gCoin)"/><circle cx="105.3" cy="69.3" r="3.1" fill="#FFF6CC" opacity="0.8"/><circle cx="124" cy="76" r="8" fill="url(#gCoin)"/><circle cx="121.6" cy="73.6" r="2.8" fill="#FFF6CC" opacity="0.8"/><circle cx="74" cy="74" r="8" fill="url(#gCoin)"/><circle cx="71.6" cy="71.6" r="2.8" fill="#FFF6CC" opacity="0.8"/><circle cx="100" cy="100" r="9" fill="url(#gCoin)"/><circle cx="97.3" cy="97.3" r="3.1" fill="#FFF6CC" opacity="0.8"/><circle cx="136" cy="100" r="8" fill="url(#gCoin)"/><circle cx="133.6" cy="97.6" r="2.8" fill="#FFF6CC" opacity="0.8"/><circle cx="62" cy="102" r="8" fill="url(#gCoin)"/><circle cx="59.6" cy="99.6" r="2.8" fill="#FFF6CC" opacity="0.8"/>
      <path d="M96 62 L104 62 L108 68 L100 76 L92 68 Z" fill="#E0604B"/><path d="M96 62 L100 62 L100 76 L92 68 Z" fill="#FF9A86"/>
    </g>
    <rect x="86" y="110" width="28" height="22" rx="5" fill="url(#gBrass)"/>
    <rect x="86" y="110" width="28" height="5" rx="2.5" fill="#FFF3C4" opacity="0.6"/>
  </g>
  <g id="glow">
    <ellipse cx="100" cy="76" rx="78" ry="54" fill="url(#gGlow)" opacity="0.75"/>
    <path d="M70 55 L72.52 61.48 L79 64 L72.52 66.52 L70 73 L67.48 66.52 L61 64 L67.48 61.48 Z" fill="#FFFFFF"/><path d="M132 63 L133.96 68.04 L139 70 L133.96 71.96 L132 77 L130.04 71.96 L125 70 L130.04 68.04 Z" fill="#FFFFFF"/><path d="M112 34 L113.68 38.32 L118 40 L113.68 41.68 L112 46 L110.32 41.68 L106 40 L110.32 38.32 Z" fill="#FFFFFF"/>
  </g>
</svg>
