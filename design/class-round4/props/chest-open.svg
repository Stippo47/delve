    <rect x="132" y="46" width="12" height="64" fill="url(#gBand)"/>
    <rect x="44" y="46" width="112" height="64" fill="url(#shX)"/>
    <use href="#cav" fill="url(#gCav)"/>
    <g clip-path="url(#cavC)">
