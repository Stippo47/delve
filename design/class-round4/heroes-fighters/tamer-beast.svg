<clipPath id="c2"><use href="#s2"/></clipPath>
<path id="s3" d="M 67 104 A 9 9 0 1 0 85 104 A 9 9 0 1 0 67 104 Z"/>
<path id="s4" d="M 115 104 A 9 9 0 1 0 133 104 A 9 9 0 1 0 115 104 Z"/>
