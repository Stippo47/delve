<linearGradient id="g3" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#F9EBD8"/><stop offset="1" stop-color="#EDC07E"/></linearGradient>
<linearGradient id="g4" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#AB6C13" stop-opacity="0"/><stop offset="1" stop-color="#AB6C13" stop-opacity="0.42"/></linearGradient>
<path id="s6" d="M 115 104 A 9 9 0 1 0 133 104 A 9 9 0 1 0 115 104 Z"/>
