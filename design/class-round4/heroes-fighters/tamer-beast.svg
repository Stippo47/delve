<linearGradient id="g5" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#FCF7EE"/><stop offset="1" stop-color="#EFCA90"/></linearGradient>
<linearGradient id="g6" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B47615" stop-opacity="0"/><stop offset="1" stop-color="#B47615" stop-opacity="0.42"/></linearGradient>
<path id="s9" d="M 95 134 A 5 3.5 0 1 0 105 134 A 5 3.5 0 1 0 95 134 Z"/>
