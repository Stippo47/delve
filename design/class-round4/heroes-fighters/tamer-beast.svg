<use href="#s9" fill="url(#g7)"/>
<ellipse cx="88" cy="122" rx="3.5" ry="4.5" fill="#2B2230"/><ellipse cx="112" cy="122" rx="3.5" ry="4.5" fill="#2B2230"/>
</g>
<g id="arm-l" data-pivot="82 110"><!-- front paw -->
<g clip-path="url(#u10)"><use href="#s10" transform="translate(0 3) " fill="#2B2230" opacity="0.3"/></g><use href="#s10" fill="url(#g1)"/><use href="#s10" fill="url(#g2)"/>
</g>
<g id="arm-r" data-pivot="118 110"><!-- front paw -->
<g clip-path="url(#u11)"><use href="#s11" transform="translate(0 3) " fill="#2B2230" opacity="0.3"/></g><use href="#s11" fill="url(#g1)"/><use href="#s11" fill="url(#g2)"/>
</g>
</g>
