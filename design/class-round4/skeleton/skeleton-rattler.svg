<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- Round 4: the lower jaw is its own bone below the skull with a dark gap between; the sword claw is turned to the grip (knuckles down the handle) | was: SKELETON round 3 "Rattler": closed grin, jaw shut, no collarbones (no rib-cage read). Parts in draw order: #arm-r (rusty notched sword + claw; drawn first so it sits behind the shoulder and skull), #body (skull + shoulder balls), #arm-l (empty claw). Outline from the #outline filter. Facing = DOWN (+y), centre (100,100). -->
