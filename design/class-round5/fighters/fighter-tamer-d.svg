<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- FIGHTER Beast tamer D, the drake keeper: a dungeon handler in black leather with a studded iron collar guard, a shaved head with a short dark crest and a scarred iron half-helm band, heavy gauntlets. A chain whip (iron links, a barbed tip). Beasts: tamer-d-drake.svg, tamer-d-beetle.svg. The whip is two parts: arm-r holds the handle (fist on it), and #whip is the lash on its own, its data-pivot at the tip of the handle (the knot), so the game can pin it to the hand and crack it: swing it out from the pivot and snap it back, or stretch it toward the target. Left hand free (arm-l). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
