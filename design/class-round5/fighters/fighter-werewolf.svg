<!-- FIGHTER Werewolf (round 5, redo): a wolf seen from above in the house style: a round furry skull, big ears laid back, a long snout forward with a pale muzzle, a dark nose and two white fangs, a shaggy ruff over hunched shoulders, rags of the red shirt. No eyes (the snout and ears carry the read). No weapon: two big furry paws with white claws held forward (arm-l, arm-r, after #body). The human form is fighter-werewolf-human.svg. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
