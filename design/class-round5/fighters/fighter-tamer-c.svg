<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- FIGHTER Beast tamer C, the steppe rider: a tall red felt cap with a wide fur brim and a tassel, a blue quilted coat with a fur collar, long black hair in two braids behind, a drooping moustache. A long braided leather whip. Beasts: tamer-c-wolf.svg, tamer-c-sabretooth.svg. The whip is two parts: arm-r holds the handle (fist on it), and #whip is the lash on its own, its data-pivot at the tip of the handle (the knot), so the game can pin it to the hand and crack it: swing it out from the pivot and snap it back, or stretch it toward the target. Left hand free (arm-l). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
