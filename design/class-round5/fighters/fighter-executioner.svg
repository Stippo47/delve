<!-- FIGHTER Executioner (round 5, new): a hulking headsman with broad bare shoulders, a leather harness strap and a studded belt; a black leather hood over the whole head, its tip flopping back, open at the lower face (a grim jaw with stubble, no eye holes). A huge bearded axe in the right hand (arm-r, before #body: the haft runs under the shoulder, the broad blade out forward and to the side); left hand free (arm-l). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
