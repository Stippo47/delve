<!-- RANGED Harpooner (round 5): the beard that read as a nose is gone; a big puffy grey moustache instead; a proper yellow sou'wester built like the farmers' hat (short brim in front, long flap behind, low crown, stitching rings); navy knit sweater. A barbed harpoon in the right hand (arm-r, drawn before #body) with its rope tied to the shaft, and a coil of rope in the left hand (arm-l). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
