<!-- RANGED Grenadier (round 5; the moustache and the bomb kept): a tall blue grenadier's mitre cap seen from above, its brass front plate stamped with a flaming bomb and a red tuft on top; a red coat with white crossbelts and a bandolier of little bombs over the left shoulder; the big handlebar moustache. A lit bomb cupped in the right hand (arm-r, drawn before #body), left hand free (arm-l). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
