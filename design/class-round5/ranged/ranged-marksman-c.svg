<!-- RANGED Marksman C, the frontier rifleman: a brown wide-brim hat with the sides curled up and a dented crown, the cream plume in the hatband; a red neckerchief, a tan duster. A lever rifle with a brass frame at the right shoulder (arm-r, after #body), both fists on it. arm-l left out. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
