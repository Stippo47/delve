<!-- RANGED Pirate (round 5): the beard no longer makes a nose and a smile; a separate puffy black moustache like the harpooner's over a short chin beard. Black tricorn with gold edging, burgundy coat with gold epaulettes; cutlass in the left hand, flintlock in the right, both arms before #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
