<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- SKELETON round 2 "Gaper": hunched scavenger. Long narrow skull pushed forward, the lower jaw hanging open and loose, a few vertebrae trailing behind, coat-hanger collarbones with knobbed ends. Spear held in both hands, so both hands and the spear are in #arm-r and there is no #arm-l. #back = the trailing vertebrae. The outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). -->
