<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- R3 attempt 1: r2 attempt-1 DESIGN (split leaf hood with side veins, two rows of swept petals, round gold
       brim, tapered flatbow with dark tips + leather grip, rounded-rect hands) in r2 attempt-2 RENDERING
       (one heavy outer silhouette, no inner lines, soft gradients, contact shadows). No lining ring in the
       opening: gold brim goes straight to the face. Facing = DOWN (+y). Rotate whole sprite around (100,100). -->
  <defs>
    <path id="hood" d="M100 14 C118 32 150 56 159 92 C166 124 146 153 100 155 C54 153 34 124 41 92 C50 56 82 32 100 14 Z"/>
    <clipPath id="hoodClip"><use href="#hood"/></clipPath>
    <path id="pBackL" d="M60 96 C34 88 12 104 8 134 C28 140 52 128 70 112 Z"/>
    <path id="pBackR" d="M140 96 C166 88 188 104 192 134 C172 140 148 128 130 112 Z"/>
    <path id="pFrontL" d="M52 112 C30 114 18 134 22 158 C44 156 66 142 76 126 Z"/>
    <path id="pFrontR" d="M148 112 C170 114 182 134 178 158 C156 156 134 142 124 126 Z"/>
    <clipPath id="petalsClip"><use href="#pBackL"/><use href="#pBackR"/><use href="#pFrontL"/><use href="#pFrontR"/></clipPath>
    <path id="brim" d="M50 134 C50 108 66 99 86 96 C93 95 96 90 98 81 Q100 75 102 81 C104 90 107 95 114 96 C134 99 150 108 150 134 C148 152 130 160 100 160 C70 160 52 152 50 134 Z"/>
    <clipPath id="brimClip"><use href="#brim"/></clipPath>
    <path id="open" d="M62 132 C64 101 136 101 138 132 C134 151 66 151 62 132 Z"/>
    <clipPath id="openClip"><use href="#open"/></clipPath>
    <path id="bow" d="M28 146 C37 178 70 192 100 192 C130 192 163 178 172 146 L165 144 C154 169 128 181 100 181 C72 181 46 169 35 144 Z"/>
    <clipPath id="bowClip"><use href="#bow"/></clipPath>
    <g id="quiverShape" transform="rotate(28 138 52)"><path transform="translate(138 28) rotate(0)" d="M0 0 C-8.5 -4 -10.0 -17.6 -4.7 -29 Q0 -35 4.7 -29 C10.0 -17.6 8.5 -4 0 0 Z"/><path transform="translate(138 28) rotate(0)" d="M0 6 V-4" stroke-width="13"/><path transform="translate(130 31) rotate(-13)" d="M0 0 C-8.5 -4 -10.0 -15.4 -4.7 -25 Q0 -31 4.7 -25 C10.0 -15.4 8.5 -4 0 0 Z"/><path transform="translate(130 31) rotate(-13)" d="M0 6 V-4" stroke-width="13"/><path transform="translate(146 31) rotate(13)" d="M0 0 C-8.5 -4 -10.0 -15.4 -4.7 -25 Q0 -31 4.7 -25 C10.0 -15.4 8.5 -4 0 0 Z"/><path transform="translate(146 31) rotate(13)" d="M0 6 V-4" stroke-width="13"/><rect x="118" y="30" width="40" height="48" rx="11"/><rect x="115" y="25" width="46" height="11" rx="5"/></g>
    <path id="shadeR" d="M100 -10 V220 H220 V-10 Z"/>

    <linearGradient id="gLit" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#80C473"/><stop offset="1" stop-color="#66AD5F"/>
    </linearGradient>
    <linearGradient id="gShade" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4C8C4F"/><stop offset="1" stop-color="#376E3D"/>
    </linearGradient>
    <linearGradient id="gPetalLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5DA458"/><stop offset="1" stop-color="#3F8046"/>
    </linearGradient>
    <linearGradient id="gPetalShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43854A"/><stop offset="1" stop-color="#2F6637"/>
    </linearGradient>
    <linearGradient id="gPetalBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6636"/><stop offset="1" stop-color="#234D29"/>
    </linearGradient>
    <linearGradient id="gBrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9CB5C"/><stop offset="1" stop-color="#E8A030"/>
    </linearGradient>
    <linearGradient id="gFace" x1="0" y1="101" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A6250"/>
      <stop offset="0.36" stop-color="#C98E6C"/>
      <stop offset="0.62" stop-color="#F2C7A0"/>
      <stop offset="1" stop-color="#F6D0AC"/>
    </linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D0935A"/><stop offset="0.5" stop-color="#B57944"/><stop offset="1" stop-color="#94602F"/>
    </linearGradient>
    <linearGradient id="gQuiver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B57944"/><stop offset="1" stop-color="#8A552C"/>
    </linearGradient>
    <linearGradient id="gGrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A44A39"/><stop offset="1" stop-color="#7A3227"/>
    </linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E6EB"/><stop offset="1" stop-color="#9AA2AE"/>
    </linearGradient>
    <radialGradient id="gHand" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#F8D4B2"/><stop offset="1" stop-color="#DFA57F"/>
    </radialGradient>
    <radialGradient id="gClasp" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#B8E59A"/><stop offset="1" stop-color="#7DBB66"/>
    </radialGradient>
  </defs>

  <!-- ===== heavy outer silhouette ===== -->
  <g fill="#2B2230" stroke="#2B2230" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <use href="#hood"/><use href="#brim"/>
  </g>

  <!-- hood on a soft contact shadow -->
  <use href="#hood" fill="#24502B" transform="translate(0 3)"/>
  <use href="#hood" fill="url(#gLit)"/>
  <g clip-path="url(#hoodClip)">
    <use href="#shadeR" fill="url(#gShade)"/>
    <path d="M100 18 C97 42 97 68 100 92 C101 68 102 42 100 18 Z" fill="#3F7C46" opacity="0.6"/>
    <g fill="none" stroke-width="3.5" stroke-linecap="round">
      <path d="M99 64 C90 58 82 50 77 41" stroke="#5A9F56" opacity="0.9"/>
      <path d="M101 64 C110 58 118 50 123 41" stroke="#3F7C46" opacity="0.8"/>
      <path d="M99 88 C86 82 74 72 67 60" stroke="#5A9F56" opacity="0.9"/>
      <path d="M101 88 C114 82 126 72 133 60" stroke="#3F7C46" opacity="0.8"/>
    </g>
  </g>

  <!-- brim -->
  <use href="#brim" fill="#2B2230" opacity="0.25" transform="translate(0 2)"/>
  <use href="#brim" fill="url(#gBrim)"/>
  <g clip-path="url(#brimClip)"><use href="#shadeR" fill="#D9952A" opacity="0.55"/></g>

  <!-- face: straight from brim to face, soft brim shadow, subtle nose hint -->
  <g clip-path="url(#openClip)">
    <use href="#open" fill="url(#gFace)"/>
    <path d="M100 96 H144 V156 H100 Z" fill="#8A4E36" opacity="0.14"/>
    <path d="M97 136 Q100 138.5 103 136" fill="none" stroke="#C98868" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  
</svg>