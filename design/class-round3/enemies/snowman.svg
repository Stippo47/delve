<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
  <!-- SNOWMAN (round 3 enemy), about 110% of the archer. Two stacked snowballs seen from above: the big body ball behind
       (up), the head ball in front (down) with a tin bucket on it, a red scarf where they meet, coal eyes and a carrot
       nose pointing forward. Stick arms out to the sides.
       Parts (file order = draw order): #arm-l, #arm-r = the stick arms (pivot where they go into the body ball; drawn
       before #body so the snow covers their ends), #body = body ball, scarf, head, bucket, face, carrot.
       The outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). -->
  <defs>
    <filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <circle id="ball" cx="100" cy="80" r="64"/>
    <clipPath id="ballC"><use href="#ball"/></clipPath>
    <circle id="head" cx="100" cy="124" r="42"/>
    <clipPath id="headC"><use href="#head"/></clipPath>
    <path id="scarf" d="M100 72 C130 72 152 94 152 122 L136 124 C136 102 120 88 100 88 C80 88 64 102 64 124 L48 122 C48 94 70 72 100 72 Z"/>
    <path id="scarfTail" d="M128 84 C140 76 152 66 160 52 L172 60 C164 76 150 90 136 98 Z"/>
    <circle id="rim" cx="100" cy="112" r="30"/>
    <clipPath id="rimC"><use href="#rim"/></clipPath>
    <clipPath id="underHead"><use href="#ball"/><use href="#scarf"/><use href="#scarfTail"/></clipPath>
    <clipPath id="underRim"><use href="#head"/></clipPath>
    <clipPath id="underNose"><use href="#head"/></clipPath>
    <radialGradient id="gSnow" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#EEF3FA"/><stop offset="1" stop-color="#C9D5E8"/></radialGradient>
    <linearGradient id="shX" x1="96" y1="0" x2="166" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5B6F9E" stop-opacity="0"/><stop offset="1" stop-color="#5B6F9E" stop-opacity="0.34"/></linearGradient>
    <linearGradient id="gScarf" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#E8574A"/><stop offset="1" stop-color="#B83434"/></linearGradient>
    <linearGradient id="gTin" x1="70" y1="0" x2="130" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9D3DD"/><stop offset="1" stop-color="#7E8C9C"/></linearGradient>
    <linearGradient id="gTinTop" x1="80" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#AEBACA"/><stop offset="1" stop-color="#6E7C8E"/></linearGradient>
    <linearGradient id="gCarrot" x1="92" y1="0" x2="108" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFA24A"/><stop offset="1" stop-color="#DA6A22"/></linearGradient>
    <linearGradient id="gStick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A6A40"/><stop offset="1" stop-color="#6E4628"/></linearGradient>
  </defs>
  <g id="sprite" filter="url(#outline)">
    <g id="arm-l" data-pivot="44 96">
      <g fill="none" stroke="#8A5A34" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 96 L4 116" stroke-width="7"/>
        <path d="M24 107 L12 94" stroke-width="5"/>
        <path d="M14 112 L6 128" stroke-width="5"/>
      </g>
    </g>
    <g id="arm-r" data-pivot="156 96">
      <g fill="none" stroke="#6E4628" stroke-linecap="round" stroke-linejoin="round">
        <path d="M150 96 L196 116" stroke-width="7"/>
        <path d="M176 107 L188 94" stroke-width="5"/>
        <path d="M186 112 L194 128" stroke-width="5"/>
      </g>
    </g>
    <g id="body">
      <use href="#ball" fill="url(#gSnow)"/>
      <use href="#ball" fill="url(#shX)" clip-path="url(#ballC)"/>
      <!-- scarf round the neck, one end blowing back over the body -->
      <use href="#scarfTail" fill="url(#gScarf)"/>
      <path d="M150 66 L162 74 M144 74 L156 82" stroke="#F2D27A" stroke-width="3" opacity="0.8"/>
      <use href="#scarf" fill="url(#gScarf)"/>
      <g transform="translate(0 4)">
      <!-- head ball -->
      <g clip-path="url(#underHead)"><use href="#head" fill="#2B2230" opacity="0.28" transform="translate(0 5)"/></g>
      <use href="#head" fill="url(#gSnow)"/>
      <g clip-path="url(#headC)">
        <rect x="96" y="80" width="50" height="90" fill="url(#shX)"/>
        <!-- coal eyes -->
        <ellipse cx="85" cy="150" rx="5.4" ry="5" fill="#3A3238"/>
        <ellipse cx="115" cy="150" rx="5.4" ry="5" fill="#3A3238"/>
        <!-- bucket shadow -->
        <use href="#rim" fill="#2B2230" opacity="0.26" transform="translate(0 6)"/>
      </g>
      <!-- tin bucket, upside down: rolled rim, sloping wall with ridges, flat bottom on top, handle lugs at the sides -->
      <use href="#rim" fill="#DCE3EA"/>
      <circle cx="100" cy="111" r="27" fill="url(#gTin)"/>
      <path d="M118.4 110.9 L126.1 118.0 M113.4 119.4 L119.1 130.1 M104.9 124.4 L107.0 137.1 M95.1 124.4 L93.0 137.1 M86.6 119.4 L80.9 130.1 M81.6 110.9 L73.9 118.0 M81.6 101.1 L73.9 104.0 M86.6 92.6 L80.9 91.9 M95.1 87.6 L93.0 84.9 M104.9 87.6 L107.0 84.9 M113.4 92.6 L119.1 91.9 M118.4 101.1 L126.1 104.0" stroke="#5E6C7E" stroke-width="2.4" opacity="0.45"/>
      <circle cx="100" cy="106" r="19" fill="#9AA7B6"/>
      <circle cx="100" cy="106" r="19" fill="url(#shX)"/>
      <circle cx="71" cy="114" r="4.5" fill="#6E7C8E"/>
      <circle cx="129" cy="114" r="4.5" fill="#5E6C7E"/>
      <!-- carrot nose -->
      <path d="M93 152 C96 150 104 150 107 152 L101.5 194 C101 196 99 196 98.5 194 Z" fill="url(#gCarrot)"/>
      <path d="M95 162 L100 163 M96 172 L101 173 M97 182 L101 183" stroke="#B85A1C" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
