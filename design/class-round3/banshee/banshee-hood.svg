  <!-- BANSHEE round 3 (hood): floating ghost built on the Hollow skull (big deep sockets), a ragged hood over the dome, the face showing in its opening, a tattered body trailing off behind (up) in five wisps, no legs. Arms reach forward: ragged sleeves with long bony fingers. Draw order: #body (wisps, torso, skull, hood), #arm-l, #arm-r (each a sleeve + bony hand). Facing = DOWN (+y), centre (100,100). -->
