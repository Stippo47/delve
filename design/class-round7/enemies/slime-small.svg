<!-- SLIME, small (round 5): the round-4 cube slime with its drips turned 180 degrees (they now trail behind it, so it reads as moving forward) and no eyes. A soft rounded cube of jelly lit from the left, one soft shine. Scaled 0.66. Parts: #body only (the game squashes it whole). Front = DOWN (+y). -->
