<!-- LIZARDMAN B "desert blade" (round 6, version a: the round-4 design without eyes; was round 4 variant). A sand lizard: tan scales with dark brown bands across the back of the head and shoulders, a shorter wedge snout, a red cloth sash lying over the left shoulder, an upper arm rounding out from under each side of the head (round 7). A scimitar whose blade curves IN toward the centre line (the round-3 one curved out). Parts: #back = tail, #arm-r = scimitar + fist (before #body), #body, #arm-l = empty claw. Facing = DOWN (+y), centre (100,100). -->
