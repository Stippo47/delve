<!-- THE WARLOCK'S DEMON FORM (round 12): the Warlock with the imp in him, his own bust turned demon (the game washed his sprite red and drew horns and a sword in code): red skin, two fangs, his slicked hair with its widow's peak, his two horns grown long and heavy, torn bat wings behind (#back, sways), his dark coat with the magenta edge; the great demonic sword in the right fist (arm-r, under the shoulder): a black blade with a burning red core. Left hand free. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
