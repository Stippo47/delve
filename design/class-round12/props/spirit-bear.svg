<!-- SPIRIT BEAR (the Shaman's ancestor spirit; round 12): a bear seen from above, head forward, in the ancestors' pale blue, the spirits' swirl on its back. The game draws it see-through. One of three in one style. One part (#body) unless said. Front = DOWN (+y), centre (100,100); the outline comes from the #outline filter. Drawn at 0.848 of the box (each part carries the scale; pivots are in the box's own frame), so its outline is the heroes' weight: give the kind headR 66 (vr 26). -->
