<linearGradient id="g4" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7D6110" stop-opacity="0"/><stop offset="1" stop-color="#7D6110" stop-opacity="0.42"/></linearGradient>
