<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- HAY BALE (the Haymaker's; round 12): a rolled bale lying across its way, seen from above: straw wound round it, two bands of twine, shaggy ends. It rolls towards +y. One part (#body) unless said. Front = DOWN (+y), centre (100,100); the outline comes from the #outline filter. Give the kind headR 76 (vr 30). -->
