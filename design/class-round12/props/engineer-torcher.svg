<!-- TORCHER (the Engineer's tower; round 12): a flame thrower on the engineer's round wooden deck: a thick steel shield curved across its front, a dark nozzle with a pilot light poking through it, and behind, bare, its red fuel tank (strong from the front, weak from behind). Parts: #back (deck and feet), #top (the machine; it turns about its pivot). Front = DOWN (+y), centre (100,100). Drawn at 0.761 of the box (each part carries the scale; pivots are in the box's own frame), so its outline is the heroes' weight: give the kind headR 66 (vr 26). -->
