<!-- CLOCKWORK (round 12, take "windup"): the hero who bends time. a wind-up brass man: a brass head whose face is a clock face (the hands at twenty past eight make a moustache), copper shoulders with rivets, a big butterfly key in the back (#back, it can turn), brass fists; a clock hand for a sword in the right fist. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
