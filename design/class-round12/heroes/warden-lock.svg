<!-- WARDEN (round 12, take "lock"): the hero of shackles and restraints, who shuts powers off. a closed iron helm made like a padlock: a keyhole for a visor, glowing pale, and the lock's shackle arching over the back of the head; iron shoulders; a shackle on a chain in each fist (arm-l and arm-r: thrown and swung in turn). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
