<!-- THE MOB, the peasant with the dagger (round 12, set "kitchen"): a tin funnel for a hat, its spout up; sackcloth. One of four small peasants who are one hero together. The heroes' bust build drawn at 0.6 of a hero inside the usual box (each part carries the scale; pivots are in the box's own frame), so the outline is the heroes' weight at the heroes' scale: draw it with headR 34 and vr 13.2. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
