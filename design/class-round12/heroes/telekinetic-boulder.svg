<!-- TELEKINETIC (round 12, take "boulder"): the hero who moves things with the mind. a white blindfold tied over the upper face, dark hair in one long braid that floats up behind the head and curls over (#back, sways); a mustard robe; a boulder hanging in the air in front of the open right hand, a crescent of force under it (arm-r); the left hand open. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
