<!-- EARTH MAGE (round 12, take "spikes"): the mage of earthquakes, spikes and stone walls. a ring of rock spikes standing out all round the back of the shoulders (#back), russet hair tied up in a bun with a stone pin; a moss-green robe edged in sand; a carved standing stone for a staff in the right fist (behind the body), its runes amber; a stone over the open left fist. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
