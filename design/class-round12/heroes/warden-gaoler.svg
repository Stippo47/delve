<!-- WARDEN (round 12, take "gaoler"): the hero of shackles and restraints, who shuts powers off. an iron pot helm with a cage of three bars down over the face, round iron shoulder plates on dark leather; a great key held like a mace in the right fist (arm-r, under the shoulder), a shackle on a short chain hanging from the left fist (arm-l). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
