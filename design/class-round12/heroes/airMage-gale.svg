<!-- AIR MAGE (round 12, take "gale"): the mage of wind ("Whirled effect"). no hat: white hair blown hard to one side in three long locks, and a long scarf blown the same way (#back, sways); a mint robe; a pinwheel on a stick for a staff in the right fist, a little whirlwind over the open left fist. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
