<!-- AIR MAGE (round 12, take "swirl"): the mage of wind ("Whirled effect"). a white hood whose top is drawn up into a curl of wind, a spiral turning on it; a long scarf streaming back off one shoulder (#back, sways); a mint robe edged in white; a staff ending in a curl in the right fist (behind the body), a little whirlwind over the open left fist. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
