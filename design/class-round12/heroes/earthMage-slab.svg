<!-- EARTH MAGE (round 12, take "slab"): the mage of earthquakes, spikes and stone walls. a brown hood with a keystone and an amber gem on its brow, blunt columns of rock standing up off the shoulders; a clay-brown robe edged in sand; a staff with a rope-bound boulder for a head in the right fist (behind the body), a stone turning over the open left fist. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
