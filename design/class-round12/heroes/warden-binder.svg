<!-- WARDEN (round 12, take "binder"): the hero of shackles and restraints, who shuts powers off. a witch-finder's black hat (the farmers' hat as its base: a wide brim and a flat crown) with an iron band and a padlock for a buckle, chains crossed over the shoulders to a padlock under the chin; a man-catcher (a pole with a wide iron fork) in the right fist (behind the body); left hand free. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
