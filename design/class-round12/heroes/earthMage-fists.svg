<!-- EARTH MAGE (round 12, take "fists"): the mage of earthquakes, spikes and stone walls. a stone-shaper with a boulder for a cap (moss on it, amber crystals growing out of one side) and a big russet beard in two tied braids; each fist inside a great glove of rock (arm-l and arm-r: the hero pounds the ground with them in turn). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
