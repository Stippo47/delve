<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -80 360 360" width="360" height="360">
  <!-- DOOR OPEN, boss room behind: the passage glows #2B2230 and the light spills onto the floor. Seen from inside the room: the room is below (+y), outside is above. The room's edge (the wall's inner face) is the line y = 100, and the box centre (100,100) is the middle of the doorway on that line. 112 room units across (285 SVG units), the wall band 26 deep; the stone arch rises 16 room units past the wall's outer edge. Box 360 = 141.4 room units. #spill (no outline) is the light on the floor; the game can pulse it. Rotate the whole thing so +y points into the room. -->
  <defs>
    <filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gStone" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#B9AD9B"/><stop offset="1" stop-color="#857A6B"/></linearGradient>
    <linearGradient id="gStoneLt" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#D6CCBA"/><stop offset="1" stop-color="#A69985"/></linearGradient>
    <linearGradient id="gDoor" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#B07A48"/><stop offset="1" stop-color="#7E5230"/></linearGradient>
    <linearGradient id="gIron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A646F"/><stop offset="1" stop-color="#433D48"/></linearGradient>
    <path id="open" d="M-8 100 V44 C-8 6 40 -10 100 -10 C160 -10 208 6 208 44 V100 Z"/>
    <clipPath id="openC"><use href="#open"/></clipPath>
    <path id="frame" d="M-42 96 V40 C-42 -16 30 -42 100 -42 C170 -42 242 -16 242 40 V96 A8 8 0 0 1 234 104 H-34 A8 8 0 0 1 -42 96 Z"/>
    <clipPath id="frameC"><use href="#frame"/></clipPath>
    <radialGradient id="gPass" cx="0.5" cy="0.35" r="0.65"><stop offset="0" stop-color="#6B1F33"/><stop offset="0.55" stop-color="#1C1422"/><stop offset="1" stop-color="#231A28"/></radialGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E5E36"/><stop offset="1" stop-color="#5E3C22"/></linearGradient>
    <radialGradient id="gSpill" cx="100" cy="100" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2B2230" stop-opacity="0.42"/><stop offset="0.5" stop-color="#2B2230" stop-opacity="0.2"/><stop offset="1" stop-color="#2B2230" stop-opacity="0"/></radialGradient>
    <linearGradient id="gRay" x1="0" y1="100" x2="0" y2="270" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6B1F33" stop-opacity="0.5"/><stop offset="1" stop-color="#2B2230" stop-opacity="0"/></linearGradient>
    <clipPath id="roomC"><rect x="-80" y="100" width="360" height="180"/></clipPath>
  </defs>
  <g id="spill" clip-path="url(#roomC)">
    <ellipse cx="100" cy="100" rx="190" ry="180" fill="url(#gSpill)"/>
    <path d="M4 100 L40 100 L10 270 L-60 270 Z" fill="url(#gRay)" opacity="0.6"/><path d="M80 100 L120 100 L136 270 L64 270 Z" fill="url(#gRay)" opacity="0.6"/><path d="M160 100 L196 100 L260 270 L190 270 Z" fill="url(#gRay)" opacity="0.6"/><circle cx="60" cy="150" r="2.5" fill="#E0503A" opacity="0.7"/><circle cx="150" cy="176" r="2" fill="#E0503A" opacity="0.6"/><circle cx="104" cy="210" r="2.6" fill="#E0503A" opacity="0.5"/><circle cx="30" cy="196" r="1.8" fill="#E0503A" opacity="0.5"/>
  </g>
  <g id="sprite" filter="url(#outline)">
    <use href="#frame" fill="url(#gStone)"/>
    <g clip-path="url(#frameC)"><path d="M100 44 L-100 44 L-87.9 -24.4 Z" fill="#FFFFFF" opacity="0.13"/><path d="M100 44 L-53.2 -84.6 L-0 -129.2 Z" fill="#FFFFFF" opacity="0.13"/><path d="M100 44 L65.3 -153 L134.7 -153 Z" fill="#FFFFFF" opacity="0.13"/><path d="M100 44 L200 -129.2 L253.2 -84.6 Z" fill="#FFFFFF" opacity="0.13"/><path d="M100 44 L287.9 -24.4 L300 44 Z" fill="#FFFFFF" opacity="0.13"/><rect x="-50" y="48" width="50" height="22" fill="#FFFFFF" opacity="0.13"/><rect x="200" y="48" width="50" height="22" fill="#FFFFFF" opacity="0.13"/><rect x="-50" y="92" width="50" height="22" fill="#FFFFFF" opacity="0.13"/><rect x="200" y="92" width="50" height="22" fill="#FFFFFF" opacity="0.13"/><rect x="-50" y="70" width="50" height="22" fill="#2B2230" opacity="0.08"/><rect x="200" y="70" width="50" height="22" fill="#2B2230" opacity="0.08"/>
      <path d="M-42 104 V40 C-42 -16 30 -42 100 -42 C170 -42 242 -16 242 40 V104 H232 V40 C232 -8 168 -32 100 -32 C32 -32 -32 -8 -32 40 V104 Z" fill="#FFFFFF" opacity="0.12"/>
    </g>
    <path d="M86 -44 H114 L110 -6 H90 Z" fill="url(#gStoneLt)" stroke="url(#gStoneLt)" stroke-width="8" stroke-linejoin="round"/>
    <use href="#open" fill="url(#gPass)"/>
    <g clip-path="url(#openC)">
      <path d="M-8 100 V44 C-8 30 -4 20 2 12 L30 24 V100 Z" fill="url(#gLeaf)"/><path d="M208 100 V44 C208 30 204 20 198 12 L170 24 V100 Z" fill="url(#gLeaf)"/><rect x="-10" y="40" width="42" height="9" fill="url(#gIron)"/><rect x="168" y="40" width="42" height="9" fill="url(#gIron)"/><rect x="-10" y="76" width="42" height="9" fill="url(#gIron)"/><rect x="168" y="76" width="42" height="9" fill="url(#gIron)"/><circle cx="70" cy="30" r="3" fill="#E0503A" opacity="0.9"/><circle cx="126" cy="18" r="2.4" fill="#E0503A" opacity="0.8"/><circle cx="110" cy="60" r="2" fill="#E0503A" opacity="0.7"/><circle cx="84" cy="74" r="2.6" fill="#E0503A" opacity="0.8"/><circle cx="140" cy="50" r="2" fill="#E0503A" opacity="0.6"/>
      <path d="M-8 100 V44 C-8 6 40 -10 100 -10 C160 -10 208 6 208 44 V100 Z" fill="none" stroke="#2B2230" stroke-width="12" opacity="0.25"/>
    </g>
    <path d="M-37 92 H237 A9 9 0 0 1 246 101 V103 A9 9 0 0 1 237 112 H-37 A9 9 0 0 1 -46 103 V101 A9 9 0 0 1 -37 92 Z" fill="url(#gStoneLt)"/><path d="M-37.5 93 H237.5 A2.5 2.5 0 0 1 240 95.5 V95.5 A2.5 2.5 0 0 1 237.5 98 H-37.5 A2.5 2.5 0 0 1 -40 95.5 V95.5 A2.5 2.5 0 0 1 -37.5 93 Z" fill="#FFFFFF" opacity="0.3"/>
    
  </g>
</svg>
