<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- SCARAB (round 9): a scarab beetle seen from above in round 8's creature build: an iridescent green shell (teal-green going to blue at the back, a bright sheen) split down the middle into its two wing cases, a rounded shield behind its head, a small head with two curved mandibles, six short dark legs (the front pair in the arm parts, they jab when it bites). No eyes. The golden scarab is this art turned gold (js/dunes.js). Parts: #back (the four back legs), #arm-l / #arm-r (the front legs), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
