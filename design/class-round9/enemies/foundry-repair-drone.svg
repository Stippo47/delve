<!-- REPAIR DRONE (round 9): a small hovering drone seen from above: four rotors on short struts (pale blurred discs with two blades), a round steel shell with a yellow hazard stripe and a green work light on top, a wrench arm reaching forward on the right (arm-r) and a little welding torch on the left (arm-l); both lift when it mends. Parts: #arm-l, #arm-r, #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
