<!-- GILDED GOLEM (round 9): a stone golem seen from above in the heroes' bust build: two great boulders for shoulders, a body stone behind a squarish head stone with a rune glowing on its brow (no eyes), two great stone fists (arm-l, arm-r, they swing); its stone plated in gold: polished gold plates on the shoulder stones and the fists, and a polished gold front plate over its chest (it turns shots back). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
