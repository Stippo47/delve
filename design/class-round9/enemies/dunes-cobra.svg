<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- COBRA (round 9): a cobra seen from above, reared with its hood spread: a wide sandy hood with dark bands across its back, a pale cream front edge, a small head at the front with a dark forked tongue flicking out; behind the hood its body lies in a loose coil, banded, ending in a thin tail (#back, sways). No eyes (and no eye-spots on the hood). Parts: #back (the coiled body), #body (hood and head). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
