<!-- BEE (round 9): a small mechanical bee seen from above, in copper: a round striped abdomen with dark iron bands and a short stinger at the back, a thorax, a round head; two pairs of wings of thin pale plate with a rib down each (arm-l, arm-r: they flap). The bronze and steel bees are this art turned by the game. No eyes. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
