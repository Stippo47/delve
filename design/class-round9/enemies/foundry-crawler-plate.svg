<!-- CHAIN CRAWLER, plate (round 9): one plated segment of the chain crawler seen from above (the chain of them follows its head, each its own hit circle): a rounded steel plate with a raised ridge across it and rivets, two little jointed legs out each side. Front = towards the head. Parts: #body only. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
