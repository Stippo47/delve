<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- FIRE SPIDER (round 9): the frost spider's build (round abdomen, small head, two fangs, four smooth jointed legs a side) as a spider of the pit: coal black, every knee glowing orange like a coal, a glowing orange hourglass and cracks on the abdomen, orange-hot fangs. No eyes. Parts: #back (abdomen and the six back legs, sways), #arm-l / #arm-r (the front legs, they strike), #body (head and fangs). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
