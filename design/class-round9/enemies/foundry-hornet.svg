<!-- HORNET (round 9): a big heavy mechanical hornet seen from above, in copper: a fat abdomen with three iron bands and a stinger, a big thorax, a broad head with two iron mandibles; broad plate wings (arm-l, arm-r: they flap). The bronze and steel hornets are this art turned by the game. No eyes. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
