<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- LASER TURRET (round 9): a turret mounted on a wall, seen from above: a riveted plate on the wall behind it (#back), a dark housing with cooling fins down both sides and a long barrel ending in a big red glass lens. Parts: #back (the wall plate), #body (housing, fins, barrel and lens). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
