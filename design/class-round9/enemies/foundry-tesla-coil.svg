<linearGradient id="g4" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5E3316" stop-opacity="0"/><stop offset="1" stop-color="#5E3316" stop-opacity="0.42"/></linearGradient>
<clipPath id="c2"><use href="#s2"/></clipPath>
<path id="s3" d="M 72 100 A 28 28 0 1 0 128 100 A 28 28 0 1 0 72 100 Z"/>
<clipPath id="u3"><use href="#s1"/><use href="#s2"/></clipPath>
<linearGradient id="g5" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#A1ACBD"/><stop offset="1" stop-color="#73859F"/></linearGradient>
<linearGradient id="g6" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A4555" stop-opacity="0"/><stop offset="1" stop-color="#3A4555" stop-opacity="0.42"/></linearGradient>
