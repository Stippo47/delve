<linearGradient id="g8" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C3811" stop-opacity="0"/><stop offset="1" stop-color="#6C3811" stop-opacity="0.42"/></linearGradient>
<clipPath id="c4"><use href="#s4"/></clipPath>
</defs>
<g id="sprite" filter="url(#outline)">
