<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- MUMMY (round 9): the heroes' bust build wrapped from head to fists in old linen: cream bandages wound in bands round the head (no face showing, no eyes), over the shoulders and down the arms, grubby and darker in places; loose ends trailing behind it (#back, sway); two wrapped fists reaching forward (arm-l, arm-r, they swing). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
