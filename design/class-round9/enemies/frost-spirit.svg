<radialGradient id="gSpfrost" cx="0.4" cy="0.36" r="0.72"><stop offset="0" stop-color="#F4FCFF"/><stop offset="0.55" stop-color="#C9E9F7"/><stop offset="1" stop-color="#8ED0EE"/></radialGradient><linearGradient id="gSpfrostT" x1="0" y1="1" x2="0.3" y2="0"><stop offset="0" stop-color="#E6F8FF"/><stop offset="1" stop-color="#7EC2E6"/></linearGradient>
