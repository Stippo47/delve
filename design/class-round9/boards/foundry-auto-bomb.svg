<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- BOMB BOT (round 9): a round iron bomb on four stubby legs, seen from above: a black iron ball with a ring of rivets, a brass fuse cap on top (the middle, seen from above) with a short fuse curling back, a small grille at the front; brass feet. No eyes. The game draws the fuse's sparks. The auto bomb bot is this art recoloured. Parts: #back (the back legs), #arm-l / #arm-r (the front legs, they swing as it runs), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
