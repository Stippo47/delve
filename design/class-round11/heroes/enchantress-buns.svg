<!-- ENCHANTRESS (round 11, "buns"): the charming hero, her own bust (she wore the Witch's, recoloured): blonde hair parted in the middle and tied up in two big round buns at the back of her head, so that her head and the buns make a heart from above; a rose ribbon on each bun; puffed sleeves of rose silk; a heart-shaped gold locket on a chain under her chin; her left hand held up to blow a kiss, a little heart on it (arm-l: her casting hand). No hat, no eyes, the heroes' small mouth. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
