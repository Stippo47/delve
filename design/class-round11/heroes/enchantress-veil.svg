<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- ENCHANTRESS (round 11, "veil"): the charming hero, her own bust (she wore the Witch's, recoloured): dark hair under a long rose silk veil that falls back over her shoulders (#back, sways), held by a gold circlet with a heart ruby on the brow; a folded fan in her right hand; a heart-shaped gold locket on a chain under her chin; her left hand held up to blow a kiss, a little heart on it (arm-l: her casting hand). No hat, no eyes, the heroes' small mouth. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
