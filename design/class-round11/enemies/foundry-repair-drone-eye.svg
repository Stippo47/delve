<linearGradient id="g4" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#416492" stop-opacity="0"/><stop offset="1" stop-color="#416492" stop-opacity="0.42"/></linearGradient>
<clipPath id="c2"><use href="#s2"/></clipPath>
<path id="s3" d="M 121.1 100.9 C 126 101.1 150.9 95.2 155.1 92.9 C 159.4 90.5 157.7 83.4 152.9 83.1 C 148 82.9 123.1 88.8 118.9 91.1 C 114.6 93.5 116.3 100.6 121.1 100.9 Z"/>
