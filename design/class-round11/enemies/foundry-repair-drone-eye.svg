<g clip-path="url(#u6)"><use href="#s6" transform="translate(0 3) " fill="#2B2230" opacity="0.3"/></g><use href="#s6" fill="url(#g7)"/><use href="#s6" fill="url(#g8)"/><g clip-path="url(#c6)"><path d="M 89 140 A 11 11 0 1 0 111 140 A 11 11 0 1 0 89 140 Z" fill="#22303E"/><path d="M 92.5 141 A 7.5 7.5 0 1 0 107.5 141 A 7.5 7.5 0 1 0 92.5 141 Z" fill="#5AC8F0"/><circle cx="95.5" cy="135.5" r="3" fill="#FFFFFF"/></g>
</g>
</g>
