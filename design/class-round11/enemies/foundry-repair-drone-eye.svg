<use href="#s1" fill="url(#g1)"/><use href="#s1" fill="url(#g2)"/>
<g clip-path="url(#u2)"><use href="#s2" transform="translate(0 2) " fill="#2B2230" opacity="0.3"/></g><use href="#s2" fill="url(#g3)"/><use href="#s2" fill="url(#g4)"/><g clip-path="url(#c2)"><path d="M 46 88 L 22 76 L 22 100 Z M 46 88 L 70 76 L 70 100 Z" fill="#8E9AAA" opacity="0.55"/><circle cx="46" cy="88" r="25" fill="none" stroke="#8A909C" stroke-width="5"/><circle cx="46" cy="88" r="6" fill="#4A4E58"/></g>
<use href="#s3" fill="url(#g1)"/><use href="#s3" fill="url(#g2)"/>
