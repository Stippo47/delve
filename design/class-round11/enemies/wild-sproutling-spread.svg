<g clip-path="url(#u5)"><use href="#s5" transform="translate(0 2) " fill="#2B2230" opacity="0.3"/></g><use href="#s5" fill="url(#g1)"/><use href="#s5" fill="url(#g2)"/>
</g>
</g>
</svg>
