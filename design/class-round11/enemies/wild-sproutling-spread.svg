</defs>
<g id="sprite" filter="url(#outline)">
<g id="body">
<use href="#s1" fill="url(#g1)"/><use href="#s1" fill="url(#g2)"/><g clip-path="url(#c1)"><path d="M 68 94 A 18 12 0 1 0 104 94 A 18 12 0 1 0 68 94 Z" fill="#C4E48A" opacity="0.6"/><path d="M 54 124 Q 100 150 146 124 L 146 160 L 54 160 Z" fill="#6E9E44" opacity="0.4"/></g>
</g>
<g id="top" data-pivot="100 96"><!-- seed leaves and shoot -->
<g clip-path="url(#u2)"><use href="#s2" transform="translate(0 4) translate(100 96) rotate(98)" fill="#2B2230" opacity="0.3"/></g><use href="#s2" transform="translate(100 96) rotate(98)" fill="url(#g3)"/><use href="#s2" transform="translate(100 96) rotate(98)" fill="url(#g4)"/><g clip-path="url(#c2)"><g transform="translate(100 96) rotate(98)"><path d="M 0 6 L 0 66" stroke="#4A7A34" stroke-width="3" stroke-linecap="round" opacity="0.6"/><path d="M -24 0 L 0 0 L 0 78 L -24 78 Z" fill="#FFFFF4" opacity="0.1"/></g></g>
<g clip-path="url(#u3)"><use href="#s3" transform="translate(0 4) translate(100 96) rotate(262)" fill="#2B2230" opacity="0.3"/></g><use href="#s3" transform="translate(100 96) rotate(262)" fill="url(#g3)"/><use href="#s3" transform="translate(100 96) rotate(262)" fill="url(#g4)"/><g clip-path="url(#c3)"><g transform="translate(100 96) rotate(262)"><path d="M 0 6 L 0 66" stroke="#4A7A34" stroke-width="3" stroke-linecap="round" opacity="0.6"/><path d="M -24 0 L 0 0 L 0 78 L -24 78 Z" fill="#FFFFF4" opacity="0.1"/></g></g>
