<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- SPROUTLING (round 11, "spread": the round-8 design, no arms, fewer leaves): a small walking sapling seen from above: a round green bud of a head, two big seed leaves standing out to the sides and a curled shoot standing up between them. No arms, no face. Parts: #back (the leaves and shoot, sway), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
<defs>
<filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="gHand" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8D4B2"/><stop offset="1" stop-color="#DFA57F"/></radialGradient><linearGradient id="gUnder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A2E2A" stop-opacity="0.5"/><stop offset="0.45" stop-color="#5A2E2A" stop-opacity="0"/></linearGradient><linearGradient id="gFace" x1="0" y1="95" x2="0" y2="153" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B07560"/><stop offset="0.2" stop-color="#D9A27F"/><stop offset="0.45" stop-color="#F2C7A0"/><stop offset="0.85" stop-color="#F4CBA6"/><stop offset="1" stop-color="#E6B590"/></linearGradient><linearGradient id="gFaceSide" x1="100" y1="0" x2="156" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8A4E36" stop-opacity="0"/><stop offset="1" stop-color="#8A4E36" stop-opacity="0.28"/></linearGradient>
<path id="s1" d="M 58 110 A 42 42 0 1 0 142 110 A 42 42 0 1 0 58 110 Z"/>
<linearGradient id="g1" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#AAD279"/><stop offset="1" stop-color="#88C43F"/></linearGradient>
<linearGradient id="g2" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48691E" stop-opacity="0"/><stop offset="1" stop-color="#48691E" stop-opacity="0.42"/></linearGradient>
<clipPath id="c1"><use href="#s1"/></clipPath>
<path id="s2" d="M 0 0 C 5.8 0 18.4 17.7 21.6 23.4 C 24.8 29.1 26.9 35.6 24 42.9 C 21.1 50.2 6.4 78 0 78 C -6.4 78 -21.1 50.2 -24 42.9 C -26.9 35.6 -24.8 29.1 -21.6 23.4 C -18.4 17.7 -5.8 0 0 0 Z"/>
<clipPath id="u2"><use href="#s1"/></clipPath>
<linearGradient id="g3" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#79B04F"/><stop offset="1" stop-color="#5E8B3C"/></linearGradient>
<linearGradient id="g4" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#314A1E" stop-opacity="0"/><stop offset="1" stop-color="#314A1E" stop-opacity="0.42"/></linearGradient>
<clipPath id="c2"><use href="#s2" transform="translate(100 96) rotate(98)"/></clipPath>
<path id="s3" d="M 0 0 C 5.8 0 18.4 17.7 21.6 23.4 C 24.8 29.1 26.9 35.6 24 42.9 C 21.1 50.2 6.4 78 0 78 C -6.4 78 -21.1 50.2 -24 42.9 C -26.9 35.6 -24.8 29.1 -21.6 23.4 C -18.4 17.7 -5.8 0 0 0 Z"/>
