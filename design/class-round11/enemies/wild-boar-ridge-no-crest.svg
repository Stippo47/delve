<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- THORNBACK BOAR (round 10, variant "ridge"): a stout wild boar seen from above in the wolves' capsule build: a crest of dark bristles down the spine with three big pale thorns standing in it; a little tufted tail, a round skull with small pointed ears, a blunt snout with a pink-grey disc and two nostrils, two tusks curving up from the sides of it; two front hooves. No eyes. Parts: #back (tail, sways), #body, #arm-l / #arm-r (front legs and hooves, swing to walk), #front (snout and tusks, over the legs). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
