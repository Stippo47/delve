<!-- MORTAR (round 11, "pot"): a floor mortar seen from straight above, its barrel aiming straight up: a squat wide pot of a mortar: a heavy bolted lip round a wide round bore, a carrying handle at each side. The muzzle sits a little forward of the middle of the plate it turns on, so the turn shows. The riveted base plate stays still with two spare shells on it (#back); the fire and gas mortars are this art with the brass turned red and green by the game. Parts: #back (the base and shells), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
