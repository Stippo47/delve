<!-- MORTAR (round 11, "trunnion"): a floor mortar seen from straight above, its barrel aiming straight up: the tube held in a brass cradle between two trunnion blocks, a sight notch on the front of its muzzle ring. The muzzle sits a little forward of the middle of the plate it turns on, so the turn shows. The riveted base plate stays still with two spare shells on it (#back); the fire and gas mortars are this art with the brass turned red and green by the game. Parts: #back (the base and shells), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
