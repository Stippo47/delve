<!-- TORCH BANDIT (round 11, "cowl"): the gang's leather and red bandanna, a broad sword in the right hand (arm-r, under the shoulder) and a burning torch held out in the left (arm-l): a long haft, an iron basket, a big flame in three tongues. A ragged sackcloth cowl over head and shoulders, patched and stitched, its point hanging back. No eyes. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
