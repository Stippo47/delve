<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GILDED GOLEM (round 11, gilding "veins", on round 10's body A "boulders"): three big round stones and two fist stones; veins of gold run through cracks in every stone; the eye white on bare stone: no gold plate round it (the designer: "Don't like the gold mask look"). Parts: #arm-l / #arm-r (the fists, swing), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
