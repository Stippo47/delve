<!-- THE ALPHA (round 8): the giant wolf, pack leader: pale silver fur, a great mane of pointed tufts over the shoulders, one ear torn, an old scar across the brow in one darker shade, the werewolf's skull and snout, big paws with white claws, a long bushy tail. No eyes. Round 11: the head 7 units further forward, the body 12 shorter. Parts: #back (tail, sways), #arm-l / #arm-r (front paws, under the body: round 11), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
