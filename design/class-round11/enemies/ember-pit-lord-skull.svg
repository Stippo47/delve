<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- THE PIT LORD (round 10): the Ember Deep's lord, drawn again to stand apart from the red devil and the demon: a great figure of black obsidian in the heroes' bust build, cracked through with glowing lava: broad black shoulders with molten cracks, a heavy iron collar, an obsidian head with a jagged molten grin (no eyes) and two huge pale bone horns sweeping out and back, two red bat wings spread behind (#back, sway); a whip of fire in the right hand (arm-r: the handle in the fist, the burning lash curling in across the front), a clawed left hand (arm-l). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
