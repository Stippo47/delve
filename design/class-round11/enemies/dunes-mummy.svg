<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- MUMMY (round 10): the heroes' bust build wrapped head to fists in old grey-green linen: a head wound in broad crossing bands with one dark slit across it where the eyes would be (nothing in it), a loose end hanging by its cheek, a turquoise scarab on a gold collar; no arms (round 11); a long strip of bandage flying back from one shoulder and a short one from the other (#back, sway). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
