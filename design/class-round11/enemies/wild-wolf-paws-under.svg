<!-- WOLF (round 8): a grey wolf seen from above, capsule-shaped and simple (the designer: "capsule shaped", "too complex", "match the werewolf"): one rounded capsule of a body, a bushy tail with a dark tip, the werewolf's round skull, laid-back ears, long snout with a pale muzzle and dark nose, a scalloped ruff and two front paws with white claws. No eyes. Round 11: the head 7 units further forward, the body 12 shorter. Parts: #back (tail, sways), #arm-l / #arm-r (front paws, under the body: round 11), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
