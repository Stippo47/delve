<!-- POACHER (round 11, "game"): a woodland hunter, not one of the masked gang: a bald head under a knotted rag, a big grey beard (no mask), two shot pheasants slung across the back; a leather jerkin; the short dark recurve bow of round 10 held out in front (arm-l, with its string) and an arrow in the drawing hand (arm-r). No eyes. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
