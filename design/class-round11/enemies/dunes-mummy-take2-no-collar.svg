<!-- MUMMY (round 10, second take: the first read as a table with legs): a wrapped person in the heroes' bust build, drawn as the heroes are: shoulders in old linen under a broad gold and turquoise collar, a bandaged head with one dark slit across it where the eyes would be (nothing in it), two wrapped fists in front where a hero's are (arm-l, arm-r, they swing), and two long loose wrappings trailing back together from the back of its head like a scarf's tails (#back, sway). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
