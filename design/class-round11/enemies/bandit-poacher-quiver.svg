<!-- POACHER (round 11, "quiver"): a woodland hunter, not one of the masked gang: a moss-green hood and cloth over the lower face, a quiver slung on the back with a fan of red-feathered arrows; a leather jerkin; the short dark recurve bow of round 10 held out in front (arm-l, with its string) and an arrow in the drawing hand (arm-r). No eyes. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
