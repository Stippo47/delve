<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GOLEM (round 11, body "cairn"): a stone golem seen from above: a cairn that walks: three flat slabs stacked, each smaller than the one under it, the top one its head; two loose stones for fists; on its head the eye: a diamond rune that glows (no other face). Weathered grey stone, a little moss. Parts: #arm-l / #arm-r (the fists, swing), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
