<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- GOLEM (round 11, body "shards"): a stone golem seen from above: split slate: two angular plates for shoulders, a wedge of a head between them, two long shards for arms; on its head the eye: a diamond rune that glows (no other face). Weathered grey stone, a little moss. Parts: #arm-l / #arm-r (the fists, swing), #body. Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
<defs>
<filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="gHand" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#F8D4B2"/><stop offset="1" stop-color="#DFA57F"/></radialGradient><linearGradient id="gUnder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A2E2A" stop-opacity="0.5"/><stop offset="0.45" stop-color="#5A2E2A" stop-opacity="0"/></linearGradient><linearGradient id="gFace" x1="0" y1="95" x2="0" y2="153" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B07560"/><stop offset="0.2" stop-color="#D9A27F"/><stop offset="0.45" stop-color="#F2C7A0"/><stop offset="0.85" stop-color="#F4CBA6"/><stop offset="1" stop-color="#E6B590"/></linearGradient><linearGradient id="gFaceSide" x1="100" y1="0" x2="156" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8A4E36" stop-opacity="0"/><stop offset="1" stop-color="#8A4E36" stop-opacity="0.28"/></linearGradient>
<path id="s1" d="M 56 104 L 24 112 L 18 150 L 30 186 L 50 168 L 54 136 Z"/>
<linearGradient id="g1" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#B6B0A7"/><stop offset="1" stop-color="#948A7D"/></linearGradient>
<linearGradient id="g2" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F4840" stop-opacity="0"/><stop offset="1" stop-color="#4F4840" stop-opacity="0.42"/></linearGradient>
<clipPath id="c1"><use href="#s1"/></clipPath>
<path id="s2" d="M 144 104 L 176 112 L 182 150 L 170 186 L 150 168 L 146 136 Z"/>
<clipPath id="c2"><use href="#s2"/></clipPath>
<path id="s3" d="M 96 60 L 50 46 L 14 76 L 22 118 L 60 132 L 92 112 Z"/>
<linearGradient id="g3" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#ADA69B"/><stop offset="1" stop-color="#8E8273"/></linearGradient>
<linearGradient id="g4" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B443C" stop-opacity="0"/><stop offset="1" stop-color="#4B443C" stop-opacity="0.42"/></linearGradient>
<clipPath id="c3"><use href="#s3"/></clipPath>
<path id="s4" d="M 104 60 L 150 46 L 186 76 L 178 118 L 140 132 L 108 112 Z"/>
<clipPath id="u4"><use href="#s1"/><use href="#s2"/><use href="#s3"/></clipPath>
<clipPath id="c4"><use href="#s4"/></clipPath>
<path id="s5" d="M 100 66 L 132 84 L 126 132 L 100 158 L 74 132 L 68 84 Z"/>
<clipPath id="u5"><use href="#s1"/><use href="#s2"/><use href="#s3"/><use href="#s4"/></clipPath>
<linearGradient id="g5" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#C0BAB3"/><stop offset="1" stop-color="#9C9286"/></linearGradient>
<linearGradient id="g6" x1="0.45" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#544C44" stop-opacity="0"/><stop offset="1" stop-color="#544C44" stop-opacity="0.42"/></linearGradient>
<clipPath id="c5"><use href="#s5"/></clipPath>
</defs>
<g id="sprite" filter="url(#outline)">
<g id="arm-l" data-pivot="40 112"><!-- a shard of an arm -->
<use href="#s1" fill="url(#g1)"/><use href="#s1" fill="url(#g2)"/><g clip-path="url(#c1)"><path d="M 24 112 L 18 150 L 30 186 L 34 140 Z" fill="#6E6860" opacity="0.35"/></g>
</g>
<g id="arm-r" data-pivot="160 112"><!-- a shard of an arm -->
<use href="#s2" fill="url(#g1)"/><use href="#s2" fill="url(#g2)"/><g clip-path="url(#c2)"><path d="M 176 112 L 182 150 L 170 186 L 166 140 Z" fill="#6E6860" opacity="0.35"/></g>
</g>
<g id="body">
<use href="#s3" fill="url(#g3)"/><use href="#s3" fill="url(#g4)"/><g clip-path="url(#c3)"><path d="M 96 60 L 50 46 L 50 96 L 92 112 Z" fill="#FFFFF4" opacity="0.14"/><path d="M 32 64 A 14 6 0 1 0 60 64 A 14 6 0 1 0 32 64 Z" fill="#7E9A5A" opacity="0.9"/></g>
<g clip-path="url(#u4)"><use href="#s4" transform="translate(0 3) " fill="#2B2230" opacity="0.3"/></g><use href="#s4" fill="url(#g3)"/><use href="#s4" fill="url(#g4)"/><g clip-path="url(#c4)"><path d="M 150 46 L 186 76 L 178 118 L 150 96 Z" fill="#FFFFF4" opacity="0.14"/></g>
<g clip-path="url(#u5)"><use href="#s5" transform="translate(0 5) " fill="#2B2230" opacity="0.3"/></g><use href="#s5" fill="url(#g5)"/><use href="#s5" fill="url(#g6)"/><g clip-path="url(#c5)"><path d="M 100 66 L 132 84 L 126 132 L 100 158 Z" fill="#6E6860" opacity="0.22"/><circle cx="100" cy="114" r="15" fill="#FFC84A" opacity="0.16" transform="translate(0 -2) translate(100 114) scale(1.0) translate(-100 -114)"/><path d="M 100 104 L 108 114 L 100 124 L 92 114 Z" fill="none" stroke="#FFC84A" stroke-width="3.5" stroke-linejoin="round" transform="translate(0 -2) translate(100 114) scale(1.0) translate(-100 -114)"/></g>
</g>
</g>
</svg>
