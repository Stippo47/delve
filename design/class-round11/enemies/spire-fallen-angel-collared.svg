<!-- FALLEN ANGEL (round 11, "collared"): one of the host, fallen, on the picked angel's build, ashen skin, no eyes: its gold halo has fallen and hangs round its neck as a collar; a deep violet cowl up over the head, whole wings gone dusk-violet; a long-handled scythe (arm-r, under the shoulder), the left hand free (arm-l); wings in #back (sway). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
