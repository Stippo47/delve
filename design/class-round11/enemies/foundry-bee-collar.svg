<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="220" height="220">
<!-- BEE (round 11, cogs "collar"): the basic mechanical bee, built from the wasp (the designer: "a good base for the basic bee. Maybe a bit fatter"): a round copper head with one red glass eye and two feelers, one plump striped abdomen with a short iron stinger, a brass cog worn as a collar between head and abdomen; one wing of thin pale plate a side, drawn over the body (arm-l, arm-r, after #body: they flap). Parts: #body, #arm-l / #arm-r (wings, on top). Parts in draw order inside #sprite; the outline comes from the #outline filter. Facing = DOWN (+y), centre (100,100). Hands and whatever they hold are in the arm groups, never in #body. -->
<defs>
<filter id="outline" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="6 2.5" result="a"/><feMorphology in="SourceAlpha" operator="dilate" radius="2.5 6" result="b"/><feMorphology in="SourceAlpha" operator="dilate" radius="4.6" result="c"/><feMerge result="d"><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/></feMerge><feFlood flood-color="#2B2230"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
