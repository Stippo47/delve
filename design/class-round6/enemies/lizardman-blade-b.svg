<!-- LIZARDMAN B "desert blade" (round 6, version b: the round-4 design without eyes and with the heroes' face shading over the head; was round 4 variant). A sand lizard: tan scales with dark brown bands across the back of the head and shoulders, a shorter wedge snout, big amber eyes set on the top of the head, a red cloth sash over one shoulder. A scimitar whose blade curves IN toward the centre line (the round-3 one curved out). Parts: #back = tail, #arm-r = scimitar + fist (before #body), #body, #arm-l = empty claw. Facing = DOWN (+y), centre (100,100). -->
