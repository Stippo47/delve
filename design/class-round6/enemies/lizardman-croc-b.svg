<!-- LIZARDMAN C "croc" (round 6, version b: the round-4 design without eyes and with the heroes' face shading over the head; was round 4 variant). A heavier swamp croc-man: dark moss-brown hide, a broad flat snout with a row of teeth showing along each side, eyes on raised bumps, a double row of armour ridges down the back of the head. A turtle-shell shield in front (hand hidden) and a bone club behind the right shoulder. Parts: #back = thick tail, #arm-r = club + fist (before #body), #body, #arm-l = shield. Facing = DOWN (+y), centre (100,100). -->
